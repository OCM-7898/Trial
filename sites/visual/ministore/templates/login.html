{% extends "base.html" %}
{% block title %}{{ S.login_h }}{% endblock %}
{% block content %}
<h2>{{ S.login_h }}</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>{{ S.username }} <input name="username"></label><br><br>
  <label>{{ S.password }} <input type="password" name="password"></label><br><br>
  <button class="btn">{{ S.log_in }}</button>
</form>
{% endblock %}
