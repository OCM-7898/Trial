{% extends "base.html" %}
{% block title %}{{ S.sell_title }}{% endblock %}
{% block content %}
<h1>{{ S.sell_title }}</h1>
<p class="muted">{{ S.sell_intro }}</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="panel">
<form class="stack" method="post" action="/sell">
  <label>{{ S.brand }} *</label>
  <select name="brand">
    {% for b in brands %}<option value="{{ b }}"{% if d.brand == b %} selected{% endif %}>{{ b }}</option>{% endfor %}
    <option value="Other"{% if d.brand == 'Other' %} selected{% endif %}>{{ S.other_brand }}</option>
  </select>
  <label>{{ S.model }} *</label>
  <input type="text" name="model" value="{{ d.model }}">
  <label>{{ S.year }} *</label>
  <input type="text" name="year" value="{{ d.year }}">
  <label>{{ S.mileage_km }} *</label>
  <input type="text" name="mileage_km" value="{{ d.mileage_km }}">
  <label>{{ S.price_pkr }} *</label>
  <input type="text" name="price" value="{{ d.price }}">
  <label>{{ S.city }} *</label>
  <select name="city">
    {% for c in cities %}<option value="{{ c }}"{% if d.city == c %} selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  <label>{{ S.color }}</label>
  <input type="text" name="color" value="{{ d.color }}">
  <label>{{ S.transmission }}</label>
  <select name="transmission">
    {% for t in transmissions %}<option value="{{ t }}"{% if d.transmission == t %} selected{% endif %}>{{ t }}</option>{% endfor %}
  </select>
  <label>{{ S.fuel }}</label>
  <select name="fuel">
    {% for f in fuels %}<option value="{{ f }}"{% if d.fuel == f %} selected{% endif %}>{{ f }}</option>{% endfor %}
  </select>
  <label>{{ S.engine_cc }}</label>
  <input type="text" name="engine_cc" value="{{ d.engine_cc }}">
  <label>{{ S.phone }} *</label>
  <input type="text" name="phone" value="{{ d.phone }}">
  <label>{{ S.ad_description }}</label>
  <textarea name="description">{{ d.description }}</textarea>
  <button type="submit">{{ S.continue_review }}</button>
</form>
</div>
{% endblock %}
