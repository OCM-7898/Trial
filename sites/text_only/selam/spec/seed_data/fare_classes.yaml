# Nine fare classes across two cabins (CLAUDE.md 12).
#
# The spread is deliberate, not decorative: CLAUDE.md 9.2 requires seeded
# bookings that are refundable / non-refundable / partially refundable and
# changeable free / for a fee / not at all. Those branches have to exist in the
# fare table before a booking can exhibit them.
#
# Cabin names come from brand.py via t(); these name_* fields are the fare
# family names, which are brand-adjacent but distinct from the cabin itself.
# Codes stay Latin in both builds (CLAUDE.md 11.1).
