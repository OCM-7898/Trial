  summary_hi: श्रेणी के अनुसार पूरी सूची, प्रत्येक कहाँ जा सकती है सहित।
  summary_ur: زمرے کے مطابق مکمل فہرست، ہر ایک کہاں جا سکتی ہے سمیت۔
  body_html_bn: '<h2>ব্যাটারি ও মোটরচালিত ডিভাইস</h2><p>100 Wh পর্যন্ত অতিরিক্ত লিথিয়াম ব্যাটারি
    শুধু কেবিনে যায়, টার্মিনাল টেপ দিয়ে ঢেকে। 100 থেকে 160 Wh-এর মধ্যে আগাম অনুমোদনসহ দুটি
    বহন করতে পারেন। 160 Wh-এর উপরে আমরা একেবারেই বহন করতে পারি না।</p><p>মোটরচালিত হুইলচেয়ার
    বহন করা হয়, তবে সঠিক হ্যান্ডলিংয়ের ব্যবস্থার জন্য ব্যাটারির ধরন অন্তত 48 ঘণ্টা আগে ঘোষণা
    করতে হবে।</p><h2>তরল, অ্যারোসল ও জেল</h2><p>কেবিনে: 100 ml পর্যন্ত পাত্র, এক লিটার পর্যন্ত
    একটি স্বচ্ছ ব্যাগে। হোল্ডে: যেকোনো একক জিনিসের 2 লিটার পর্যন্ত এবং মোট 2 kg, শুধু প্রসাধনী
    ও ওষুধের জন্য।</p><h2>ধারালো ও সূচালো জিনিস</h2><p>6 cm-এর কম ব্লেডের কাঁচি কেবিনে অনুমোদিত।
    তার চেয়ে লম্বা যেকোনো কিছু, এবং চিকিৎসার সূচ ছাড়া সব ছুরি, যন্ত্রপাতি ও সূচ চেক করতে
    হবে।</p>'
  body_html_hi: '<h2>बैटरियाँ और मोटर चालित उपकरण</h2><p>100 Wh तक की अतिरिक्त लिथियम बैटरियाँ
    केवल केबिन में जाती हैं, टर्मिनल टेप किए हुए। 100 से 160 Wh के बीच आप पूर्व अनुमोदन के
    साथ दो ले जा सकते हैं। 160 Wh से ऊपर हम उन्हें बिल्कुल नहीं ले जा सकते।</p><p>मोटर चालित
    व्हीलचेयर ले जाई जाती हैं, लेकिन सही हैंडलिंग की व्यवस्था के लिए बैटरी का प्रकार कम से
    कम 48 घंटे पहले घोषित करना होगा।</p><h2>तरल, एरोसोल और जेल</h2><p>केबिन में: 100 ml तक
    के कंटेनर, एक लीटर तक के एक पारदर्शी बैग में। होल्ड में: किसी एक वस्तु का 2 लीटर तक और
    कुल 2 kg, केवल प्रसाधन और दवाओं के लिए।</p><h2>नुकीली और धारदार वस्तुएँ</h2><p>6 cm से
    छोटे ब्लेड वाली कैंची केबिन में अनुमत है। उससे लंबी कोई भी चीज़, और चिकित्सीय के अलावा
    सभी चाकू, औज़ार और सुइयाँ, चेक की जानी चाहिए।</p>'
  body_html_ur: '<h2>بیٹریاں اور بجلی سے چلنے والے آلات</h2><p>100 Wh تک کی فالتو لیتھیم بیٹریاں
    صرف کیبن میں سفر کرتی ہیں، ٹرمینل ٹیپ کیے ہوئے۔ 100 سے 160 Wh کے درمیان آپ پیشگی منظوری
    کے ساتھ دو لے جا سکتے ہیں۔ 160 Wh سے اوپر ہم انہیں بالکل نہیں لے جا سکتے۔</p><p>بجلی سے
    چلنے والی وہیل چیئرز لے جائی جاتی ہیں، لیکن درست ہینڈلنگ کے انتظام کے لیے بیٹری کی قسم
    کم از کم 48 گھنٹے پہلے ظاہر کرنی ہوگی۔</p><h2>مائعات، ایروسول اور جیل</h2><p>کیبن میں:
    100 ml تک کے کنٹینر، ایک لیٹر تک کے ایک شفاف بیگ میں۔ ہولڈ میں: کسی ایک چیز کا 2 لیٹر
    تک اور کل 2 kg، صرف ٹوائلٹریز اور ادویات کے لیے۔</p><h2>تیز اور نوکیلی اشیا</h2><p>6 cm
    سے چھوٹے بلیڈ والی قینچی کیبن میں جائز ہے۔ اس سے لمبی کوئی بھی چیز، اور طبی سوئیوں کے
    علاوہ تمام چاقو، اوزار اور سوئیاں، چیک کی جانی چاہئیں۔</p>'
- slug: musical-instruments
  category: baggage
  position: 7
  title_en: Musical instruments
  title_am: የሙዚቃ መሣሪያዎች
  summary_en: Which instruments travel in the cabin, which need a seat, and which go in the
    hold.
  summary_am: የትኞቹ መሣሪያዎች በካቢን እንደሚጓዙ፣ የትኞቹ መቀመጫ እንደሚያስፈልጋቸው፣ የትኞቹም በጭነት ክፍል እንደሚሄዱ።
  body_html_en: <h2>In the cabin</h2><p>An instrument within the cabin baggage dimensions
    -- 55 x 38 x 20 cm -- counts as your cabin bag. Violins and flutes normally qualify; guitars
    do not.</p><h2>On an extra seat</h2><p>Instruments up to 80 kg and 165 cm may travel on
    a seat bought for them, at the adult fare for the cabin, booked at least 72 hours ahead.
    The instrument must be in a hard case and is secured by the crew.</p><h2>In the hold</h2><p>Larger
    instruments travel as checked baggage in a hard flight case, at the special-baggage rate.
    We do not accept liability for instruments carried in the hold in a soft case.</p>
  body_html_am: <h2>በካቢን ውስጥ</h2><p>በእጅ ሻንጣ መጠን ውስጥ ያለ መሣሪያ -- 55 x 38 x 20 ሴሜ -- እንደ የእጅ
    ሻንጣዎ ይቆጠራል። ቫዮሊንና ፍሉት በተለምዶ ብቁ ናቸው፤ ጊታሮች ግን አይደሉም።</p><h2>በተጨማሪ መቀመጫ</h2><p>እስከ 80 ኪግ
    እና 165 ሴሜ የሆኑ መሣሪያዎች ለእነሱ በተገዛ መቀመጫ ላይ በጉዞ ክፍሉ የአዋቂ ታሪፍ ሊጓዙ ይችላሉ፤ ቢያንስ ከ72 ሰዓት በፊት መያዝ
    አለበት። መሣሪያው በጠንካራ ሳጥን ውስጥ መሆን አለበት፤ በሠራተኞችም ይታሰራል።</p><h2>በጭነት ክፍል</h2><p>ትልልቅ መሣሪያዎች
    በጠንካራ የበረራ ሳጥን ውስጥ እንደ የተመዘገበ ሻንጣ በልዩ ሻንጣ ተመን ይጓዛሉ። በጭነት ክፍል በለስላሳ ሳጥን ለሚወሰዱ መሣሪያዎች ኃላፊነት
    አንወስድም።</p>
  id: 22
  title_bn: বাদ্যযন্ত্র
  title_hi: संगीत वाद्य
  title_ur: موسیقی کے آلات
  summary_bn: কোন বাদ্যযন্ত্র কেবিনে যায়, কোনটির আসন লাগে, আর কোনটি হোল্ডে যায়।
  summary_hi: कौन से वाद्य केबिन में जाते हैं, किन्हें सीट चाहिए, और कौन से होल्ड में जाते
    हैं।
  summary_ur: کون سے آلات کیبن میں جاتے ہیں، کن کو سیٹ درکار ہے، اور کون سے ہولڈ میں جاتے
    ہیں۔
  body_html_bn: <h2>কেবিনে</h2><p>কেবিন ব্যাগেজের মাপের মধ্যে থাকা বাদ্যযন্ত্র -- 55 x 38
    x 20 cm -- আপনার কেবিন ব্যাগ হিসেবে গণ্য হয়। বেহালা ও বাঁশি সাধারণত যোগ্য; গিটার নয়।</p><h2>অতিরিক্ত
    আসনে</h2><p>80 kg ও 165 cm পর্যন্ত বাদ্যযন্ত্র সেই কেবিনের প্রাপ্তবয়স্ক ভাড়ায় কেনা
    আসনে যেতে পারে, অন্তত 72 ঘণ্টা আগে বুক করে। বাদ্যযন্ত্রটি শক্ত কেসে থাকতে হবে এবং ক্রু
    সেটি আটকে দেন।</p><h2>হোল্ডে</h2><p>বড় বাদ্যযন্ত্র শক্ত ফ্লাইট কেসে চেকড ব্যাগেজ হিসেবে
    বিশেষ-ব্যাগেজ হারে যায়। নরম কেসে হোল্ডে বহন করা বাদ্যযন্ত্রের দায় আমরা নিই না।</p>
  body_html_hi: <h2>केबिन में</h2><p>केबिन बैगेज के आयामों -- 55 x 38 x 20 cm -- के भीतर का
    वाद्य आपके केबिन बैग के रूप में गिना जाता है। वायलिन और बाँसुरी आम तौर पर योग्य हैं; गिटार
    नहीं।</p><h2>अतिरिक्त सीट पर</h2><p>80 kg और 165 cm तक के वाद्य उनके लिए खरीदी गई सीट
    पर जा सकते हैं, उस केबिन के वयस्क किराए पर, कम से कम 72 घंटे पहले बुक करके। वाद्य कठोर
    केस में होना चाहिए और क्रू उसे सुरक्षित करते हैं।</p><h2>होल्ड में</h2><p>बड़े वाद्य कठोर
    फ़्लाइट केस में चेक्ड बैगेज के रूप में विशेष-बैगेज दर पर जाते हैं। नरम केस में होल्ड में
    ले जाए गए वाद्यों की ज़िम्मेदारी हम नहीं लेते।</p>
  body_html_ur: <h2>کیبن میں</h2><p>کیبن سامان کے ابعاد -- 55 x 38 x 20 cm -- کے اندر آنے
    والا آلہ آپ کے کیبن بیگ کے طور پر شمار ہوتا ہے۔ وائلن اور بانسری عموماً اہل ہیں؛ گٹار
    نہیں۔</p><h2>اضافی سیٹ پر</h2><p>80 kg اور 165 cm تک کے آلات ان کے لیے خریدی گئی سیٹ پر
    سفر کر سکتے ہیں، اس کیبن کے بالغ کرائے پر، کم از کم 72 گھنٹے پہلے بک کر کے۔ آلہ سخت کیس
    میں ہونا چاہیے اور عملہ اسے محفوظ کرتا ہے۔</p><h2>ہولڈ میں</h2><p>بڑے آلات سخت فلائٹ کیس
    میں چیکڈ سامان کے طور پر خصوصی سامان کی شرح پر سفر کرتے ہیں۔ نرم کیس میں ہولڈ میں لے جائے
    گئے آلات کی ذمہ داری ہم قبول نہیں کرتے۔</p>
- slug: fitness-to-fly
  category: health
  position: 4
  title_en: Fitness to fly
  title_am: ለበረራ ብቁነት
  summary_en: When you may travel without clearance, and when you may not travel at all.
  summary_am: ያለ ፈቃድ መጓዝ የሚችሉት መቼ እንደሆነ፣ እና በፍጹም መጓዝ የማይችሉት መቼ እንደሆነ።
  body_html_en: <h2>Pregnancy</h2><p>You may travel without a letter up to the end of the
    28th week. From 29 to 36 weeks bring a letter from a doctor or midwife dated within 10
    days of travel. After 36 weeks -- 32 for a multiple pregnancy -- we cannot carry you.</p><h2>After
    surgery or illness</h2><p>Wait 24 hours after keyhole surgery and 10 days after chest
    or abdominal surgery. After a heart attack, wait 7 days if recovery was uncomplicated.
    Medical clearance is required inside these periods.</p><h2>Infants</h2><p>Infants may
    fly from seven days old. Below that we carry them only with a neonatal letter.</p>
  body_html_am: <h2>እርግዝና</h2><p>እስከ 28ኛው ሳምንት መጨረሻ ድረስ ያለ ደብዳቤ መጓዝ ይችላሉ። ከ29 እስከ 36 ሳምንት
    ከጉዞ በ10 ቀናት ውስጥ የተጻፈ የሐኪም ወይም የአዋላጅ ደብዳቤ ይዘው ይምጡ። ከ36 ሳምንት በኋላ -- ለብዙ እርግዝና 32 -- ልንወስድዎ
    አንችልም።</p><h2>ከቀዶ ጥገና ወይም ከሕመም በኋላ</h2><p>ከቁልፍ ቀዳዳ ቀዶ ጥገና በኋላ 24 ሰዓት፣ ከደረት ወይም ከሆድ ቀዶ
    ጥገና በኋላ 10 ቀናት ይጠብቁ። ከልብ ድካም በኋላ ማገገሙ ቀላል ከነበረ 7 ቀናት ይጠብቁ። በእነዚህ ጊዜያት ውስጥ የሕክምና ፈቃድ ያስፈልጋል።</p><h2>ጨቅላዎች</h2><p>ጨቅላዎች
    ከሰባት ቀን ዕድሜ ጀምሮ መብረር ይችላሉ። ከዚያ በታች የምንወስዳቸው በኒዮናታል ደብዳቤ ብቻ ነው።</p>
  id: 23
  title_bn: উড়ানের উপযুক্ততা
  title_hi: उड़ान के लिए स्वास्थ्य
  title_ur: پرواز کے لیے صحت
  summary_bn: কখন আপনি ছাড়পত্র ছাড়া ভ্রমণ করতে পারেন, আর কখন একেবারেই পারেন না।
  summary_hi: कब आप बिना मंज़ूरी के यात्रा कर सकते हैं, और कब बिल्कुल नहीं कर सकते।
  summary_ur: کب آپ بغیر اجازت کے سفر کر سکتے ہیں، اور کب بالکل نہیں کر سکتے۔
  body_html_bn: <h2>গর্ভাবস্থা</h2><p>28তম সপ্তাহের শেষ পর্যন্ত আপনি চিঠি ছাড়া ভ্রমণ করতে
    পারেন। 29 থেকে 36 সপ্তাহে ভ্রমণের 10 দিনের মধ্যে তারিখযুক্ত চিকিৎসক বা ধাত্রীর চিঠি আনুন।
    36 সপ্তাহের পরে -- একাধিক গর্ভাবস্থায় 32 -- আমরা আপনাকে বহন করতে পারি না।</p><h2>অস্ত্রোপচার
    বা অসুস্থতার পরে</h2><p>কিহোল অস্ত্রোপচারের পরে 24 ঘণ্টা এবং বুক বা পেটের অস্ত্রোপচারের
    পরে 10 দিন অপেক্ষা করুন। হার্ট অ্যাটাকের পরে, আরোগ্য জটিলতাহীন হলে 7 দিন অপেক্ষা করুন।
    এই সময়ের মধ্যে মেডিকেল ছাড়পত্র প্রয়োজন।</p><h2>নবজাতক</h2><p>নবজাতক সাত দিন বয়স থেকে
    উড়তে পারে। তার নিচে শুধু নবজাতক-বিশেষজ্ঞের চিঠিসহ আমরা বহন করি।</p>
  body_html_hi: <h2>गर्भावस्था</h2><p>28वें सप्ताह के अंत तक आप बिना पत्र के यात्रा कर सकती
    हैं। 29 से 36 सप्ताह में यात्रा के 10 दिनों के भीतर की तिथि वाला डॉक्टर या दाई का पत्र
    लाएँ। 36 सप्ताह के बाद -- बहु-गर्भावस्था में 32 -- हम आपको नहीं ले जा सकते।</p><h2>सर्जरी
    या बीमारी के बाद</h2><p>कीहोल सर्जरी के बाद 24 घंटे और छाती या पेट की सर्जरी के बाद 10
    दिन प्रतीक्षा करें। दिल के दौरे के बाद, यदि रिकवरी जटिलता रहित थी तो 7 दिन प्रतीक्षा करें।
    इन अवधियों के भीतर चिकित्सा मंज़ूरी आवश्यक है।</p><h2>शिशु</h2><p>शिशु सात दिन की आयु
    से उड़ सकते हैं। उससे कम में हम उन्हें केवल नवजात-विशेषज्ञ के पत्र के साथ ले जाते हैं।</p>
  body_html_ur: <h2>حمل</h2><p>28ویں ہفتے کے آخر تک آپ بغیر خط کے سفر کر سکتی ہیں۔ 29 سے 36
    ہفتوں میں سفر کے 10 دنوں کے اندر کی تاریخ والا ڈاکٹر یا دائی کا خط لائیں۔ 36 ہفتوں کے
    بعد -- ایک سے زیادہ بچوں کے حمل میں 32 -- ہم آپ کو نہیں لے جا سکتے۔</p><h2>سرجری یا بیماری
    کے بعد</h2><p>کی ہول سرجری کے بعد 24 گھنٹے اور سینے یا پیٹ کی سرجری کے بعد 10 دن انتظار
    کریں۔ دل کے دورے کے بعد، اگر صحت یابی پیچیدگی سے پاک تھی تو 7 دن انتظار کریں۔ ان ادوار
    کے اندر طبی اجازت درکار ہے۔</p><h2>شیرخوار</h2><p>شیرخوار سات دن کی عمر سے پرواز کر سکتے
    ہیں۔ اس سے کم میں ہم انہیں صرف نوزائیدہ ماہر کے خط کے ساتھ لے جاتے ہیں۔</p>
