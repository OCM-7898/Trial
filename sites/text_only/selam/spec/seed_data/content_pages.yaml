  title_ur: ٹرانزٹ اور ویزا
  summary_bn: ট্রানজিট যাত্রীর কখন ভিসা লাগে, আর কখন লাগে না।
  summary_hi: ट्रांज़िट यात्री को कब वीज़ा चाहिए, और कब नहीं।
  summary_ur: ٹرانزٹ مسافر کو کب ویزا درکار ہے، اور کب نہیں۔
  body_html_bn: <h2>এয়ারসাইড ট্রানজিট</h2><p>একটি বুকিংয়ে একই টার্মিনালের মধ্যে সংযোগকারী
    যাত্রীর সাধারণত ট্রানজিট ভিসা লাগে না। সংযোগের জন্য ট্রানজিট এলাকা ছাড়তে হলে, ব্যাগেজ
    তুলে পুনরায় চেক করতে হলে, বা লেওভার এত দীর্ঘ হলে যে আপনি বিমানবন্দর ছাড়তে চান, ভিসা
    প্রয়োজন।</p>
  body_html_hi: <h2>एयरसाइड ट्रांज़िट</h2><p>एक ही बुकिंग पर एक ही टर्मिनल के भीतर कनेक्ट
    करने वाले यात्री को आम तौर पर ट्रांज़िट वीज़ा की ज़रूरत नहीं होती। वीज़ा तब चाहिए जब कनेक्शन
    के लिए ट्रांज़िट क्षेत्र छोड़ना पड़े, जब बैगेज लेकर फिर से चेक करना पड़े, या जब लेओवर
    इतना लंबा हो कि आप हवाई अड्डा छोड़ना चाहें।</p>
  body_html_ur: <h2>ایئرسائیڈ ٹرانزٹ</h2><p>ایک ہی بکنگ پر ایک ہی ٹرمینل کے اندر کنیکٹ کرنے
    والے مسافر کو عموماً ٹرانزٹ ویزا درکار نہیں ہوتا۔ ویزا اس وقت درکار ہے جب کنکشن کے لیے
    ٹرانزٹ ایریا چھوڑنا پڑے، جب سامان لے کر دوبارہ چیک کرنا پڑے، یا جب لے اوور اتنا طویل ہو
    کہ آپ ہوائی اڈا چھوڑنا چاہیں۔</p>
- slug: restricted-items-full
  category: baggage
  position: 6
  title_en: Dangerous goods and restricted items
  title_am: አደገኛ ዕቃዎችና የተገደቡ ዕቃዎች
  summary_en: The full list, by category, with where each may travel.
  summary_am: በምድብ የተሟላው ዝርዝር፣ እያንዳንዱ የት መጓዝ እንደሚችል።
  body_html_en: '<h2>Batteries and powered devices</h2><p>Spare lithium batteries up to 100
    Wh travel in the cabin only, with terminals taped. Between 100 and 160 Wh you may carry
    two, with prior approval. Above 160 Wh we cannot carry them at all.</p><p>Powered wheelchairs
    are carried, but the battery type must be declared at least 48 hours ahead so the right
    handling is arranged.</p><h2>Liquids, aerosols and gels</h2><p>In the cabin: containers
    of up to 100 ml, in one transparent bag of up to one litre. In the hold: up to 2 litres
    of any single item and 2 kg in total, for toiletries and medicines only.</p><h2>Sharp
    and pointed articles</h2><p>Scissors with blades under 6 cm are allowed in the cabin.
    Anything longer, and all knives, tools and needles other than medical ones, must be checked.</p>'
  body_html_am: <h2>ባትሪዎችና በኃይል የሚሠሩ መሣሪያዎች</h2><p>እስከ 100 ዋት-ሰዓት የሆኑ ተጠባባቂ የሊቲየም ባትሪዎች ተርሚናሎቻቸው
    ተለጥፎ በካቢን ብቻ ይጓዛሉ። ከ100 እስከ 160 ዋት-ሰዓት ባለው በቅድሚያ ፈቃድ ሁለት መያዝ ይችላሉ። ከ160 ዋት-ሰዓት በላይ በፍጹም
    ልንወስዳቸው አንችልም።</p><p>በኃይል የሚሠሩ የተሽከርካሪ ወንበሮች ይወሰዳሉ፤ ነገር ግን ትክክለኛው አያያዝ እንዲዘጋጅ የባትሪው ዓይነት
    ቢያንስ ከ48 ሰዓት በፊት መገለጽ አለበት።</p><h2>ፈሳሾች፣ ኤሮሶሎችና ጄሎች</h2><p>በካቢን፦ እስከ 100 ሚሊ ሊትር የሆኑ ዕቃዎች፣
    እስከ አንድ ሊትር በሚደርስ አንድ ግልጽ ከረጢት ውስጥ። በጭነት ክፍል፦ ለመታጠቢያ ቁሳቁስና ለመድኃኒት ብቻ የአንድ ዕቃ እስከ 2 ሊትር
    እና በጠቅላላ 2 ኪግ።</p><h2>ስለታምና ጫፍ ያላቸው ዕቃዎች</h2><p>ከ6 ሴሜ በታች ምላጭ ያላቸው መቀሶች በካቢን ይፈቀዳሉ። ከዚያ
    የሚረዝም ማንኛውም ነገር፣ እንዲሁም ሁሉም ቢላዎች፣ መሣሪያዎችና ከሕክምና ውጭ ያሉ መርፌዎች መመዝገብ አለባቸው።</p>
