  body_html_en: <h2>What members get</h2><p>Negotiated fares on the routes you fly most, consolidated
    monthly billing, waived change fees on Standard and above, and a named account manager.</p><h2>Joining</h2><p>Programmes
    start from USD 50,000 of annual travel spend. Below that, book through the website and
    earn Selam Miles in the usual way.</p>
  body_html_am: <h2>አባላት የሚያገኙት</h2><p>በብዛት በሚበሩባቸው መስመሮች ላይ የተደራደሩ ታሪፎች፣ የተጠቃለለ ወርሃዊ ክፍያ፣
    በስታንዳርድና ከዚያ በላይ የተነሱ የለውጥ ክፍያዎች፣ እንዲሁም በስም የተመደበ የሒሳብ አስተዳዳሪ።</p><h2>መቀላቀል</h2><p>መርሐ
    ግብሮች ከዓመታዊ USD 50,000 የጉዞ ወጪ ይጀምራሉ። ከዚያ በታች በድረ ገጹ ይያዙ፤ ሰላም ማይልስንም በተለመደው መንገድ ያግኙ።</p>
  id: 26
  title_bn: কর্পোরেট ভ্রমণ প্রোগ্রাম
  title_hi: कॉर्पोरेट यात्रा कार्यक्रम
  title_ur: کارپوریٹ سفری پروگرام
  summary_bn: প্রোগ্রামটি কী দেয়, এবং যোগ দেওয়ার সীমা।
  summary_hi: कार्यक्रम क्या देता है, और इसमें शामिल होने की सीमा।
  summary_ur: پروگرام کیا پیش کرتا ہے، اور اس میں شامل ہونے کی حد۔
  body_html_bn: <h2>সদস্যরা যা পান</h2><p>আপনার সবচেয়ে বেশি ব্যবহৃত রুটে আলোচিত ভাড়া, একীভূত
    মাসিক বিল, স্ট্যান্ডার্ড ও তার উপরে পরিবর্তন ফি মওকুফ, এবং একজন নির্দিষ্ট অ্যাকাউন্ট ম্যানেজার।</p><h2>যোগদান</h2><p>প্রোগ্রাম
    বার্ষিক USD 50,000 ভ্রমণ ব্যয় থেকে শুরু হয়। তার নিচে, ওয়েবসাইটের মাধ্যমে বুক করুন এবং
    স্বাভাবিক নিয়মে সেলাম মাইলস অর্জন করুন।</p>
  body_html_hi: <h2>सदस्यों को क्या मिलता है</h2><p>आपके सबसे अधिक उड़ान वाले मार्गों पर बातचीत
    से तय किराए, समेकित मासिक बिलिंग, स्टैंडर्ड और उससे ऊपर परिवर्तन शुल्क माफ़, और एक नामित
    खाता प्रबंधक।</p><h2>शामिल होना</h2><p>कार्यक्रम USD 50,000 के वार्षिक यात्रा व्यय से
    शुरू होते हैं। उससे कम पर, वेबसाइट के ज़रिए बुक करें और सामान्य तरीके से सेलाम माइल्स
    अर्जित करें।</p>
  body_html_ur: <h2>ارکان کو کیا ملتا ہے</h2><p>آپ کے سب سے زیادہ سفر والے روٹس پر طے شدہ
    کرائے، یکجا ماہانہ بلنگ، اسٹینڈرڈ اور اس سے اوپر تبدیلی فیس معاف، اور ایک نامزد اکاؤنٹ
    منیجر۔</p><h2>شمولیت</h2><p>پروگرام USD 50,000 کے سالانہ سفری خرچ سے شروع ہوتے ہیں۔ اس
    سے کم پر، ویب سائٹ کے ذریعے بک کریں اور معمول کے مطابق سلام مائلز حاصل کریں۔</p>
- slug: changing-a-booking
