  title_en: Travelling with pets
  title_am: ከቤት እንስሳት ጋር መጓዝ
  summary_en: Cabin and hold rules, weight limits, and the documents each destination needs.
  summary_am: የካቢንና የጭነት ክፍል ደንቦች፣ የክብደት ገደቦች፣ እና እያንዳንዱ መዳረሻ የሚፈልጋቸው ሰነዶች።
  body_html_en: <h2>In the cabin</h2><p>Cats and dogs up to 8 kg including the carrier may
    travel in the cabin, at USD 90 per sector. The carrier must fit under the seat in front,
    and only one animal per passenger is accepted.</p><h2>In the hold</h2><p>Above 8 kg the
    animal travels in the hold in an IATA-compliant crate, at USD 200 per sector. We do not
    carry snub-nosed breeds in the hold on any route, because they cannot regulate their breathing
    reliably.</p><h2>Documents</h2><p>Every destination sets its own import rules. A rabies
    vaccination certificate and an export health certificate are the minimum; some destinations
    add a titre test with a waiting period of several months. Check before you book.</p>
  body_html_am: <h2>በካቢን ውስጥ</h2><p>ድመቶችና ውሾች ማጓጓዣውን ጨምሮ እስከ 8 ኪግ በካቢን ውስጥ በአንድ ክፍል USD 90
    ሊጓዙ ይችላሉ። ማጓጓዣው በፊት መቀመጫ ሥር መግባት አለበት፤ በአንድ ተሳፋሪም አንድ እንስሳ ብቻ ይፈቀዳል።</p><h2>በጭነት ክፍል</h2><p>ከ8
    ኪግ በላይ እንስሳው በIATA መስፈርት በተዘጋጀ ሳጥን በጭነት ክፍል በአንድ ክፍል USD 200 ይጓዛል። አጭር አፍንጫ ያላቸውን ዝርያዎች
    በማንኛውም መስመር በጭነት ክፍል አንወስድም፤ ምክንያቱም ትንፋሻቸውን በአስተማማኝ ሁኔታ መቆጣጠር ስለማይችሉ ነው።</p><h2>ሰነዶች</h2><p>እያንዳንዱ
    መዳረሻ የራሱን የማስገቢያ ደንቦች ያወጣል። የእብድ ውሻ በሽታ ክትባት ምስክር ወረቀትና የወጪ ጤና ምስክር ወረቀት ዝቅተኛው ናቸው፤ አንዳንድ
    መዳረሻዎች የበርካታ ወራት መጠበቂያ ያለው የቲተር ምርመራ ይጨምራሉ። ከመያዝዎ በፊት ያረጋግጡ።</p>
  id: 25
  title_bn: পোষা প্রাণী নিয়ে ভ্রমণ
  title_hi: पालतू जानवरों के साथ यात्रा
  title_ur: پالتو جانوروں کے ساتھ سفر
  summary_bn: কেবিন ও হোল্ডের নিয়ম, ওজনসীমা, এবং প্রতিটি গন্তব্যের প্রয়োজনীয় নথি।
  summary_hi: केबिन और होल्ड के नियम, वज़न सीमाएँ, और हर गंतव्य के लिए आवश्यक दस्तावेज़।
  summary_ur: کیبن اور ہولڈ کے قواعد، وزن کی حدیں، اور ہر منزل کے لیے درکار دستاویزات۔
  body_html_bn: <h2>কেবিনে</h2><p>ক্যারিয়ারসহ 8 kg পর্যন্ত বিড়াল ও কুকুর কেবিনে ভ্রমণ করতে
    পারে, প্রতি সেক্টরে USD 90-এ। ক্যারিয়ারটি সামনের আসনের নিচে আঁটতে হবে, এবং যাত্রীপ্রতি
    শুধু একটি প্রাণী গ্রহণ করা হয়।</p><h2>হোল্ডে</h2><p>8 kg-এর উপরে প্রাণীটি IATA-সম্মত
    ক্রেটে হোল্ডে ভ্রমণ করে, প্রতি সেক্টরে USD 200-এ। আমরা কোনো রুটে চ্যাপ্টা-নাক প্রজাতি
    হোল্ডে বহন করি না, কারণ তারা নির্ভরযোগ্যভাবে শ্বাস নিয়ন্ত্রণ করতে পারে না।</p><h2>নথি</h2><p>প্রতিটি
    গন্তব্য নিজস্ব আমদানি নিয়ম নির্ধারণ করে। জলাতঙ্ক টিকার সনদ ও রপ্তানি স্বাস্থ্য সনদ ন্যূনতম;
    কিছু গন্তব্য কয়েক মাসের অপেক্ষাসহ একটি টাইটার পরীক্ষা যোগ করে। বুক করার আগে যাচাই করুন।</p>
  body_html_hi: <h2>केबिन में</h2><p>कैरियर सहित 8 kg तक की बिल्लियाँ और कुत्ते केबिन में
    यात्रा कर सकते हैं, प्रति सेक्टर USD 90 पर। कैरियर सामने की सीट के नीचे आना चाहिए, और
    प्रति यात्री केवल एक जानवर स्वीकार किया जाता है।</p><h2>होल्ड में</h2><p>8 kg से ऊपर जानवर
    IATA-अनुरूप क्रेट में होल्ड में यात्रा करता है, प्रति सेक्टर USD 200 पर। हम किसी भी मार्ग
    पर चपटी नाक वाली नस्लों को होल्ड में नहीं ले जाते, क्योंकि वे अपनी साँस को विश्वसनीय रूप
    से नियंत्रित नहीं कर पातीं।</p><h2>दस्तावेज़</h2><p>हर गंतव्य अपने आयात नियम तय करता है।
    रेबीज़ टीकाकरण प्रमाणपत्र और निर्यात स्वास्थ्य प्रमाणपत्र न्यूनतम हैं; कुछ गंतव्य कई महीनों
    की प्रतीक्षा अवधि वाला टाइटर परीक्षण जोड़ते हैं। बुक करने से पहले जाँच लें।</p>
  body_html_ur: <h2>کیبن میں</h2><p>کیریئر سمیت 8 kg تک کی بلیاں اور کتے کیبن میں سفر کر سکتے
    ہیں، فی سیکٹر USD 90 پر۔ کیریئر سامنے کی سیٹ کے نیچے آنا چاہیے، اور فی مسافر صرف ایک جانور
    قبول کیا جاتا ہے۔</p><h2>ہولڈ میں</h2><p>8 kg سے اوپر جانور IATA کے مطابق کریٹ میں ہولڈ
    میں سفر کرتا ہے، فی سیکٹر USD 200 پر۔ ہم کسی بھی روٹ پر چپٹی ناک والی نسلوں کو ہولڈ میں
    نہیں لے جاتے، کیونکہ وہ اپنی سانس کو قابلِ اعتماد طور پر قابو نہیں رکھ سکتیں۔</p><h2>دستاویزات</h2><p>ہر
    منزل اپنے درآمدی قواعد طے کرتی ہے۔ ریبیز ویکسینیشن سرٹیفکیٹ اور برآمدی صحت سرٹیفکیٹ کم
    از کم ہیں؛ کچھ منزلیں کئی ماہ کے انتظار والا ٹائٹر ٹیسٹ شامل کرتی ہیں۔ بک کرنے سے پہلے
    جانچ لیں۔</p>
