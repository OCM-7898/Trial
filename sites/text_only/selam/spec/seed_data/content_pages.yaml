  title_en: Sports equipment at a glance
  title_am: የስፖርት መሣሪያ በአጭሩ
  summary_en: A short summary. The full rules, with packing requirements, are on the special
    baggage page.
  summary_am: አጭር ማጠቃለያ። ሙሉ ደንቦቹ ከማሸጊያ መስፈርቶች ጋር በልዩ ሻንጣ ገጽ ላይ ናቸው።
  body_html_en: <h2>The short version</h2><p>Most sports equipment travels as one checked
    piece if it is inside your allowance and under the item&#x27;s weight cap. Bulky items
    -- bicycles, surfboards, kayaks, windsurf rigs -- carry a fixed fee instead of the per-kilogram
    rate, and several must be declared before you travel.</p><h2>What this page leaves out</h2><p>It
    does not say how any item must be packed, which fee applies to which item, or which items
    we refuse. Those are on the special and sports baggage page, and the airport goes by that
    page rather than by this summary.</p>
  body_html_am: <h2>አጭሩ ቅጂ</h2><p>አብዛኛው የስፖርት መሣሪያ በፈቃድዎ ውስጥና ከዕቃው የክብደት ጣሪያ በታች ከሆነ እንደ አንድ
    የተመዘገበ ዕቃ ይጓዛል። ግዙፍ ዕቃዎች -- ብስክሌት፣ የሰርፍ ቦርድ፣ ካያክ፣ የንፋስ ሰርፍ መሣሪያ -- በኪሎግራም ተመን ፋንታ ቋሚ ክፍያ
    አላቸው፤ ብዙዎቹም ከመጓዝዎ በፊት መገለጽ አለባቸው።</p><h2>ይህ ገጽ የተወው</h2><p>ማንኛውም ዕቃ እንዴት መታሸግ እንዳለበት፣
    የትኛው ክፍያ ለየትኛው ዕቃ እንደሚሠራ፣ ወይም የትኞቹን ዕቃዎች እንደምንከለክል አይናገርም። እነዚያ በልዩና በስፖርት ሻንጣ ገጽ ላይ ናቸው፤
    አየር ማረፊያውም በዚህ ማጠቃለያ ሳይሆን በዚያ ገጽ ይሄዳል።</p>
  id: 38
  title_bn: ক্রীড়া সরঞ্জাম এক নজরে
  title_hi: खेल उपकरण एक नज़र में
  title_ur: کھیلوں کا سامان ایک نظر میں
  summary_bn: একটি সংক্ষিপ্ত সারাংশ। প্যাকিং শর্তসহ পূর্ণ নিয়ম বিশেষ ব্যাগেজ পৃষ্ঠায় আছে।
  summary_hi: एक संक्षिप्त सारांश। पैकिंग आवश्यकताओं सहित पूरे नियम विशेष बैगेज पृष्ठ पर हैं।
  summary_ur: ایک مختصر خلاصہ۔ پیکنگ کے تقاضوں سمیت مکمل قواعد خصوصی سامان کے صفحے پر ہیں۔
  body_html_bn: <h2>সংক্ষিপ্ত সংস্করণ</h2><p>বেশিরভাগ ক্রীড়া সরঞ্জাম আপনার অ্যালাউন্সের মধ্যে
    এবং জিনিসটির ওজনসীমার নিচে থাকলে একটি চেকড পিস হিসেবে যায়। বড় জিনিস -- সাইকেল, সার্ফবোর্ড,
    কায়াক, উইন্ডসার্ফ রিগ -- প্রতি-কিলোগ্রাম হারের বদলে নির্দিষ্ট ফি বহন করে, এবং কয়েকটি
    ভ্রমণের আগে ঘোষণা করতে হয়।</p><h2>এই পৃষ্ঠা যা বাদ দেয়</h2><p>এটি বলে না কোনো জিনিস
    কীভাবে প্যাক করতে হবে, কোন জিনিসে কোন ফি প্রযোজ্য, বা কোন জিনিস আমরা প্রত্যাখ্যান করি।
    সেগুলি বিশেষ ও ক্রীড়া ব্যাগেজ পৃষ্ঠায় আছে, এবং বিমানবন্দর এই সারাংশ নয়, সেই পৃষ্ঠা
    অনুসরণ করে।</p>
  body_html_hi: <h2>संक्षिप्त संस्करण</h2><p>अधिकांश खेल उपकरण एक चेक्ड पीस के रूप में जाता
    है यदि वह आपके अलाउंस के भीतर और वस्तु की वज़न सीमा के नीचे है। बड़ी वस्तुएँ -- साइकिल,
    सर्फ़बोर्ड, कयाक, विंडसर्फ़ रिग -- प्रति-किलोग्राम दर के बजाय निश्चित शुल्क लेती हैं,
    और कई को यात्रा से पहले घोषित करना होता है।</p><h2>यह पृष्ठ क्या छोड़ता है</h2><p>यह नहीं
    बताता कि किसी वस्तु को कैसे पैक करना है, किस वस्तु पर कौन सा शुल्क लागू है, या कौन सी
    वस्तुएँ हम अस्वीकार करते हैं। वे विशेष और खेल बैगेज पृष्ठ पर हैं, और हवाई अड्डा इस सारांश
    के बजाय उस पृष्ठ के अनुसार चलता है।</p>
  body_html_ur: <h2>مختصر ورژن</h2><p>زیادہ تر کھیلوں کا سامان ایک چیکڈ پیس کے طور پر سفر
    کرتا ہے اگر وہ آپ کے الاؤنس کے اندر اور چیز کی وزن کی حد سے کم ہو۔ بڑی اشیا -- سائیکلیں،
    سرف بورڈ، کیاک، ونڈ سرف رِگ -- فی کلوگرام شرح کے بجائے مقررہ فیس لیتی ہیں، اور کئی کو
    سفر سے پہلے ظاہر کرنا ہوتا ہے۔</p><h2>یہ صفحہ کیا چھوڑتا ہے</h2><p>یہ نہیں بتاتا کہ کسی
    چیز کو کیسے پیک کرنا ہے، کس چیز پر کون سی فیس لاگو ہے، یا کون سی اشیا ہم مسترد کرتے ہیں۔
    وہ خصوصی اور کھیلوں کے سامان کے صفحے پر ہیں، اور ہوائی اڈا اس خلاصے کے بجائے اس صفحے کے
    مطابق چلتا ہے۔</p>
