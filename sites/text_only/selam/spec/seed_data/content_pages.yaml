  position: 11
  title_en: Staying comfortable on a long flight
  title_am: በረጅም በረራ ላይ ምቾትን መጠበቅ
  summary_en: Cabin altitude, dehydration and circulation.
  summary_am: የካቢን ከፍታ፣ የውሃ እጥረትና የደም ዝውውር።
  body_html_en: <h2>Why the cabin feels dry</h2><p>Cabin air is pressurised to about 2,400
    metres and its humidity sits near 15 per cent, well below a room on the ground. That is
    why skin, eyes and throat feel dry and why alcohol has a stronger effect than it does
    on the ground.</p><h2>Circulation</h2><p>Sitting still for hours slows blood flow in the
    legs. Walk the cabin roughly every two hours when the seatbelt sign is off, flex your
    ankles in the seat, and keep drinking water. If you have had recent surgery, a clotting
    disorder or a previous thrombosis, ask your doctor about compression stockings before
    you fly.</p>
  body_html_am: <h2>ካቢኑ ደረቅ የሚመስለው ለምንድን ነው</h2><p>የካቢን አየር ወደ 2,400 ሜትር ገደማ ግፊት ይደረግበታል፤
    እርጥበቱም ከመሬት ላይ ካለ ክፍል በጣም ያነሰ ወደ 15 በመቶ ገደማ ነው። ቆዳ፣ ዓይንና ጉሮሮ ደረቅ የሚሰማቸው፣ አልኮልም ከመሬት ላይ
    በበለጠ የሚሠራው ለዚህ ነው።</p><h2>የደም ዝውውር</h2><p>ለሰዓታት ሳይንቀሳቀሱ መቀመጥ በእግሮች ውስጥ ያለውን የደም ፍሰት ያዘገየዋል።
    የመቀመጫ ቀበቶ ምልክቱ ሲጠፋ በየሁለት ሰዓቱ ገደማ በካቢኑ ውስጥ ይራመዱ፤ በመቀመጫዎ ላይ ሆነው ቁርጭምጭሚትዎን ያንቀሳቅሱ፤ ውሃም መጠጣትዎን
    ይቀጥሉ። በቅርቡ ቀዶ ጥገና ካደረጉ፣ የደም መርጋት ችግር ካለብዎ ወይም ቀደም ሲል የደም መርጋት ካጋጠምዎ ከመብረርዎ በፊት ስለ መጭመቂያ
    ካልሲዎች ሐኪምዎን ይጠይቁ።</p>
  id: 49
  title_bn: দীর্ঘ ফ্লাইটে স্বস্তিতে থাকা
  title_hi: लंबी उड़ान में आराम से रहना
  title_ur: طویل پرواز میں آرام سے رہنا
  summary_bn: কেবিনের উচ্চতা, পানিশূন্যতা ও রক্ত সঞ্চালন।
  summary_hi: केबिन की ऊँचाई, निर्जलीकरण और रक्त संचार।
  summary_ur: کیبن کی بلندی، پانی کی کمی اور دورانِ خون۔
  body_html_bn: <h2>কেবিন কেন শুষ্ক লাগে</h2><p>কেবিনের বাতাস প্রায় 2,400 মিটারে চাপযুক্ত
    এবং এর আর্দ্রতা 15 শতাংশের কাছাকাছি থাকে, মাটির ঘরের অনেক নিচে। এজন্যই ত্বক, চোখ ও গলা
    শুষ্ক লাগে এবং মদ মাটির চেয়ে বেশি প্রভাব ফেলে।</p><h2>রক্ত সঞ্চালন</h2><p>ঘণ্টার পর ঘণ্টা
    স্থির বসে থাকা পায়ের রক্তপ্রবাহ ধীর করে। সিটবেল্ট চিহ্ন বন্ধ থাকলে মোটামুটি প্রতি দুই
    ঘণ্টায় কেবিনে হাঁটুন, আসনে গোড়ালি নাড়ান, এবং পানি পান করতে থাকুন। সাম্প্রতিক অস্ত্রোপচার,
    রক্ত জমাট বাঁধার সমস্যা বা আগের থ্রম্বোসিস থাকলে উড়ার আগে কম্প্রেশন স্টকিং সম্পর্কে চিকিৎসকের
    পরামর্শ নিন।</p>
  body_html_hi: <h2>केबिन शुष्क क्यों लगता है</h2><p>केबिन की हवा लगभग 2,400 मीटर पर दबावित
    होती है और उसकी नमी 15 प्रतिशत के आसपास रहती है, ज़मीन पर कमरे से काफ़ी कम। इसीलिए त्वचा,
    आँखें और गला शुष्क लगते हैं और शराब का असर ज़मीन की तुलना में ज़्यादा होता है।</p><h2>रक्त
    संचार</h2><p>घंटों स्थिर बैठे रहने से पैरों में रक्त प्रवाह धीमा हो जाता है। सीटबेल्ट
    संकेत बंद होने पर लगभग हर दो घंटे में केबिन में चलें, सीट पर टखने हिलाएँ, और पानी पीते
    रहें। यदि आपकी हाल में सर्जरी हुई है, रक्त के थक्के का विकार है या पहले थ्रॉम्बोसिस हुआ
    है, तो उड़ान से पहले कंप्रेशन स्टॉकिंग के बारे में अपने डॉक्टर से पूछें।</p>
  body_html_ur: <h2>کیبن خشک کیوں لگتا ہے</h2><p>کیبن کی ہوا تقریباً 2,400 میٹر پر دباؤ میں
    ہوتی ہے اور اس کی نمی 15 فیصد کے قریب رہتی ہے، زمین پر کمرے سے کہیں کم۔ اسی لیے جلد، آنکھیں
    اور گلا خشک لگتے ہیں اور شراب کا اثر زمین کی نسبت زیادہ ہوتا ہے۔</p><h2>دورانِ خون</h2><p>گھنٹوں
    ساکت بیٹھنے سے ٹانگوں میں خون کا بہاؤ سست ہو جاتا ہے۔ سیٹ بیلٹ کا نشان بند ہونے پر تقریباً
    ہر دو گھنٹے میں کیبن میں چلیں، سیٹ پر ٹخنے ہلائیں، اور پانی پیتے رہیں۔ اگر آپ کی حال ہی
    میں سرجری ہوئی ہے، خون جمنے کا عارضہ ہے یا پہلے تھرومبوسس ہوا ہے، تو پرواز سے پہلے کمپریشن
    اسٹاکنگز کے بارے میں اپنے ڈاکٹر سے پوچھیں۔</p>
- slug: travelling-with-medication
  category: health
  position: 12
  title_en: Travelling with medication
  title_am: ከመድኃኒት ጋር መጓዝ
  summary_en: Where it goes, and the letter that prevents a problem.
  summary_am: የት እንደሚቀመጥ፣ እና ችግርን የሚከላከለው ደብዳቤ።
  body_html_en: <h2>Keep it in the cabin</h2><p>Prescription medication travels in your cabin
    bag, in its original labelled packaging, in the quantity needed for the journey plus a
    few days. Hold baggage can be delayed, and the hold is cold.</p><h2>The letter</h2><p>Carry
    a doctor&#x27;s letter naming the medication and the condition if you travel with injectables,
    controlled drugs, liquids above 100 ml, or a device such as a syringe driver. Some destinations
    restrict medicines that are ordinary elsewhere; check with the embassy rather than assuming.</p>
  body_html_am: <h2>በካቢን ውስጥ ይያዙት</h2><p>በሐኪም የታዘዘ መድኃኒት በእጅ ሻንጣዎ ውስጥ፣ በመጀመሪያው መለያ ባለው ማሸጊያው፣
    ለጉዞው በሚያስፈልገው መጠን ላይ የጥቂት ቀናት ተጨምሮ ይጓዛል። የተመዘገበ ሻንጣ ሊዘገይ ይችላል፤ የጭነት ክፍሉም ቀዝቃዛ ነው።</p><h2>ደብዳቤው</h2><p>የመርፌ
    መድኃኒት፣ ቁጥጥር የሚደረግባቸው መድኃኒቶች፣ ከ100 ሚሊ ሊትር በላይ ፈሳሾች፣ ወይም እንደ የመርፌ መሣሪያ ያለ መሣሪያ ይዘው የሚጓዙ
    ከሆነ መድኃኒቱንና ሕመሙን የሚጠቅስ የሐኪም ደብዳቤ ይያዙ። አንዳንድ መድረሻዎች በሌላ ቦታ የተለመዱ መድኃኒቶችን ይገድባሉ፤ ከመገመት ይልቅ
    ከኤምባሲው ያረጋግጡ።</p>
  id: 50
  title_bn: ওষুধ নিয়ে ভ্রমণ
  title_hi: दवा के साथ यात्रा
  title_ur: دوا کے ساتھ سفر
  summary_bn: এটি কোথায় যায়, এবং যে চিঠি সমস্যা ঠেকায়।
  summary_hi: वह कहाँ जाती है, और वह पत्र जो समस्या रोकता है।
  summary_ur: وہ کہاں جاتی ہے، اور وہ خط جو مسئلہ روکتا ہے۔
  body_html_bn: <h2>কেবিনে রাখুন</h2><p>প্রেসক্রিপশনের ওষুধ আপনার কেবিন ব্যাগে, আসল লেবেলযুক্ত
    প্যাকেজিংয়ে, যাত্রার প্রয়োজনীয় পরিমাণ ও আরও কয়েক দিনের জন্য যায়। হোল্ড ব্যাগেজ বিলম্বিত
    হতে পারে, এবং হোল্ড ঠান্ডা।</p><h2>চিঠি</h2><p>ইনজেকশনযোগ্য, নিয়ন্ত্রিত ওষুধ, 100 ml-এর
    বেশি তরল, বা সিরিঞ্জ ড্রাইভারের মতো ডিভাইস নিয়ে ভ্রমণ করলে ওষুধ ও রোগের নাম উল্লেখ করা
    চিকিৎসকের চিঠি বহন করুন। কিছু গন্তব্য অন্যত্র সাধারণ ওষুধ সীমিত করে; অনুমান না করে দূতাবাসে
    যাচাই করুন।</p>
  body_html_hi: <h2>केबिन में रखें</h2><p>निर्धारित दवा आपके केबिन बैग में, उसकी मूल लेबल
    वाली पैकेजिंग में, यात्रा के लिए आवश्यक मात्रा और कुछ अतिरिक्त दिनों के लिए जाती है। होल्ड
    बैगेज विलंबित हो सकता है, और होल्ड ठंडा होता है।</p><h2>पत्र</h2><p>यदि आप इंजेक्शन वाली
    दवा, नियंत्रित औषधियाँ, 100 ml से अधिक तरल, या सिरिंज ड्राइवर जैसे उपकरण के साथ यात्रा
    करते हैं तो दवा और स्थिति का नाम देने वाला डॉक्टर का पत्र रखें। कुछ गंतव्य ऐसी दवाओं को
    प्रतिबंधित करते हैं जो कहीं और सामान्य हैं; मान लेने के बजाय दूतावास से जाँच लें।</p>
  body_html_ur: <h2>کیبن میں رکھیں</h2><p>تجویز کردہ دوا آپ کے کیبن بیگ میں، اس کی اصل لیبل
    شدہ پیکنگ میں، سفر کے لیے درکار مقدار اور چند اضافی دنوں کے لیے سفر کرتی ہے۔ ہولڈ کا سامان
    تاخیر کا شکار ہو سکتا ہے، اور ہولڈ ٹھنڈا ہوتا ہے۔</p><h2>خط</h2><p>اگر آپ انجیکشن والی
    دوا، کنٹرولڈ ادویات، 100 ml سے زیادہ مائعات، یا سرنج ڈرائیور جیسے آلے کے ساتھ سفر کرتے
    ہیں تو دوا اور مرض کا نام بتانے والا ڈاکٹر کا خط رکھیں۔ کچھ منزلیں ایسی ادویات پر پابندی
    لگاتی ہیں جو کہیں اور عام ہیں؛ فرض کرنے کے بجائے سفارت خانے سے جانچ لیں۔</p>
- slug: onboard-comfort
  category: onboard
  position: 10
  title_en: What is at your seat
  title_am: በመቀመጫዎ ላይ ያለው
  summary_en: Power, screens and amenities, and which aircraft have them.
  summary_am: ኃይል፣ ማሳያዎችና አገልግሎቶች፣ እንዲሁም የትኞቹ አውሮፕላኖች እንዳሏቸው።
  body_html_en: <h2>Power</h2><p>Wide-body aircraft have a universal socket and a USB port
    at every seat. Narrow-body aircraft have USB only. Turboprops have neither, so charge
    before you board.</p><h2>Amenities</h2><p>Highland Class on flights over six hours carries
    a flat bed, a duvet and an amenity kit. Economy on the same flights carries a blanket,
    a pillow and an eye mask on request.</p>
  body_html_am: <h2>ኃይል</h2><p>ሰፊ አካል አውሮፕላኖች በእያንዳንዱ መቀመጫ ሁለንተናዊ ሶኬትና የUSB መሰኪያ አላቸው። ጠባብ
    አካል አውሮፕላኖች USB ብቻ አላቸው። ተርቦፕሮፖች ደግሞ አንዱም የላቸውም፤ ስለዚህ ከመሳፈርዎ በፊት ኃይል ይሙሉ።</p><h2>አገልግሎቶች</h2><p>ሃይላንድ
    ክላስ ከስድስት ሰዓት በላይ በሚደረጉ በረራዎች ላይ ጠፍጣፋ አልጋ፣ ብርድ ልብስና የአገልግሎት ስብስብ ይይዛል። በተመሳሳይ በረራዎች ላይ
    ኢኮኖሚ በጥያቄ ብርድ ልብስ፣ ትራስና የዓይን መሸፈኛ ይይዛል።</p>
  id: 51
  title_bn: আপনার আসনে কী আছে
  title_hi: आपकी सीट पर क्या है
  title_ur: آپ کی سیٹ پر کیا ہے
  summary_bn: বিদ্যুৎ, স্ক্রিন ও সুবিধা, এবং কোন উড়োজাহাজে সেগুলি আছে।
  summary_hi: बिजली, स्क्रीन और सुविधाएँ, और किन विमानों में ये हैं।
  summary_ur: بجلی، اسکرینیں اور سہولیات، اور کن طیاروں میں یہ ہیں۔
  body_html_bn: <h2>বিদ্যুৎ</h2><p>ওয়াইড-বডি উড়োজাহাজে প্রতিটি আসনে একটি ইউনিভার্সাল সকেট
    ও একটি USB পোর্ট আছে। ন্যারো-বডি উড়োজাহাজে শুধু USB আছে। টার্বোপ্রপে কোনোটিই নেই, তাই
    ওঠার আগে চার্জ করুন।</p><h2>সুবিধা</h2><p>ছয় ঘণ্টার বেশি ফ্লাইটে হাইল্যান্ড ক্লাসে ফ্ল্যাট
    বেড, ডুভে ও অ্যামেনিটি কিট থাকে। একই ফ্লাইটে ইকোনমিতে অনুরোধে কম্বল, বালিশ ও আই মাস্ক
    থাকে।</p>
  body_html_hi: <h2>बिजली</h2><p>वाइड-बॉडी विमानों में हर सीट पर एक यूनिवर्सल सॉकेट और एक
    USB पोर्ट है। नैरो-बॉडी विमानों में केवल USB है। टर्बोप्रॉप में दोनों में से कुछ नहीं,
    इसलिए चढ़ने से पहले चार्ज करें।</p><h2>सुविधाएँ</h2><p>छह घंटे से अधिक की उड़ानों पर हाइलैंड
    क्लास में फ़्लैट बेड, डुवे और एमेनिटी किट होती है। उन्हीं उड़ानों पर इकोनॉमी में अनुरोध
    पर कंबल, तकिया और आई मास्क होता है।</p>
  body_html_ur: <h2>بجلی</h2><p>وائیڈ باڈی طیاروں میں ہر سیٹ پر ایک یونیورسل ساکٹ اور ایک
    USB پورٹ ہے۔ نیرو باڈی طیاروں میں صرف USB ہے۔ ٹربوپراپ میں دونوں میں سے کچھ نہیں، اس لیے
    سوار ہونے سے پہلے چارج کریں۔</p><h2>سہولیات</h2><p>چھ گھنٹے سے زیادہ کی پروازوں پر ہائی
    لینڈ کلاس میں فلیٹ بیڈ، لحاف اور ایمینیٹی کٹ ہوتی ہے۔ انہی پروازوں پر اکانومی میں درخواست
    پر کمبل، تکیہ اور آئی ماسک ہوتا ہے۔</p>
- slug: alcohol-and-water
  category: onboard
  position: 11
  title_en: Drinks on board
  title_am: በበረራ ላይ መጠጦች
  summary_en: What is complimentary, and the limits on alcohol.
  summary_am: በነጻ የሚቀርበው፣ እና በአልኮል ላይ ያሉ ገደቦች።
  body_html_en: <h2>Complimentary</h2><p>Water, tea, coffee and soft drinks on every flight.
    Beer and wine with a meal on flights over three hours. A full bar in Highland Class.</p><h2>Limits</h2><p>Cabin
    crew serve alcohol at their discretion and will stop serving a passenger who has had enough.
    You may not drink your own alcohol on board, including duty free. Both rules are safety
    requirements, not house policy.</p>
  body_html_am: <h2>በነጻ የሚቀርብ</h2><p>በእያንዳንዱ በረራ ውሃ፣ ሻይ፣ ቡናና ለስላሳ መጠጦች። ከሦስት ሰዓት በላይ በሚደረጉ
    በረራዎች ከምግብ ጋር ቢራና ወይን። በሃይላንድ ክላስ ደግሞ ሙሉ መጠጥ ቤት።</p><h2>ገደቦች</h2><p>የካቢን ሠራተኞች አልኮል የሚያቀርቡት
    በራሳቸው ውሳኔ ነው፤ በቂ ለጠጣ ተሳፋሪም ማቅረብ ያቆማሉ። ከቀረጥ ነጻ የተገዛውን ጨምሮ የራስዎን አልኮል በበረራ ላይ መጠጣት አይችሉም።
    ሁለቱም ደንቦች የቤት ውስጥ ፖሊሲ ሳይሆኑ የደህንነት መስፈርቶች ናቸው።</p>
  id: 52
  title_bn: উড়োজাহাজে পানীয়
  title_hi: विमान में पेय
  title_ur: طیارے میں مشروبات
  summary_bn: কী বিনামূল্যে, এবং মদের সীমা।
  summary_hi: क्या निःशुल्क है, और शराब की सीमाएँ।
  summary_ur: کیا مفت ہے، اور شراب کی حدیں۔
  body_html_bn: <h2>বিনামূল্যে</h2><p>প্রতিটি ফ্লাইটে পানি, চা, কফি ও কোমল পানীয়। তিন ঘণ্টার
    বেশি ফ্লাইটে খাবারের সঙ্গে বিয়ার ও ওয়াইন। হাইল্যান্ড ক্লাসে পূর্ণ বার।</p><h2>সীমা</h2><p>কেবিন
    ক্রু নিজেদের বিবেচনায় মদ পরিবেশন করেন এবং যথেষ্ট পান করা যাত্রীকে পরিবেশন বন্ধ করবেন।
    ডিউটি ফ্রিসহ নিজের মদ উড়োজাহাজে পান করা যাবে না। দুটি নিয়মই নিরাপত্তার শর্ত, ঘরোয়া
    নীতি নয়।</p>
  body_html_hi: <h2>निःशुल्क</h2><p>हर उड़ान पर पानी, चाय, कॉफ़ी और शीतल पेय। तीन घंटे से
    अधिक की उड़ानों पर भोजन के साथ बीयर और वाइन। हाइलैंड क्लास में पूरा बार।</p><h2>सीमाएँ</h2><p>केबिन
    क्रू अपने विवेक से शराब परोसते हैं और पर्याप्त पी चुके यात्री को परोसना बंद कर देंगे।
    आप ड्यूटी फ़्री सहित अपनी शराब विमान में नहीं पी सकते। दोनों नियम सुरक्षा आवश्यकताएँ हैं,
    घरेलू नीति नहीं।</p>
  body_html_ur: <h2>مفت</h2><p>ہر پرواز پر پانی، چائے، کافی اور سافٹ ڈرنکس۔ تین گھنٹے سے زیادہ
    کی پروازوں پر کھانے کے ساتھ بیئر اور وائن۔ ہائی لینڈ کلاس میں مکمل بار۔</p><h2>حدیں</h2><p>کیبن
    عملہ اپنی صوابدید پر شراب پیش کرتا ہے اور کافی پی چکے مسافر کو پیش کرنا بند کر دے گا۔
    آپ ڈیوٹی فری سمیت اپنی شراب طیارے میں نہیں پی سکتے۔ دونوں قواعد حفاظتی تقاضے ہیں، اندرونی
    پالیسی نہیں۔</p>
- slug: smoking-and-devices
  category: onboard
  position: 12
  title_en: Smoking and electronic devices
  title_am: ማጨስና የኤሌክትሮኒክ መሣሪያዎች
  summary_en: What is prohibited outright, and what flight mode covers.
  summary_am: በፍጹም የተከለከለው፣ እና የበረራ ሁኔታ የሚሸፍነው።
  body_html_en: <h2>Smoking</h2><p>Smoking is prohibited on every flight, in every cabin,
    including electronic cigarettes and heated tobacco. Lavatory smoke detectors are monitored
    and tampering with one is an offence in its own right.</p><h2>Electronic cigarettes in
    baggage</h2><p>Carry them in the cabin, never in the hold, and do not charge them on board.
    This is the same lithium-battery rule that applies to power banks.</p><h2>Flight mode</h2><p>Phones,
    tablets and laptops may be used in flight mode throughout. Larger devices are stowed for
    take-off and landing. Bluetooth headphones are permitted; a device that cannot be switched
    to flight mode must be off.</p>
  body_html_am: <h2>ማጨስ</h2><p>ማጨስ በእያንዳንዱ በረራ፣ በእያንዳንዱ ካቢን የተከለከለ ነው፤ የኤሌክትሮኒክ ሲጋራዎችንና የሚሞቅ
    ትምባሆን ጨምሮ። የመጸዳጃ ቤት የጭስ ማወቂያዎች ይቆጣጠራሉ፤ አንዱን መንካትም በራሱ ወንጀል ነው።</p><h2>የኤሌክትሮኒክ ሲጋራዎች በሻንጣ
    ውስጥ</h2><p>በካቢን ይያዟቸው፤ በጭነት ክፍል በጭራሽ አይሁን፤ በበረራ ላይም አይሙሏቸው። ይህ ለኃይል ማጠራቀሚያዎች የሚሠራው ተመሳሳይ
    የሊቲየም ባትሪ ደንብ ነው።</p><h2>የበረራ ሁኔታ</h2><p>ስልኮች፣ ታብሌቶችና ላፕቶፖች በበረራው ጊዜ ሁሉ በበረራ ሁኔታ ሊውሉ ይችላሉ።
    ትልልቅ መሣሪያዎች ለመነሳትና ለማረፍ ይቀመጣሉ። የብሉቱዝ ማዳመጫዎች ይፈቀዳሉ፤ ወደ በረራ ሁኔታ ሊቀየር የማይችል መሣሪያ ግን መጥፋት
    አለበት።</p>
  id: 53
  title_bn: ধূমপান ও ইলেকট্রনিক ডিভাইস
  title_hi: धूम्रपान और इलेक्ट्रॉनिक उपकरण
  title_ur: تمباکو نوشی اور الیکٹرانک آلات
  summary_bn: কী সম্পূর্ণ নিষিদ্ধ, এবং ফ্লাইট মোড কী কভার করে।
  summary_hi: क्या पूरी तरह निषिद्ध है, और फ़्लाइट मोड में क्या शामिल है।
  summary_ur: کیا مکمل طور پر ممنوع ہے، اور فلائٹ موڈ میں کیا شامل ہے۔
  body_html_bn: <h2>ধূমপান</h2><p>ইলেকট্রনিক সিগারেট ও হিটেড টোব্যাকোসহ প্রতিটি ফ্লাইটে, প্রতিটি
    কেবিনে ধূমপান নিষিদ্ধ। শৌচাগারের ধোঁয়া শনাক্তকারী পর্যবেক্ষণ করা হয় এবং তাতে হস্তক্ষেপ
    নিজেই একটি অপরাধ।</p><h2>ব্যাগেজে ইলেকট্রনিক সিগারেট</h2><p>এগুলি কেবিনে বহন করুন, কখনও
    হোল্ডে নয়, এবং উড়োজাহাজে চার্জ করবেন না। এটি পাওয়ার ব্যাংকে প্রযোজ্য একই লিথিয়াম-ব্যাটারি
    নিয়ম।</p><h2>ফ্লাইট মোড</h2><p>ফোন, ট্যাবলেট ও ল্যাপটপ পুরো সময় ফ্লাইট মোডে ব্যবহার
    করা যায়। বড় ডিভাইস উড্ডয়ন ও অবতরণের জন্য গুছিয়ে রাখা হয়। ব্লুটুথ হেডফোন অনুমোদিত;
    ফ্লাইট মোডে নেওয়া যায় না এমন ডিভাইস বন্ধ থাকতে হবে।</p>
  body_html_hi: <h2>धूम्रपान</h2><p>इलेक्ट्रॉनिक सिगरेट और गर्म किए जाने वाले तंबाकू सहित
    हर उड़ान पर, हर केबिन में धूम्रपान निषिद्ध है। शौचालय के धुआँ संसूचक निगरानी में हैं और
    उनसे छेड़छाड़ अपने आप में अपराध है।</p><h2>बैगेज में इलेक्ट्रॉनिक सिगरेट</h2><p>उन्हें
    केबिन में ले जाएँ, कभी होल्ड में नहीं, और विमान में चार्ज न करें। यह वही लिथियम-बैटरी
    नियम है जो पावर बैंक पर लागू होता है।</p><h2>फ़्लाइट मोड</h2><p>फ़ोन, टैबलेट और लैपटॉप
    पूरी उड़ान में फ़्लाइट मोड में उपयोग किए जा सकते हैं। बड़े उपकरण टेक-ऑफ़ और लैंडिंग के
    लिए रख दिए जाते हैं। ब्लूटूथ हेडफ़ोन अनुमत हैं; जो उपकरण फ़्लाइट मोड में नहीं जा सकता
    उसे बंद रहना चाहिए।</p>
  body_html_ur: <h2>تمباکو نوشی</h2><p>الیکٹرانک سگریٹ اور گرم کیے جانے والے تمباکو سمیت ہر
    پرواز پر، ہر کیبن میں تمباکو نوشی ممنوع ہے۔ بیت الخلا کے دھوئیں کے ڈیٹیکٹر نگرانی میں
    ہیں اور ان سے چھیڑ چھاڑ بذاتِ خود جرم ہے۔</p><h2>سامان میں الیکٹرانک سگریٹ</h2><p>انہیں
    کیبن میں لے جائیں، کبھی ہولڈ میں نہیں، اور طیارے میں چارج نہ کریں۔ یہ وہی لیتھیم بیٹری
    قاعدہ ہے جو پاور بینک پر لاگو ہوتا ہے۔</p><h2>فلائٹ موڈ</h2><p>فون، ٹیبلٹ اور لیپ ٹاپ
    پوری پرواز میں فلائٹ موڈ میں استعمال کیے جا سکتے ہیں۔ بڑے آلات ٹیک آف اور لینڈنگ کے لیے
    رکھ دیے جاتے ہیں۔ بلوٹوتھ ہیڈ فون جائز ہیں؛ جو آلہ فلائٹ موڈ میں نہ جا سکے اسے بند رہنا
    چاہیے۔</p>
- slug: miles-family-pooling
  category: loyalty
  position: 10
  title_en: Pooling miles with family
  title_am: ማይሎችን ከቤተሰብ ጋር ማጠራቀም
  summary_en: Who can join a pool, and what pooling does not do.
  summary_am: ማን ማጠራቀሚያ መቀላቀል እንደሚችል፣ እና ማጠራቀም የማያደርገው።
  body_html_en: <h2>The pool</h2><p>Up to eight members of one household may pool. Every member
    keeps their own account and earns as usual; the pool is a shared balance that any nominated
    member may spend, and the pool head sets who may.</p><h2>What it does not do</h2><p>Pooled
    miles do not count towards anyone&#x27;s tier. Qualifying miles stay with the member who
    flew, so pooling changes what you can spend and never what tier you reach.</p>
  body_html_am: <h2>ማጠራቀሚያው</h2><p>ከአንድ ቤተሰብ እስከ ስምንት አባላት ማጠራቀም ይችላሉ። እያንዳንዱ አባል የራሱን ሒሳብ
    ይዞ እንደተለመደው ያገኛል፤ ማጠራቀሚያው ማንኛውም የተመደበ አባል ሊጠቀምበት የሚችል የጋራ ቀሪ ሒሳብ ነው፤ ማን እንደሚችልም የማጠራቀሚያው
    ኃላፊ ይወስናል።</p><h2>የማያደርገው</h2><p>የተጠራቀሙ ማይሎች ለማንም ደረጃ አይቆጠሩም። የብቁነት ማይሎች የበረረው አባል ጋር
    ይቀራሉ፤ ስለዚህ ማጠራቀም ሊያወጡት የሚችሉትን ይለውጣል እንጂ የሚደርሱበትን ደረጃ በጭራሽ አይለውጥም።</p>
  id: 54
  title_bn: পরিবারের সঙ্গে মাইল পুল করা
  title_hi: परिवार के साथ मील पूल करना
  title_ur: خاندان کے ساتھ میلز پول کرنا
  summary_bn: কে পুলে যোগ দিতে পারে, এবং পুলিং কী করে না।
  summary_hi: पूल में कौन शामिल हो सकता है, और पूलिंग क्या नहीं करती।
  summary_ur: پول میں کون شامل ہو سکتا ہے، اور پولنگ کیا نہیں کرتی۔
  body_html_bn: <h2>পুল</h2><p>এক পরিবারের আট জন পর্যন্ত সদস্য পুল করতে পারেন। প্রতিটি সদস্য
    নিজের অ্যাকাউন্ট রাখেন এবং স্বাভাবিকভাবে অর্জন করেন; পুল একটি ভাগ করা ব্যালেন্স যা যেকোনো
    মনোনীত সদস্য খরচ করতে পারেন, এবং পুল প্রধান ঠিক করেন কে পারবেন।</p><h2>এটি যা করে না</h2><p>পুল
    করা মাইল কারও টিয়ারে গণনা হয় না। কোয়ালিফাইং মাইল যিনি উড়েছেন তাঁর কাছেই থাকে, তাই
    পুলিং আপনি কী খরচ করতে পারেন তা বদলায় এবং কখনও কোন টিয়ারে পৌঁছান তা নয়।</p>
  body_html_hi: <h2>पूल</h2><p>एक परिवार के आठ सदस्य तक पूल कर सकते हैं। हर सदस्य अपना खाता
    रखता है और सामान्य रूप से अर्जित करता है; पूल एक साझा शेष है जिसे कोई भी नामित सदस्य खर्च
    कर सकता है, और पूल प्रमुख तय करता है कि कौन कर सकता है।</p><h2>यह क्या नहीं करता</h2><p>पूल
    किए गए मील किसी के टियर में नहीं गिने जाते। क्वालिफ़ाइंग मील उसी सदस्य के पास रहते हैं
    जिसने उड़ान भरी, इसलिए पूलिंग बदलती है कि आप क्या खर्च कर सकते हैं, कभी नहीं कि आप किस
    टियर तक पहुँचते हैं।</p>
  body_html_ur: <h2>پول</h2><p>ایک گھرانے کے آٹھ ارکان تک پول کر سکتے ہیں۔ ہر رکن اپنا اکاؤنٹ
    رکھتا ہے اور معمول کے مطابق حاصل کرتا ہے؛ پول ایک مشترکہ بیلنس ہے جسے کوئی بھی نامزد رکن
    خرچ کر سکتا ہے، اور پول کا سربراہ طے کرتا ہے کہ کون کر سکتا ہے۔</p><h2>یہ کیا نہیں کرتا</h2><p>پول
    کیے گئے میلز کسی کے ٹیئر میں شمار نہیں ہوتے۔ کوالیفائنگ میلز اسی رکن کے پاس رہتے ہیں جس
    نے پرواز کی، اس لیے پولنگ بدلتی ہے کہ آپ کیا خرچ کر سکتے ہیں اور کبھی نہیں کہ آپ کس ٹیئر
    تک پہنچتے ہیں۔</p>
- slug: partner-earning
  category: loyalty
  position: 11
  title_en: Earning on partner flights
  title_am: በአጋር በረራዎች ማግኘት
  summary_en: How to credit a partner flight, and when it will not credit.
  summary_am: የአጋር በረራን እንዴት ማስመዝገብ እንደሚቻል፣ እና መቼ እንደማይመዘገብ።
  body_html_en: <h2>Quote the number when you book</h2><p>Give your membership number at booking,
    not at the gate. A flight added afterwards credits within 6 to 8 weeks; one that never
    credits can be claimed for up to 6 months from the flight date, with the ticket number
    and the boarding pass.</p><h2>Fares that earn nothing</h2><p>Award tickets, staff and
    industry-discount tickets, tickets bought with a voucher for the full fare, and the deepest
    promotional fares on partner airlines. The fare rules on your booking say which applies.</p>
  body_html_am: <h2>ሲይዙ ቁጥሩን ይጥቀሱ</h2><p>የአባልነት ቁጥርዎን በበሩ ላይ ሳይሆን ቦታ ሲይዙ ይስጡ። በኋላ የተጨመረ በረራ
    በ6 እስከ 8 ሳምንታት ውስጥ ይመዘገባል፤ በጭራሽ የማይመዘገብ ደግሞ ከበረራው ቀን ጀምሮ እስከ 6 ወር ድረስ ከትኬት ቁጥሩና ከመሳፈሪያ
    ፈቃዱ ጋር ሊጠየቅ ይችላል።</p><h2>ምንም የማያስገኙ ታሪፎች</h2><p>የሽልማት ትኬቶች፣ የሠራተኛና የኢንዱስትሪ ቅናሽ ትኬቶች፣ ሙሉ
    ታሪፉን በቫውቸር የተገዙ ትኬቶች፣ እንዲሁም በአጋር አየር መንገዶች ላይ ያሉ በጣም ጥልቅ የቅናሽ ታሪፎች። በቦታ ማስያዣዎ ላይ ያሉት የታሪፍ
    ደንቦች የትኛው እንደሚሠራ ይናገራሉ።</p>
  id: 55
  title_bn: পার্টনার ফ্লাইটে অর্জন
  title_hi: पार्टनर उड़ानों पर अर्जन
  title_ur: پارٹنر پروازوں پر حصول
  summary_bn: পার্টনার ফ্লাইট কীভাবে জমা করবেন, এবং কখন তা জমা হবে না।
  summary_hi: पार्टनर उड़ान को कैसे क्रेडिट करें, और कब वह क्रेडिट नहीं होगी।
  summary_ur: پارٹنر پرواز کو کیسے کریڈٹ کریں، اور کب وہ کریڈٹ نہیں ہوگی۔
  body_html_bn: <h2>বুক করার সময় নম্বর দিন</h2><p>আপনার সদস্য নম্বর বুকিংয়ের সময় দিন, গেটে
    নয়। পরে যোগ করা ফ্লাইট 6 থেকে 8 সপ্তাহের মধ্যে জমা হয়; যেটি কখনও জমা হয় না তা ফ্লাইটের
    তারিখ থেকে 6 মাস পর্যন্ত টিকিট নম্বর ও বোর্ডিং পাসসহ দাবি করা যায়।</p><h2>যে ভাড়া কিছুই
    অর্জন করে না</h2><p>অ্যাওয়ার্ড টিকিট, স্টাফ ও শিল্প-ছাড়ের টিকিট, পূর্ণ ভাড়ার ভাউচারে
    কেনা টিকিট, এবং পার্টনার এয়ারলাইনের সবচেয়ে কম প্রমোশনাল ভাড়া। আপনার বুকিংয়ের ভাড়ার
    নিয়ম বলে কোনটি প্রযোজ্য।</p>
  body_html_hi: <h2>बुक करते समय नंबर बताएँ</h2><p>अपना सदस्यता नंबर बुकिंग के समय दें, गेट
    पर नहीं। बाद में जोड़ी गई उड़ान 6 से 8 सप्ताह में क्रेडिट होती है; जो कभी क्रेडिट न हो
    उसका दावा उड़ान की तिथि से 6 महीने तक टिकट नंबर और बोर्डिंग पास के साथ किया जा सकता है।</p><h2>जो
    किराए कुछ नहीं अर्जित करते</h2><p>अवार्ड टिकट, स्टाफ़ और उद्योग-छूट टिकट, पूरे किराए के
    वाउचर से खरीदे गए टिकट, और पार्टनर एयरलाइनों पर सबसे कम प्रमोशनल किराए। आपकी बुकिंग के
    किराया नियम बताते हैं कि कौन सा लागू है।</p>
  body_html_ur: <h2>بک کرتے وقت نمبر بتائیں</h2><p>اپنا رکنیتی نمبر بکنگ کے وقت دیں، گیٹ پر
    نہیں۔ بعد میں شامل کی گئی پرواز 6 سے 8 ہفتوں میں کریڈٹ ہوتی ہے؛ جو کبھی کریڈٹ نہ ہو اس
    کا کلیم پرواز کی تاریخ سے 6 ماہ تک ٹکٹ نمبر اور بورڈنگ پاس کے ساتھ کیا جا سکتا ہے۔</p><h2>وہ
    کرائے جو کچھ حاصل نہیں کرتے</h2><p>ایوارڈ ٹکٹ، اسٹاف اور صنعتی رعایتی ٹکٹ، پورے کرائے
    کے واؤچر سے خریدے گئے ٹکٹ، اور پارٹنر ایئرلائنوں پر سب سے کم پروموشنل کرائے۔ آپ کی بکنگ
    کے کرایہ قواعد بتاتے ہیں کہ کون سا لاگو ہے۔</p>
- slug: lounge-eligibility-explained
  category: loyalty
  position: 12
  title_en: Who gets into a lounge
  title_am: ወደ ላውንጅ ማን እንደሚገባ
  summary_en: The four ways in, and what each one includes.
  summary_am: አራቱ የመግቢያ መንገዶች፣ እና እያንዳንዱ የሚያካትተው።
  body_html_en: '<h2>Four ways in</h2><ul><li>A Highland Class boarding pass for the flight
    you are about to take.</li><li>Gold or platinum tier, in any cabin, including one guest.</li><li>Silver
    tier, in any cabin, without a guest.</li><li>A walk-in pass bought for the visit, which
    anyone with a boarding pass may buy.</li></ul><h2>What entry includes</h2><p>Buffet and
    bar, wi-fi, showers where the lounge has them, and a three-hour stay. Entry is at the
    departure airport only: a lounge at your destination is not part of your ticket, however
    you got into the one you left from.</p>'
  body_html_am: <h2>አራት የመግቢያ መንገዶች</h2><ul><li>ሊሳፈሩበት ላለው በረራ የሃይላንድ ክላስ የመሳፈሪያ ፈቃድ።</li><li>የወርቅ
    ወይም የፕላቲነም ደረጃ፣ በማንኛውም የጉዞ ክፍል፣ አንድ እንግዳን ጨምሮ።</li><li>የሲልቨር ደረጃ፣ በማንኛውም የጉዞ ክፍል፣ ያለ እንግዳ።</li><li>ለጉብኝቱ
    የተገዛ የመግቢያ ፈቃድ፤ የመሳፈሪያ ፈቃድ ያለው ማንኛውም ሰው ሊገዛው ይችላል።</li></ul><h2>መግቢያው የሚያካትተው</h2><p>ቡፌና
    መጠጥ ቤት፣ ዋይ-ፋይ፣ ላውንጁ ሲኖረው ሻወር፣ እንዲሁም የሦስት ሰዓት ቆይታ። መግቢያው በመነሻ አየር ማረፊያ ብቻ ነው፦ ወደ ወጡበት ላውንጅ
    እንዴት ቢገቡም በመድረሻዎ ያለ ላውንጅ የትኬትዎ አካል አይደለም።</p>
  id: 56
  title_bn: কে লাউঞ্জে ঢুকতে পারে
  title_hi: लाउंज में कौन जा सकता है
  title_ur: لاؤنج میں کون جا سکتا ہے
  summary_bn: ঢোকার চারটি উপায়, এবং প্রতিটিতে কী অন্তর্ভুক্ত।
  summary_hi: प्रवेश के चार तरीके, और प्रत्येक में क्या शामिल है।
  summary_ur: داخلے کے چار طریقے، اور ہر ایک میں کیا شامل ہے۔
  body_html_bn: '<h2>ঢোকার চারটি উপায়</h2><ul><li>আপনি যে ফ্লাইটে যাচ্ছেন তার একটি হাইল্যান্ড
    ক্লাস বোর্ডিং পাস।</li><li>গোল্ড বা প্ল্যাটিনাম টিয়ার, যেকোনো কেবিনে, একজন অতিথিসহ।</li><li>সিলভার
    টিয়ার, যেকোনো কেবিনে, অতিথি ছাড়া।</li><li>এই সফরের জন্য কেনা ওয়াক-ইন পাস, যা বোর্ডিং
    পাসধারী যে কেউ কিনতে পারেন।</li></ul><h2>প্রবেশে যা অন্তর্ভুক্ত</h2><p>বুফে ও বার, ওয়াই-ফাই,
    লাউঞ্জে থাকলে শাওয়ার, এবং তিন ঘণ্টার অবস্থান। প্রবেশ শুধু প্রস্থান বিমানবন্দরে: আপনার
    গন্তব্যের লাউঞ্জ আপনার টিকিটের অংশ নয়, আপনি যেভাবেই যাত্রা শুরুর লাউঞ্জে ঢুকে থাকুন।</p>'
  body_html_hi: '<h2>प्रवेश के चार तरीके</h2><ul><li>जिस उड़ान पर आप जाने वाले हैं उसका हाइलैंड
    क्लास बोर्डिंग पास।</li><li>गोल्ड या प्लैटिनम टियर, किसी भी केबिन में, एक अतिथि सहित।</li><li>सिल्वर
    टियर, किसी भी केबिन में, बिना अतिथि के।</li><li>इस विज़िट के लिए खरीदा गया वॉक-इन पास,
    जो बोर्डिंग पास वाला कोई भी खरीद सकता है।</li></ul><h2>प्रवेश में क्या शामिल है</h2><p>बुफ़े
    और बार, वाई-फ़ाई, जहाँ लाउंज में हों वहाँ शॉवर, और तीन घंटे का ठहराव। प्रवेश केवल प्रस्थान
    हवाई अड्डे पर है: आपके गंतव्य का लाउंज आपके टिकट का हिस्सा नहीं है, चाहे आप जिस लाउंज
    से चले उसमें कैसे भी गए हों।</p>'
  body_html_ur: '<h2>داخلے کے چار طریقے</h2><ul><li>اس پرواز کا ہائی لینڈ کلاس بورڈنگ پاس
    جس پر آپ جانے والے ہیں۔</li><li>گولڈ یا پلاٹینم ٹیئر، کسی بھی کیبن میں، ایک مہمان سمیت۔</li><li>سلور
    ٹیئر، کسی بھی کیبن میں، بغیر مہمان کے۔</li><li>اس دورے کے لیے خریدا گیا واک اِن پاس، جو
    بورڈنگ پاس رکھنے والا کوئی بھی خرید سکتا ہے۔</li></ul><h2>داخلے میں کیا شامل ہے</h2><p>بوفے
    اور بار، وائی فائی، جہاں لاؤنج میں ہوں وہاں شاور، اور تین گھنٹے کا قیام۔ داخلہ صرف روانگی
    کے ہوائی اڈے پر ہے: آپ کی منزل کا لاؤنج آپ کے ٹکٹ کا حصہ نہیں ہے، چاہے آپ جس لاؤنج سے
    چلے اس میں کیسے بھی گئے ہوں۔</p>'
