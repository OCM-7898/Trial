  category: baggage
  position: 2
  title_en: Cabin baggage
  title_am: የእጅ ሻንጣ
  summary_en: Size, weight and what must go in the hold instead.
  summary_am: መጠን፣ ክብደትና በምትኩ በጭነት ክፍል መሄድ ያለበት።
  body_html_en: <h2>What you may carry into the cabin</h2><p>One cabin bag of up to 7 kg in
    Selam Economy and 14 kg in Highland Class, not exceeding 55 x 38 x 20 cm including wheels
    and handles. One personal item such as a handbag or laptop bag may be carried in addition.</p><p>On
    full flights and on Dash 8-400 services, cabin bags may be placed in the hold at the gate
    at no charge. Remove medication, documents and valuables first.</p><h2>Liquids</h2><p>Containers
    of up to 100 ml each, in a single transparent resealable bag of no more than one litre.
    Baby food and prescribed medication for the journey are exempt but must be declared at
    security.</p>
  body_html_am: <h2>ወደ ካቢን ይዘው መግባት የሚችሉት</h2><p>በሰላም ኢኮኖሚ እስከ 7 ኪግ እና በሃይላንድ ክላስ እስከ 14 ኪግ
    የሚመዝን አንድ የእጅ ሻንጣ፤ መንኮራኩሮችንና እጀታዎችን ጨምሮ ከ55 x 38 x 20 ሴሜ መብለጥ የለበትም። እንደ የእጅ ቦርሳ ወይም የላፕቶፕ
    ቦርሳ ያለ አንድ የግል ዕቃ በተጨማሪ ሊያዝ ይችላል።</p><p>በሙሉ በረራዎችና በዳሽ 8-400 አገልግሎቶች የእጅ ሻንጣዎች ያለክፍያ በበሩ
    ላይ ወደ ጭነት ክፍል ሊገቡ ይችላሉ። መድኃኒት፣ ሰነዶችንና ውድ ዕቃዎችን አስቀድመው ያውጡ።</p><h2>ፈሳሾች</h2><p>እያንዳንዳቸው
    እስከ 100 ሚሊ ሊትር የሆኑ ዕቃዎች፣ ከአንድ ሊትር በማይበልጥ አንድ ግልጽ ሊዘጋ በሚችል ከረጢት ውስጥ። የሕፃናት ምግብና ለጉዞው የታዘዘ
    መድኃኒት ነጻ ናቸው፤ ነገር ግን በደህንነት ፍተሻ መገለጽ አለባቸው።</p>
  id: 3
  title_bn: কেবিন ব্যাগেজ
  title_hi: केबिन बैगेज
  title_ur: کیبن سامان
  summary_bn: মাপ, ওজন এবং কী কী বদলে হোল্ডে যেতে হবে।
  summary_hi: आकार, वज़न और क्या इसके बजाय होल्ड में जाना चाहिए।
  summary_ur: سائز، وزن اور کیا اس کے بجائے ہولڈ میں جانا چاہیے۔
  body_html_bn: <h2>কেবিনে আপনি যা বহন করতে পারেন</h2><p>সেলাম ইকোনমিতে 7 kg এবং হাইল্যান্ড
    ক্লাসে 14 kg পর্যন্ত একটি কেবিন ব্যাগ, চাকা ও হাতলসহ 55 x 38 x 20 cm-এর বেশি নয়। এর সঙ্গে
    হ্যান্ডব্যাগ বা ল্যাপটপ ব্যাগের মতো একটি ব্যক্তিগত জিনিস বহন করা যায়।</p><p>পূর্ণ ফ্লাইটে
    এবং Dash 8-400 পরিষেবায় কেবিন ব্যাগ গেটে বিনা খরচে হোল্ডে রাখা হতে পারে। আগে ওষুধ, কাগজপত্র
    ও মূল্যবান জিনিস বের করে নিন।</p><h2>তরল</h2><p>প্রতিটি 100 ml পর্যন্ত পাত্র, এক লিটারের
    বেশি নয় এমন একটি স্বচ্ছ পুনরায় সিলযোগ্য ব্যাগে। যাত্রার জন্য শিশুখাদ্য ও প্রেসক্রাইব
    করা ওষুধ ছাড় পায়, তবে নিরাপত্তা তল্লাশিতে ঘোষণা করতে হবে।</p>
  body_html_hi: <h2>आप केबिन में क्या ले जा सकते हैं</h2><p>सेलाम इकोनॉमी में 7 kg और हाइलैंड
    क्लास में 14 kg तक का एक केबिन बैग, पहियों और हैंडल सहित 55 x 38 x 20 cm से अधिक नहीं।
    इसके अतिरिक्त हैंडबैग या लैपटॉप बैग जैसी एक व्यक्तिगत वस्तु ले जाई जा सकती है।</p><p>भरी
    उड़ानों और Dash 8-400 सेवाओं पर केबिन बैग गेट पर बिना शुल्क होल्ड में रखे जा सकते हैं।
    पहले दवा, दस्तावेज़ और क़ीमती सामान निकाल लें।</p><h2>तरल पदार्थ</h2><p>प्रत्येक 100 ml
    तक के कंटेनर, एक लीटर से अधिक नहीं के एक पारदर्शी पुनः सील होने वाले बैग में। यात्रा के
    लिए शिशु आहार और निर्धारित दवा को छूट है, लेकिन सुरक्षा जाँच में घोषित करना होगा।</p>
  body_html_ur: <h2>آپ کیبن میں کیا لے جا سکتے ہیں</h2><p>سلام اکانومی میں 7 kg اور ہائی لینڈ
    کلاس میں 14 kg تک کا ایک کیبن بیگ، پہیوں اور ہینڈل سمیت 55 x 38 x 20 cm سے زیادہ نہیں۔
    اس کے علاوہ ہینڈ بیگ یا لیپ ٹاپ بیگ جیسی ایک ذاتی چیز لے جائی جا سکتی ہے۔</p><p>بھری ہوئی
    پروازوں اور Dash 8-400 سروسز پر کیبن بیگ گیٹ پر بلا معاوضہ ہولڈ میں رکھے جا سکتے ہیں۔
    پہلے دوا، دستاویزات اور قیمتی اشیا نکال لیں۔</p><h2>مائعات</h2><p>ہر ایک 100 ml تک کے
    کنٹینر، ایک لیٹر سے زیادہ نہ ہونے والے ایک شفاف دوبارہ سیل ہونے والے بیگ میں۔ سفر کے لیے
    بچوں کی خوراک اور تجویز کردہ دوا مستثنیٰ ہیں لیکن سیکیورٹی پر ظاہر کرنی ہوں گی۔</p>
- slug: baggage-infants
  category: baggage
  position: 3
  title_en: Baggage for infants and children
  title_am: ለጨቅላዎችና ለሕፃናት ሻንጣ
  summary_en: Allowances for passengers under 12, and what counts as equipment.
  summary_am: ከ12 ዓመት በታች ላሉ ተሳፋሪዎች ፈቃዶች፣ እና እንደ መሣሪያ የሚቆጠረው።
  body_html_en: <h2>Infants under two</h2><p>An infant travelling on an adult&#x27;s lap has
    one checked bag of up to 10 kg and no cabin baggage allowance of their own.</p><p>One
    pushchair and one car seat travel free on every route, in addition to the allowance, and
    may be taken to the aircraft door.</p><h2>Children aged two to eleven</h2><p>A child with
    their own seat has the same free allowance as an adult on the same route and cabin.</p>
  body_html_am: <h2>ከሁለት ዓመት በታች ጨቅላዎች</h2><p>በአዋቂ ጭን ላይ የሚጓዝ ጨቅላ እስከ 10 ኪግ የሚመዝን አንድ የተመዘገበ
    ሻንጣ አለው፤ የራሱ የእጅ ሻንጣ ፈቃድ የለውም።</p><p>አንድ የሕፃን ጋሪና አንድ የመኪና መቀመጫ ከፈቃዱ በተጨማሪ በሁሉም መስመር በነጻ
    ይጓዛሉ፤ እስከ አውሮፕላኑ በር ሊወሰዱም ይችላሉ።</p><h2>ከሁለት እስከ አስራ አንድ ዓመት ሕፃናት</h2><p>የራሱ መቀመጫ ያለው ሕፃን
    በተመሳሳይ መስመርና የጉዞ ክፍል ከአዋቂ ጋር እኩል የነጻ ፈቃድ አለው።</p>
  id: 4
  title_bn: নবজাতক ও শিশুদের ব্যাগেজ
  title_hi: शिशुओं और बच्चों के लिए बैगेज
  title_ur: شیرخوار اور بچوں کا سامان
  summary_bn: 12 বছরের কম বয়সী যাত্রীদের অ্যালাউন্স, এবং কী সরঞ্জাম হিসেবে গণ্য হয়।
  summary_hi: 12 वर्ष से कम आयु के यात्रियों के अलाउंस, और क्या उपकरण माना जाता है।
  summary_ur: 12 سال سے کم عمر مسافروں کے الاؤنس، اور کیا سازوسامان شمار ہوتا ہے۔
  body_html_bn: <h2>দুই বছরের কম নবজাতক</h2><p>প্রাপ্তবয়স্কের কোলে ভ্রমণকারী নবজাতকের 10
    kg পর্যন্ত একটি চেকড ব্যাগ থাকে এবং নিজস্ব কোনো কেবিন ব্যাগেজ অ্যালাউন্স থাকে না।</p><p>প্রতিটি
    রুটে একটি পুশচেয়ার ও একটি গাড়ির আসন অ্যালাউন্সের অতিরিক্ত হিসেবে বিনামূল্যে যায়, এবং
    উড়োজাহাজের দরজা পর্যন্ত নেওয়া যায়।</p><h2>দুই থেকে এগারো বছরের শিশু</h2><p>নিজস্ব আসনযুক্ত
    শিশুর একই রুট ও কেবিনে প্রাপ্তবয়স্কের সমান বিনামূল্যের অ্যালাউন্স থাকে।</p>
  body_html_hi: <h2>दो वर्ष से कम के शिशु</h2><p>वयस्क की गोद में यात्रा कर रहे शिशु के पास
    10 kg तक का एक चेक्ड बैग होता है और अपना कोई केबिन बैगेज अलाउंस नहीं होता।</p><p>हर मार्ग
    पर एक पुशचेयर और एक कार सीट अलाउंस के अतिरिक्त निःशुल्क जाती हैं, और उन्हें विमान के दरवाज़े
    तक ले जाया जा सकता है।</p><h2>दो से ग्यारह वर्ष के बच्चे</h2><p>अपनी सीट वाले बच्चे का
    निःशुल्क अलाउंस उसी मार्ग और केबिन पर वयस्क के बराबर होता है।</p>
  body_html_ur: <h2>دو سال سے کم عمر شیرخوار</h2><p>بالغ کی گود میں سفر کرنے والے شیرخوار
    کے پاس 10 kg تک کا ایک چیکڈ بیگ ہوتا ہے اور اپنا کوئی کیبن سامان الاؤنس نہیں ہوتا۔</p><p>ہر
    روٹ پر ایک پش چیئر اور ایک کار سیٹ الاؤنس کے علاوہ مفت سفر کرتی ہیں، اور انہیں طیارے کے
    دروازے تک لے جایا جا سکتا ہے۔</p><h2>دو سے گیارہ سال کے بچے</h2><p>اپنی سیٹ والے بچے کا
    مفت الاؤنس اسی روٹ اور کیبن پر بالغ کے برابر ہوتا ہے۔</p>
- slug: baggage-codeshare
  category: baggage
  position: 4
  title_en: Baggage on partner-operated flights
  title_am: በአጋር በሚከናወኑ በረራዎች ሻንጣ
  summary_en: Whose rules apply when part of your journey is flown by another airline.
  summary_am: የጉዞዎ አንድ ክፍል በሌላ አየር መንገድ ሲከናወን የማን ደንብ እንደሚሠራ።
  body_html_en: <h2>The first marketing carrier sets the allowance</h2><p>Where a journey
    booked with us includes a sector operated by a partner, our allowance applies throughout,
    provided the whole journey is on one booking reference. Separate bookings are treated
    as separate journeys and each carrier&#x27;s own rules apply.</p><p>Partner-operated sectors
    cannot be checked in online; use the airport desk.</p>
  body_html_am: <h2>የመጀመሪያው ሻጭ አየር መንገድ ፈቃዱን ይወስናል</h2><p>ከእኛ ጋር የተያዘ ጉዞ በአጋር የሚከናወን ክፍል ካካተተ፣
    ጉዞው በሙሉ በአንድ የቦታ ማስያዣ ማጣቀሻ እስከሆነ ድረስ የእኛ ፈቃድ በሙሉ ጉዞው ላይ ይሠራል። የተለያዩ የቦታ ማስያዣዎች እንደ የተለያዩ
    ጉዞዎች ይቆጠራሉ፤ የእያንዳንዱም አየር መንገድ ደንብ ይሠራል።</p><p>በአጋር የሚከናወኑ ክፍሎች በመስመር ላይ ቼክ-ኢን ሊደረጉ አይችሉም፤
    የአየር ማረፊያውን ጠረጴዛ ይጠቀሙ።</p>
  id: 5
  title_bn: পার্টনার-পরিচালিত ফ্লাইটে ব্যাগেজ
  title_hi: पार्टनर-संचालित उड़ानों पर बैगेज
  title_ur: پارٹنر کی چلائی گئی پروازوں پر سامان
  summary_bn: আপনার যাত্রার একটি অংশ অন্য এয়ারলাইন উড়ালে কার নিয়ম প্রযোজ্য।
  summary_hi: जब आपकी यात्रा का कुछ हिस्सा दूसरी एयरलाइन उड़ाती है तो किसके नियम लागू होते
    हैं।
  summary_ur: جب آپ کے سفر کا کچھ حصہ دوسری ایئرلائن اڑاتی ہے تو کس کے قواعد لاگو ہوتے ہیں۔
  body_html_bn: <h2>প্রথম মার্কেটিং ক্যারিয়ার অ্যালাউন্স নির্ধারণ করে</h2><p>আমাদের সঙ্গে
    বুক করা যাত্রায় পার্টনার-পরিচালিত সেক্টর থাকলে, পুরো যাত্রা একটি বুকিং রেফারেন্সে থাকলে
    আমাদের অ্যালাউন্স পুরো যাত্রায় প্রযোজ্য। আলাদা বুকিং আলাদা যাত্রা হিসেবে গণ্য হয় এবং
    প্রতিটি ক্যারিয়ারের নিজস্ব নিয়ম প্রযোজ্য।</p><p>পার্টনার-পরিচালিত সেক্টরে অনলাইনে চেক-ইন
    করা যায় না; বিমানবন্দরের ডেস্ক ব্যবহার করুন।</p>
  body_html_hi: <h2>पहला मार्केटिंग कैरियर अलाउंस तय करता है</h2><p>जहाँ हमारे साथ बुक की
    गई यात्रा में पार्टनर द्वारा संचालित सेक्टर शामिल है, वहाँ हमारा अलाउंस पूरी यात्रा में
    लागू होता है, बशर्ते पूरी यात्रा एक ही बुकिंग संदर्भ पर हो। अलग बुकिंग अलग यात्राएँ मानी
    जाती हैं और हर कैरियर के अपने नियम लागू होते हैं।</p><p>पार्टनर-संचालित सेक्टरों पर ऑनलाइन
    चेक-इन नहीं किया जा सकता; हवाई अड्डे के डेस्क का उपयोग करें।</p>
  body_html_ur: <h2>پہلا مارکیٹنگ کیریئر الاؤنس طے کرتا ہے</h2><p>جہاں ہمارے ساتھ بک کیے گئے
    سفر میں پارٹنر کا چلایا گیا سیکٹر شامل ہو، وہاں ہمارا الاؤنس پورے سفر پر لاگو ہوتا ہے،
    بشرطیکہ پورا سفر ایک ہی بکنگ حوالے پر ہو۔ علیحدہ بکنگز علیحدہ سفر سمجھی جاتی ہیں اور ہر
    کیریئر کے اپنے قواعد لاگو ہوتے ہیں۔</p><p>پارٹنر کے چلائے گئے سیکٹرز پر آن لائن چیک اِن
    نہیں ہو سکتا؛ ہوائی اڈے کا ڈیسک استعمال کریں۔</p>
- slug: baggage-restricted
  category: baggage
  position: 5
  title_en: Restricted and prohibited items
  title_am: የተገደቡና የተከለከሉ ዕቃዎች
  summary_en: What may not travel at all, and what may travel only in the hold.
  summary_am: በፍጹም መጓዝ የማይችለው፣ እና በጭነት ክፍል ብቻ መጓዝ የሚችለው።
  body_html_en: '<h2>Never accepted</h2><ul><li>Explosives, fireworks and flares.</li><li>Compressed
    gases, including camping gas and unapproved oxygen cylinders.</li><li>Corrosives such
    as mercury, wet-cell batteries and drain cleaner.</li></ul><h2>Hold only</h2><p>Sharp
    articles, tools longer than 6 cm, sporting bats and cricket stumps must be checked. Spare
    lithium batteries are the reverse: they must travel in the cabin and never in the hold.</p>'
  body_html_am: <h2>በፍጹም የማይፈቀዱ</h2><ul><li>ፈንጂዎች፣ ርችቶችና ችቦዎች።</li><li>የተጨመቁ ጋዞች፣ የካምፕ ጋዝንና
    ያልጸደቁ የኦክስጅን ሲሊንደሮችን ጨምሮ።</li><li>እንደ ሜርኩሪ፣ እርጥብ ባትሪዎችና የቱቦ ማጽጃ ያሉ የሚበሉ ንጥረ ነገሮች።</li></ul><h2>በጭነት
    ክፍል ብቻ</h2><p>ስለታም ዕቃዎች፣ ከ6 ሴሜ የሚረዝሙ መሣሪያዎች፣ የስፖርት ዱላዎችና የክሪኬት እንጨቶች መመዝገብ አለባቸው። ተጠባባቂ
    የሊቲየም ባትሪዎች ግን ተቃራኒ ናቸው፤ በካቢን ውስጥ መጓዝ አለባቸው እንጂ በጭነት ክፍል በፍጹም አይደለም።</p>
  id: 6
  title_bn: সীমাবদ্ধ ও নিষিদ্ধ জিনিস
  title_hi: प्रतिबंधित और निषिद्ध वस्तुएँ
  title_ur: محدود اور ممنوعہ اشیا
  summary_bn: কী একেবারেই যেতে পারে না, আর কী শুধু হোল্ডে যেতে পারে।
  summary_hi: क्या बिल्कुल नहीं जा सकता, और क्या केवल होल्ड में जा सकता है।
  summary_ur: کیا بالکل نہیں جا سکتا، اور کیا صرف ہولڈ میں جا سکتا ہے۔
  body_html_bn: '<h2>কখনও গ্রহণ করা হয় না</h2><ul><li>বিস্ফোরক, আতশবাজি ও ফ্লেয়ার।</li><li>ক্যাম্পিং
    গ্যাস ও অননুমোদিত অক্সিজেন সিলিন্ডারসহ সংকুচিত গ্যাস।</li><li>পারদ, ওয়েট-সেল ব্যাটারি
    ও ড্রেন ক্লিনারের মতো ক্ষয়কারী পদার্থ।</li></ul><h2>শুধু হোল্ডে</h2><p>ধারালো জিনিস,
    6 cm-এর বেশি লম্বা যন্ত্রপাতি, ক্রীড়ার ব্যাট ও ক্রিকেট স্টাম্প চেক করতে হবে। অতিরিক্ত
    লিথিয়াম ব্যাটারি ঠিক উল্টো: সেগুলি কেবিনে যেতে হবে এবং কখনও হোল্ডে নয়।</p>'
  body_html_hi: '<h2>कभी स्वीकार नहीं</h2><ul><li>विस्फोटक, आतिशबाज़ी और फ़्लेयर।</li><li>कैंपिंग
    गैस और अनुमोदित न किए गए ऑक्सीजन सिलेंडर सहित संपीड़ित गैसें।</li><li>पारा, वेट-सेल बैटरी
    और ड्रेन क्लीनर जैसे संक्षारक पदार्थ।</li></ul><h2>केवल होल्ड</h2><p>नुकीली वस्तुएँ, 6
    cm से लंबे औज़ार, खेल के बल्ले और क्रिकेट स्टंप चेक किए जाने चाहिए। अतिरिक्त लिथियम बैटरियाँ
    इसके उलट हैं: उन्हें केबिन में जाना चाहिए और कभी होल्ड में नहीं।</p>'
  body_html_ur: '<h2>کبھی قبول نہیں</h2><ul><li>دھماکہ خیز مواد، آتش بازی اور فلیئرز۔</li><li>کیمپنگ
    گیس اور غیر منظور شدہ آکسیجن سلنڈر سمیت کمپریسڈ گیسیں۔</li><li>پارہ، ویٹ سیل بیٹریاں اور
    ڈرین کلینر جیسے کھرچنے والے مادے۔</li></ul><h2>صرف ہولڈ</h2><p>تیز دھار اشیا، 6 cm سے
    لمبے اوزار، کھیلوں کے بلے اور کرکٹ اسٹمپ چیک کیے جانے چاہئیں۔ فالتو لیتھیم بیٹریاں اس
    کے برعکس ہیں: انہیں کیبن میں سفر کرنا چاہیے اور کبھی ہولڈ میں نہیں۔</p>'
- slug: airport-checkin
  category: booking-help
  position: 1
  title_en: Airport check-in and bag drop
  title_am: የአየር ማረፊያ ቼክ-ኢንና ሻንጣ ማስረከቢያ
  summary_en: Desk opening and closing times, and when you must use a desk.
  summary_am: የጠረጴዛ መክፈቻና መዝጊያ ሰዓቶች፣ እና ጠረጴዛ መጠቀም ያለብዎት መቼ እንደሆነ።
  body_html_en: <h2>Desk times</h2><p>Desks open 3 hours before an international departure
    and 2 hours before a domestic one, and close 60 minutes before departure on all routes.
    Bag drop for passengers already checked in online closes at the same time.</p><h2>When
    a desk is required</h2><p>Passengers travelling with an infant on the lap, an unaccompanied
    minor, booked special assistance, or on a partner-operated sector must check in at a desk.
    Group bookings of ten or more are handled by the group desk.</p>
  body_html_am: <h2>የጠረጴዛ ሰዓቶች</h2><p>ጠረጴዛዎች ከዓለም አቀፍ መነሻ 3 ሰዓት በፊት እና ከአገር ውስጥ 2 ሰዓት በፊት
    ይከፈታሉ፤ በሁሉም መስመሮች ከመነሻው 60 ደቂቃ በፊት ይዘጋሉ። አስቀድመው በመስመር ላይ ቼክ-ኢን ላደረጉ ተሳፋሪዎች የሻንጣ ማስረከቢያም
    በተመሳሳይ ሰዓት ይዘጋል።</p><h2>ጠረጴዛ የሚያስፈልግበት ጊዜ</h2><p>ጨቅላን በጭን ይዘው የሚጓዙ፣ ያለአጃቢ ሕፃናት፣ ልዩ ድጋፍ
    ያስያዙ፣ ወይም በአጋር በሚከናወን ክፍል ላይ ያሉ ተሳፋሪዎች በጠረጴዛ ቼክ-ኢን ማድረግ አለባቸው። አሥርና ከዚያ በላይ የቡድን ቦታ ማስያዣዎች
    በቡድን ጠረጴዛ ይስተናገዳሉ።</p>
  id: 7
  title_bn: বিমানবন্দরে চেক-ইন ও ব্যাগ ড্রপ
  title_hi: हवाई अड्डे पर चेक-इन और बैग ड्रॉप
  title_ur: ہوائی اڈے پر چیک اِن اور بیگ ڈراپ
  summary_bn: ডেস্ক খোলা ও বন্ধের সময়, এবং কখন আপনাকে ডেস্ক ব্যবহার করতেই হবে।
  summary_hi: डेस्क खुलने और बंद होने का समय, और कब आपको डेस्क का उपयोग करना ही होगा।
  summary_ur: ڈیسک کھلنے اور بند ہونے کے اوقات، اور کب آپ کو ڈیسک استعمال کرنا ہی ہوگا۔
  body_html_bn: <h2>ডেস্কের সময়</h2><p>ডেস্ক আন্তর্জাতিক প্রস্থানের 3 ঘণ্টা আগে এবং অভ্যন্তরীণ
    প্রস্থানের 2 ঘণ্টা আগে খোলে, এবং সব রুটে প্রস্থানের 60 মিনিট আগে বন্ধ হয়। অনলাইনে ইতিমধ্যে
    চেক-ইন করা যাত্রীদের ব্যাগ ড্রপ একই সময়ে বন্ধ হয়।</p><h2>কখন ডেস্ক প্রয়োজন</h2><p>কোলে
    নবজাতকসহ, সঙ্গীহীন নাবালকসহ, বুক করা বিশেষ সহায়তাসহ, বা পার্টনার-পরিচালিত সেক্টরে ভ্রমণকারী
    যাত্রীদের ডেস্কে চেক-ইন করতে হবে। দশ বা তার বেশি জনের গ্রুপ বুকিং গ্রুপ ডেস্ক পরিচালনা
    করে।</p>
  body_html_hi: <h2>डेस्क का समय</h2><p>डेस्क अंतरराष्ट्रीय प्रस्थान से 3 घंटे पहले और घरेलू
    प्रस्थान से 2 घंटे पहले खुलते हैं, और सभी मार्गों पर प्रस्थान से 60 मिनट पहले बंद हो जाते
    हैं। ऑनलाइन पहले से चेक-इन कर चुके यात्रियों के लिए बैग ड्रॉप उसी समय बंद होता है।</p><h2>कब
    डेस्क आवश्यक है</h2><p>गोद में शिशु, अकेले यात्रा कर रहे नाबालिग, बुक की गई विशेष सहायता,
    या पार्टनर-संचालित सेक्टर पर यात्रा कर रहे यात्रियों को डेस्क पर चेक-इन करना होगा। दस
    या अधिक की समूह बुकिंग समूह डेस्क द्वारा संभाली जाती है।</p>
  body_html_ur: <h2>ڈیسک کے اوقات</h2><p>ڈیسک بین الاقوامی روانگی سے 3 گھنٹے پہلے اور ملکی
    روانگی سے 2 گھنٹے پہلے کھلتے ہیں، اور تمام روٹس پر روانگی سے 60 منٹ پہلے بند ہو جاتے ہیں۔
    آن لائن پہلے سے چیک اِن کر چکے مسافروں کے لیے بیگ ڈراپ اسی وقت بند ہوتا ہے۔</p><h2>کب
    ڈیسک درکار ہے</h2><p>گود میں شیرخوار، تنہا سفر کرنے والے نابالغ، بک شدہ خصوصی معاونت،
    یا پارٹنر کے چلائے گئے سیکٹر پر سفر کرنے والے مسافروں کو ڈیسک پر چیک اِن کرنا ہوگا۔ دس
    یا زیادہ کی گروپ بکنگز گروپ ڈیسک سنبھالتا ہے۔</p>
- slug: boarding-and-gates
  category: booking-help
  position: 2
  title_en: Boarding and gate closure
  title_am: መሳፈሪያና የበር መዘጋት
  summary_en: When boarding starts, and what happens if you arrive late at the gate.
  summary_am: መሳፈር መቼ እንደሚጀምር፣ እና በበሩ ዘግይተው ከደረሱ ምን እንደሚሆን።
  body_html_en: <h2>Timings</h2><p>Boarding begins 40 minutes before departure and the gate
    closes 20 minutes before. A boarding pass shows the boarding time, not the departure time,
    in its boarding field.</p><p>Passengers not at the gate at closure are offloaded with
    their baggage and the fare rules of their ticket determine whether a rebooking is chargeable.</p>
  body_html_am: <h2>ሰዓቶች</h2><p>መሳፈር ከመነሻው 40 ደቂቃ በፊት ይጀምራል፤ በሩም 20 ደቂቃ በፊት ይዘጋል። የመሳፈሪያ ፈቃድ
    በመሳፈሪያ ሳጥኑ ውስጥ የመሳፈሪያ ሰዓቱን እንጂ የመነሻ ሰዓቱን አያሳይም።</p><p>በመዘጋቻ ሰዓት በበሩ ያልተገኙ ተሳፋሪዎች ከሻንጣቸው
    ጋር ይወርዳሉ፤ የትኬታቸው የታሪፍ ደንቦችም እንደገና ማስያዝ የሚያስከፍል መሆኑን ይወስናሉ።</p>
  id: 8
  title_bn: বোর্ডিং ও গেট বন্ধ
  title_hi: बोर्डिंग और गेट बंद होना
  title_ur: بورڈنگ اور گیٹ بند ہونا
  summary_bn: বোর্ডিং কখন শুরু হয়, এবং গেটে দেরিতে পৌঁছালে কী হয়।
  summary_hi: बोर्डिंग कब शुरू होती है, और गेट पर देर से पहुँचने पर क्या होता है।
  summary_ur: بورڈنگ کب شروع ہوتی ہے، اور گیٹ پر دیر سے پہنچنے پر کیا ہوتا ہے۔
  body_html_bn: <h2>সময়</h2><p>বোর্ডিং প্রস্থানের 40 মিনিট আগে শুরু হয় এবং গেট 20 মিনিট
    আগে বন্ধ হয়। বোর্ডিং পাসের বোর্ডিং ঘরে বোর্ডিংয়ের সময় দেখানো হয়, প্রস্থানের সময় নয়।</p><p>গেট
    বন্ধের সময় উপস্থিত না থাকা যাত্রীদের তাঁদের ব্যাগেজসহ অফলোড করা হয় এবং তাঁদের টিকিটের
    ভাড়ার নিয়ম নির্ধারণ করে পুনঃবুকিং চার্জযোগ্য কি না।</p>
  body_html_hi: <h2>समय</h2><p>बोर्डिंग प्रस्थान से 40 मिनट पहले शुरू होती है और गेट 20 मिनट
    पहले बंद हो जाता है। बोर्डिंग पास अपने बोर्डिंग फ़ील्ड में बोर्डिंग का समय दिखाता है,
    प्रस्थान का समय नहीं।</p><p>गेट बंद होने पर उपस्थित न होने वाले यात्रियों को उनके बैगेज
    सहित उतार दिया जाता है और उनके टिकट के किराया नियम तय करते हैं कि पुनः बुकिंग शुल्क योग्य
    है या नहीं।</p>
  body_html_ur: <h2>اوقات</h2><p>بورڈنگ روانگی سے 40 منٹ پہلے شروع ہوتی ہے اور گیٹ 20 منٹ
    پہلے بند ہو جاتا ہے۔ بورڈنگ پاس اپنے بورڈنگ خانے میں بورڈنگ کا وقت دکھاتا ہے، روانگی کا
    وقت نہیں۔</p><p>گیٹ بند ہونے پر موجود نہ ہونے والے مسافروں کو ان کے سامان سمیت اتار دیا
    جاتا ہے اور ان کے ٹکٹ کے کرایہ قواعد طے کرتے ہیں کہ دوبارہ بکنگ قابلِ چارج ہے یا نہیں۔</p>
- slug: fare-rules-explained
  category: booking-help
  position: 3
  title_en: Understanding fare rules
  title_am: የታሪፍ ደንቦችን መረዳት
  summary_en: What each fare family allows, and where to find the rules for your own ticket.
  summary_am: እያንዳንዱ የታሪፍ ቤተሰብ የሚፈቅደው፣ እና የራስዎን ትኬት ደንቦች የት እንደሚያገኙ።
  body_html_en: <h2>Fare families</h2><p>Promo and Lite fares are neither refundable nor changeable.
    Basic and Group fares may be changed for a fee but are not refundable. Standard is half
    refundable. Flex is fully refundable and changes are free. Highland Class fares are refundable
    in full, with a fee on the Saver family only.</p><p>The fare family of your own ticket
    is shown beside each flight when you open your booking, as a two-letter code such as EF
    or HC.</p>
  body_html_am: <h2>የታሪፍ ቤተሰቦች</h2><p>የፕሮሞና የላይት ታሪፎች ተመላሽም ሆነ የሚቀየሩ አይደሉም። የቤዚክና የግሩፕ ታሪፎች
    በክፍያ ሊቀየሩ ይችላሉ፤ ተመላሽ ግን አይደረጉም። ስታንዳርድ በግማሽ ተመላሽ ይደረጋል። ፍሌክስ ሙሉ በሙሉ ተመላሽ ይደረጋል፤ ለውጦችም
    ነጻ ናቸው። የሃይላንድ ክላስ ታሪፎች ሙሉ በሙሉ ተመላሽ ይደረጋሉ፤ ክፍያም በሴቨር ቤተሰብ ላይ ብቻ ነው።</p><p>የራስዎ ትኬት የታሪፍ
    ቤተሰብ የቦታ ማስያዣዎን ሲከፍቱ እንደ EF ወይም HC ባለ የሁለት ፊደል ኮድ ከእያንዳንዱ በረራ ጎን ይታያል።</p>
  id: 9
  title_bn: ভাড়ার নিয়ম বোঝা
  title_hi: किराया नियमों को समझना
  title_ur: کرایہ قواعد کو سمجھنا
  summary_bn: প্রতিটি ফেয়ার ফ্যামিলি কী অনুমতি দেয়, এবং আপনার নিজের টিকিটের নিয়ম কোথায়
    পাবেন।
  summary_hi: हर फ़ेयर फ़ैमिली क्या अनुमति देती है, और अपने टिकट के नियम कहाँ खोजें।
  summary_ur: ہر فیئر فیملی کس چیز کی اجازت دیتی ہے، اور اپنے ٹکٹ کے قواعد کہاں ملیں گے۔
  body_html_bn: <h2>ফেয়ার ফ্যামিলি</h2><p>প্রোমো ও লাইট ভাড়া রিফান্ডযোগ্যও নয়, পরিবর্তনযোগ্যও
    নয়। বেসিক ও গ্রুপ ভাড়া ফি দিয়ে পরিবর্তন করা যায় কিন্তু রিফান্ডযোগ্য নয়। স্ট্যান্ডার্ড
    অর্ধেক রিফান্ডযোগ্য। ফ্লেক্স সম্পূর্ণ রিফান্ডযোগ্য এবং পরিবর্তন বিনামূল্যে। হাইল্যান্ড
    ক্লাসের ভাড়া সম্পূর্ণ রিফান্ডযোগ্য, শুধু সেভার ফ্যামিলিতে ফি আছে।</p><p>আপনার বুকিং খুললে
    প্রতিটি ফ্লাইটের পাশে আপনার নিজের টিকিটের ফেয়ার ফ্যামিলি EF বা HC-এর মতো দুই অক্ষরের
    কোড হিসেবে দেখানো হয়।</p>
  body_html_hi: <h2>फ़ेयर फ़ैमिली</h2><p>प्रोमो और लाइट किराए न रिफ़ंड योग्य हैं न परिवर्तन
    योग्य। बेसिक और ग्रुप किराए शुल्क देकर बदले जा सकते हैं लेकिन रिफ़ंड योग्य नहीं हैं। स्टैंडर्ड
    आधा रिफ़ंड योग्य है। फ़्लेक्स पूरी तरह रिफ़ंड योग्य है और परिवर्तन निःशुल्क हैं। हाइलैंड
    क्लास के किराए पूरे रिफ़ंड योग्य हैं, केवल सेवर फ़ैमिली पर शुल्क है।</p><p>आपकी बुकिंग
    खोलने पर आपके टिकट की फ़ेयर फ़ैमिली हर उड़ान के बगल में EF या HC जैसे दो-अक्षर के कोड
    के रूप में दिखाई जाती है।</p>
  body_html_ur: <h2>فیئر فیملیز</h2><p>پرومو اور لائٹ کرائے نہ قابلِ ریفنڈ ہیں نہ قابلِ تبدیلی۔
    بیسک اور گروپ کرائے فیس دے کر تبدیل ہو سکتے ہیں لیکن قابلِ ریفنڈ نہیں۔ اسٹینڈرڈ آدھا قابلِ
    ریفنڈ ہے۔ فلیکس مکمل قابلِ ریفنڈ ہے اور تبدیلیاں مفت ہیں۔ ہائی لینڈ کلاس کے کرائے مکمل
    قابلِ ریفنڈ ہیں، صرف سیور فیملی پر فیس ہے۔</p><p>اپنی بکنگ کھولنے پر آپ کے ٹکٹ کی فیئر
    فیملی ہر پرواز کے ساتھ EF یا HC جیسے دو حرفی کوڈ کے طور پر دکھائی جاتی ہے۔</p>
- slug: involuntary-changes
  category: booking-help
  position: 4
  title_en: If we change or cancel your flight
  title_am: በረራዎን ብንቀይር ወይም ብንሰርዝ
  summary_en: Your options when the change is ours rather than yours.
  summary_am: ለውጡ የእኛ እንጂ የእርስዎ ካልሆነ ያሉዎት አማራጮች።
  body_html_en: <h2>Rebooking and refunds</h2><p>Where we cancel a flight or reschedule it
    by more than three hours, you may take the next available flight at no charge, or request
    a full refund regardless of the fare rules of your ticket. This is separate from a voluntary
    change and no change fee or fare difference applies.</p><p>Requests under this policy
    are handled by the contact office for your country, not by the online refund form.</p>
  body_html_am: <h2>እንደገና ማስያዝና ተመላሽ ክፍያ</h2><p>በረራ ስንሰርዝ ወይም ከሦስት ሰዓት በላይ ስናዘገይ፣ ያለክፍያ የሚቀጥለውን
    ያለ በረራ መውሰድ ወይም የትኬትዎ የታሪፍ ደንቦች ምንም ይሁኑ ምን ሙሉ ተመላሽ ክፍያ መጠየቅ ይችላሉ። ይህ ከፈቃደኝነት ለውጥ የተለየ
    ሲሆን ምንም የለውጥ ክፍያ ወይም የታሪፍ ልዩነት አይተገበርም።</p><p>በዚህ ፖሊሲ የሚቀርቡ ጥያቄዎች በመስመር ላይ የተመላሽ ክፍያ ቅጽ
    ሳይሆን በአገርዎ የመገናኛ ቢሮ ይስተናገዳሉ።</p>
  id: 10
  title_bn: আমরা আপনার ফ্লাইট পরিবর্তন বা বাতিল করলে
  title_hi: यदि हम आपकी उड़ान बदलें या रद्द करें
  title_ur: اگر ہم آپ کی پرواز تبدیل یا منسوخ کریں
  summary_bn: পরিবর্তনটি আপনার নয়, আমাদের হলে আপনার বিকল্প।
  summary_hi: जब बदलाव आपका नहीं, हमारा हो तो आपके विकल्प।
  summary_ur: جب تبدیلی آپ کی نہیں بلکہ ہماری ہو تو آپ کے اختیارات۔
  body_html_bn: <h2>পুনঃবুকিং ও রিফান্ড</h2><p>আমরা কোনো ফ্লাইট বাতিল করলে বা তিন ঘণ্টার বেশি
    পুনঃনির্ধারণ করলে, আপনি বিনা খরচে পরবর্তী উপলব্ধ ফ্লাইট নিতে পারেন, বা আপনার টিকিটের ভাড়ার
    নিয়ম নির্বিশেষে সম্পূর্ণ রিফান্ডের অনুরোধ করতে পারেন। এটি স্বেচ্ছা পরিবর্তন থেকে আলাদা
    এবং কোনো পরিবর্তন ফি বা ভাড়ার পার্থক্য প্রযোজ্য নয়।</p><p>এই নীতির অধীনে অনুরোধ আপনার
    দেশের যোগাযোগ অফিস পরিচালনা করে, অনলাইন রিফান্ড ফর্ম নয়।</p>
  body_html_hi: <h2>पुनः बुकिंग और रिफ़ंड</h2><p>जहाँ हम उड़ान रद्द करते हैं या उसे तीन घंटे
    से अधिक पुनर्निर्धारित करते हैं, आप बिना शुल्क अगली उपलब्ध उड़ान ले सकते हैं, या अपने
    टिकट के किराया नियमों की परवाह किए बिना पूर्ण रिफ़ंड का अनुरोध कर सकते हैं। यह स्वैच्छिक
    परिवर्तन से अलग है और कोई परिवर्तन शुल्क या किराया अंतर लागू नहीं होता।</p><p>इस नीति
    के तहत अनुरोध आपके देश के संपर्क कार्यालय द्वारा संभाले जाते हैं, ऑनलाइन रिफ़ंड फ़ॉर्म
    द्वारा नहीं।</p>
  body_html_ur: <h2>دوبارہ بکنگ اور ریفنڈ</h2><p>جہاں ہم پرواز منسوخ کرتے ہیں یا اسے تین گھنٹے
    سے زیادہ آگے پیچھے کرتے ہیں، آپ بلا معاوضہ اگلی دستیاب پرواز لے سکتے ہیں، یا اپنے ٹکٹ
    کے کرایہ قواعد سے قطع نظر مکمل ریفنڈ کی درخواست کر سکتے ہیں۔ یہ رضاکارانہ تبدیلی سے الگ
    ہے اور کوئی تبدیلی فیس یا کرائے کا فرق لاگو نہیں ہوتا۔</p><p>اس پالیسی کے تحت درخواستیں
    آپ کے ملک کا رابطہ دفتر سنبھالتا ہے، آن لائن ریفنڈ فارم نہیں۔</p>
- slug: special-meals
  category: onboard
  position: 1
  title_en: Special meals
  title_am: ልዩ ምግቦች
  summary_en: The meal codes we carry and when they must be ordered.
  summary_am: የምንይዛቸው የምግብ ኮዶችና መቼ መታዘዝ እንዳለባቸው።
  body_html_en: '<h2>Ordering</h2><p>Special meals must be requested at least 24 hours before
    departure through your booking. They cannot be arranged at the airport or on board, and
    a request made inside the cut-off will not be loaded.</p><p>A special meal is prepared
    to a dietary specification. It is not an allergy control: it reduces but does not remove
    the risk of cross-contact, and the cabin itself is not allergen-free.</p><h2>Codes we
    carry</h2><ul><li>VGML vegetarian, VJML Jain vegetarian, AVML Asian vegetarian.</li><li>GFML
    gluten intolerant, LFML low fat, LSML low salt, DBML diabetic.</li><li>HNML Hindu, MOML
    Muslim, KSML kosher, ORML Orthodox fasting.</li><li>CHML child, BBML infant, FPML fruit
    platter.</li></ul>'
  body_html_am: <h2>ማዘዝ</h2><p>ልዩ ምግቦች ከመነሻው ቢያንስ 24 ሰዓት በፊት በቦታ ማስያዣዎ በኩል መጠየቅ አለባቸው። በአየር
    ማረፊያ ወይም በበረራ ላይ ሊዘጋጁ አይችሉም፤ ከመዝጊያው በኋላ የቀረበ ጥያቄም አይጫንም።</p><p>ልዩ ምግብ በአመጋገብ መስፈርት ይዘጋጃል።
    የአለርጂ ቁጥጥር አይደለም፤ የመተላለፍ አደጋን ይቀንሳል እንጂ አያስወግድም፤ ካቢኑም ራሱ አለርጂ-ነጻ አይደለም።</p><h2>የምንይዛቸው
    ኮዶች</h2><ul><li>VGML ቬጀቴሪያን፣ VJML ጃይን ቬጀቴሪያን፣ AVML እስያዊ ቬጀቴሪያን።</li><li>GFML ግሉተን የማይስማማው፣
    LFML ዝቅተኛ ስብ፣ LSML ዝቅተኛ ጨው፣ DBML የስኳር በሽተኛ።</li><li>HNML ሂንዱ፣ MOML ሙስሊም፣ KSML ኮሸር፣ ORML
    የኦርቶዶክስ ጾም።</li><li>CHML የሕፃናት፣ BBML የጨቅላ፣ FPML የፍራፍሬ ሳህን።</li></ul>
  id: 11
  title_bn: বিশেষ খাবার
  title_hi: विशेष भोजन
  title_ur: خصوصی کھانے
  summary_bn: আমরা যে খাবারের কোড বহন করি এবং কখন সেগুলি অর্ডার করতে হবে।
  summary_hi: हम जो भोजन कोड ले जाते हैं और उन्हें कब ऑर्डर करना होगा।
  summary_ur: وہ کھانے کے کوڈ جو ہم لے جاتے ہیں اور انہیں کب آرڈر کرنا ہوگا۔
  body_html_bn: '<h2>অর্ডার করা</h2><p>বিশেষ খাবার প্রস্থানের অন্তত 24 ঘণ্টা আগে আপনার বুকিংয়ের
    মাধ্যমে অনুরোধ করতে হবে। বিমানবন্দরে বা উড়োজাহাজে এর ব্যবস্থা করা যায় না, এবং সময়সীমার
    ভিতরে করা অনুরোধ লোড করা হবে না।</p><p>বিশেষ খাবার একটি খাদ্যবিধি অনুযায়ী তৈরি হয়। এটি
    অ্যালার্জি নিয়ন্ত্রণ নয়: এটি ক্রস-কন্টাক্টের ঝুঁকি কমায় কিন্তু দূর করে না, এবং কেবিন
    নিজেই অ্যালার্জেনমুক্ত নয়।</p><h2>আমরা যে কোড বহন করি</h2><ul><li>VGML নিরামিষ, VJML
    জৈন নিরামিষ, AVML এশীয় নিরামিষ।</li><li>GFML গ্লুটেন অসহিষ্ণু, LFML কম চর্বি, LSML কম
    লবণ, DBML ডায়াবেটিক।</li><li>HNML হিন্দু, MOML মুসলিম, KSML কোশার, ORML অর্থোডক্স উপবাস।</li><li>CHML
    শিশু, BBML নবজাতক, FPML ফলের থালা।</li></ul>'
  body_html_hi: '<h2>ऑर्डर करना</h2><p>विशेष भोजन का अनुरोध प्रस्थान से कम से कम 24 घंटे पहले
    आपकी बुकिंग के माध्यम से करना होगा। हवाई अड्डे पर या विमान में इनकी व्यवस्था नहीं की जा
    सकती, और समय-सीमा के भीतर किया गया अनुरोध लोड नहीं होगा।</p><p>विशेष भोजन आहार विनिर्देश
    के अनुसार तैयार किया जाता है। यह एलर्जी नियंत्रण नहीं है: यह क्रॉस-कॉन्टैक्ट का जोखिम
    कम करता है पर हटाता नहीं, और केबिन स्वयं एलर्जेन-मुक्त नहीं है।</p><h2>हम जो कोड ले जाते
    हैं</h2><ul><li>VGML शाकाहारी, VJML जैन शाकाहारी, AVML एशियाई शाकाहारी।</li><li>GFML ग्लूटेन
    असहिष्णु, LFML कम वसा, LSML कम नमक, DBML मधुमेह।</li><li>HNML हिंदू, MOML मुस्लिम, KSML
    कोषेर, ORML ऑर्थोडॉक्स उपवास।</li><li>CHML बच्चा, BBML शिशु, FPML फल की थाली।</li></ul>'
  body_html_ur: '<h2>آرڈر کرنا</h2><p>خصوصی کھانوں کی درخواست روانگی سے کم از کم 24 گھنٹے
    پہلے آپ کی بکنگ کے ذریعے کرنی ہوگی۔ ہوائی اڈے پر یا طیارے میں ان کا انتظام نہیں ہو سکتا،
    اور مقررہ وقت کے اندر کی گئی درخواست لوڈ نہیں ہوگی۔</p><p>خصوصی کھانا غذائی ہدایت کے مطابق
    تیار کیا جاتا ہے۔ یہ الرجی کنٹرول نہیں ہے: یہ کراس کانٹیکٹ کا خطرہ کم کرتا ہے مگر ختم
    نہیں کرتا، اور کیبن خود الرجن سے پاک نہیں ہے۔</p><h2>وہ کوڈ جو ہم لے جاتے ہیں</h2><ul><li>VGML
    سبزی خور، VJML جین سبزی خور، AVML ایشیائی سبزی خور۔</li><li>GFML گلوٹن عدم برداشت، LFML
    کم چکنائی، LSML کم نمک، DBML ذیابیطس۔</li><li>HNML ہندو، MOML مسلم، KSML کوشر، ORML آرتھوڈوکس
    روزہ۔</li><li>CHML بچہ، BBML شیرخوار، FPML پھلوں کی پلیٹ۔</li></ul>'
- slug: medical-conditions
