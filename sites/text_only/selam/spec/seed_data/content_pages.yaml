  title_en: Passports and travel documents
  title_am: ፓስፖርቶችና የጉዞ ሰነዶች
  summary_en: Validity rules and the checks we make at the airport.
  summary_am: የጊዜ ገደብ ደንቦችና በአየር ማረፊያ የምናደርጋቸው ፍተሻዎች።
  body_html_en: <h2>Validity</h2><p>Most destinations require a passport valid for at least
    six months beyond your date of arrival, with at least two blank pages. It is the passenger&#x27;s
    responsibility to hold the correct documents; we are required to refuse carriage where
    they are not in order.</p>
  body_html_am: <h2>የጊዜ ገደብ</h2><p>አብዛኞቹ መዳረሻዎች ከመድረሻ ቀንዎ ቢያንስ ለስድስት ወራት የሚሠራ ፓስፖርት ይጠይቃሉ፤
    ቢያንስ ሁለት ባዶ ገጾችም ሊኖሩት ይገባል። ትክክለኛ ሰነዶችን መያዝ የተሳፋሪው ኃላፊነት ነው፤ በሥርዓት ካልሆኑም ጉዞን እንድንከለክል
    እንገደዳለን።</p>
  id: 19
  title_bn: পাসপোর্ট ও ভ্রমণ নথি
  title_hi: पासपोर्ट और यात्रा दस्तावेज़
  title_ur: پاسپورٹ اور سفری دستاویزات
  summary_bn: বৈধতার নিয়ম এবং বিমানবন্দরে আমরা যে যাচাই করি।
  summary_hi: वैधता नियम और हवाई अड्डे पर हमारी जाँच।
  summary_ur: میعاد کے قواعد اور ہوائی اڈے پر ہماری جانچ۔
  body_html_bn: <h2>বৈধতা</h2><p>বেশিরভাগ গন্তব্যে আগমনের তারিখের পর অন্তত ছয় মাস বৈধ পাসপোর্ট
    প্রয়োজন, অন্তত দুটি খালি পৃষ্ঠাসহ। সঠিক নথি রাখা যাত্রীর দায়িত্ব; নথি ঠিক না থাকলে আমরা
    বহন প্রত্যাখ্যান করতে বাধ্য।</p>
  body_html_hi: <h2>वैधता</h2><p>अधिकांश गंतव्यों के लिए आगमन की तिथि के बाद कम से कम छह महीने
    तक वैध पासपोर्ट चाहिए, कम से कम दो खाली पृष्ठों के साथ। सही दस्तावेज़ रखना यात्री की ज़िम्मेदारी
    है; दस्तावेज़ ठीक न होने पर हमें यात्रा से इनकार करना अनिवार्य है।</p>
  body_html_ur: <h2>میعاد</h2><p>زیادہ تر منزلوں کے لیے آمد کی تاریخ کے بعد کم از کم چھ ماہ
    تک کارآمد پاسپورٹ درکار ہے، کم از کم دو خالی صفحات کے ساتھ۔ درست دستاویزات رکھنا مسافر
    کی ذمہ داری ہے؛ دستاویزات درست نہ ہونے پر ہمیں سفر سے انکار کرنا لازم ہے۔</p>
