  title_en: Flights operated by a partner
  title_am: በአጋር የሚከናወኑ በረራዎች
  summary_en: What changes when the aircraft is not ours.
  summary_am: አውሮፕላኑ የእኛ ካልሆነ የሚለወጠው።
  body_html_en: <h2>Reading the flight number</h2><p>A flight sold under our number but flown
    by another airline is marked &#x27;operated by&#x27; on the results page, on your itinerary
    and on the flight status page. The number you quote at the airport is the operating airline&#x27;s,
    not ours.</p><h2>What follows the operating airline</h2><ul><li>Baggage allowance, cabin
    service and seat pitch.</li><li>Online check-in, which must be done on their website,
    not ours.</li><li>Seat selection, which we cannot make on your behalf.</li></ul><h2>What
    stays with us</h2><p>The fare rules, the refund, the change fee, and the miles you earn.
    Those follow the ticket, not the aircraft.</p>
  body_html_am: <h2>የበረራ ቁጥሩን ማንበብ</h2><p>በእኛ ቁጥር ተሸጦ በሌላ አየር መንገድ የሚበረር በረራ በውጤቶች ገጽ፣ በጉዞ
    ዝርዝርዎና በበረራ ሁኔታ ገጽ ላይ ‘የሚከናወነው በ’ ተብሎ ይመዘገባል። በአየር ማረፊያ የሚጠቅሱት ቁጥር የእኛ ሳይሆን የአስኪያጁ አየር
    መንገድ ነው።</p><h2>የአስኪያጁን አየር መንገድ የሚከተለው</h2><ul><li>የሻንጣ ፈቃድ፣ የካቢን አገልግሎትና የመቀመጫ ርቀት።</li><li>የመስመር
    ላይ ቼክ-ኢን፤ በእነሱ ድረ ገጽ እንጂ በእኛ መደረግ የለበትም።</li><li>የመቀመጫ ምርጫ፤ በእርስዎ ወክለን ልናደርገው አንችልም።</li></ul><h2>ከእኛ
    ጋር የሚቀረው</h2><p>የታሪፍ ደንቦች፣ ተመላሽ ክፍያው፣ የለውጥ ክፍያውና የሚያገኙት ማይል። እነዚያ ትኬቱን እንጂ አውሮፕላኑን አይከተሉም።</p>
  id: 35
  title_bn: পার্টনার-পরিচালিত ফ্লাইট
  title_hi: पार्टनर द्वारा संचालित उड़ानें
  title_ur: پارٹنر کی چلائی گئی پروازیں
  summary_bn: উড়োজাহাজ আমাদের না হলে কী বদলায়।
  summary_hi: जब विमान हमारा न हो तो क्या बदलता है।
  summary_ur: جب طیارہ ہمارا نہ ہو تو کیا بدلتا ہے۔
  body_html_bn: <h2>ফ্লাইট নম্বর পড়া</h2><p>আমাদের নম্বরে বিক্রি হওয়া কিন্তু অন্য এয়ারলাইনের
    উড়ানো ফ্লাইট ফলাফল পৃষ্ঠায়, আপনার ভ্রমণসূচিতে এবং ফ্লাইট স্ট্যাটাস পৃষ্ঠায় &#x27;পরিচালনায়&#x27;
    চিহ্নিত থাকে। বিমানবন্দরে আপনি যে নম্বর বলবেন তা পরিচালনাকারী এয়ারলাইনের, আমাদের নয়।</p><h2>যা
    পরিচালনাকারী এয়ারলাইনকে অনুসরণ করে</h2><ul><li>ব্যাগেজ অ্যালাউন্স, কেবিন পরিষেবা ও সিট
    পিচ।</li><li>অনলাইন চেক-ইন, যা তাদের ওয়েবসাইটে করতে হবে, আমাদের নয়।</li><li>আসন নির্বাচন,
    যা আমরা আপনার পক্ষে করতে পারি না।</li></ul><h2>যা আমাদের কাছেই থাকে</h2><p>ভাড়ার নিয়ম,
    রিফান্ড, পরিবর্তন ফি, এবং আপনি যে মাইল অর্জন করেন। এগুলি টিকিটকে অনুসরণ করে, উড়োজাহাজকে
    নয়।</p>
  body_html_hi: <h2>उड़ान संख्या पढ़ना</h2><p>हमारी संख्या के तहत बेची गई लेकिन दूसरी एयरलाइन
    द्वारा उड़ाई गई उड़ान परिणाम पृष्ठ, आपकी यात्रा-योजना और फ़्लाइट स्टेटस पृष्ठ पर &#x27;द्वारा
    संचालित&#x27; के रूप में चिह्नित होती है। हवाई अड्डे पर आप जो संख्या बताते हैं वह संचालन
    करने वाली एयरलाइन की है, हमारी नहीं।</p><h2>जो संचालन करने वाली एयरलाइन का अनुसरण करता
    है</h2><ul><li>बैगेज अलाउंस, केबिन सेवा और सीट पिच।</li><li>ऑनलाइन चेक-इन, जो उनकी वेबसाइट
    पर करना होगा, हमारी पर नहीं।</li><li>सीट चयन, जो हम आपकी ओर से नहीं कर सकते।</li></ul><h2>जो
    हमारे पास रहता है</h2><p>किराया नियम, रिफ़ंड, परिवर्तन शुल्क, और आपके अर्जित मील। ये टिकट
    का अनुसरण करते हैं, विमान का नहीं।</p>
  body_html_ur: <h2>پرواز نمبر پڑھنا</h2><p>ہمارے نمبر کے تحت بیچی گئی لیکن دوسری ایئرلائن
    کی اڑائی گئی پرواز نتائج کے صفحے، آپ کے سفری منصوبے اور فلائٹ اسٹیٹس صفحے پر &#x27;زیرِ
    انتظام&#x27; کے طور پر نشان زد ہوتی ہے۔ ہوائی اڈے پر آپ جو نمبر بتاتے ہیں وہ چلانے والی
    ایئرلائن کا ہے، ہمارا نہیں۔</p><h2>جو چلانے والی ایئرلائن کی پیروی کرتا ہے</h2><ul><li>سامان
    کا الاؤنس، کیبن سروس اور سیٹ پچ۔</li><li>آن لائن چیک اِن، جو ان کی ویب سائٹ پر کرنا ہوگا،
    ہماری پر نہیں۔</li><li>سیٹ کا انتخاب، جو ہم آپ کی جانب سے نہیں کر سکتے۔</li></ul><h2>جو
    ہمارے پاس رہتا ہے</h2><p>کرایہ قواعد، ریفنڈ، تبدیلی فیس، اور آپ کے حاصل کردہ میلز۔ یہ
    ٹکٹ کی پیروی کرتے ہیں، طیارے کی نہیں۔</p>
- slug: checked-baggage-basics
  category: baggage
  position: 10
  title_en: Checked baggage, in principle
  title_am: የተመዘገበ ሻንጣ፣ በመርህ ደረጃ
  summary_en: How allowances are structured. For your own route, use the allowance calculator.
  summary_am: ፈቃዶች እንዴት እንደተዋቀሩ። ለራስዎ መስመር የፈቃድ ማስያ ይጠቀሙ።
  body_html_en: '<h2>Pieces or weight</h2><p>Two systems are in use and the route decides
    which. On a piece system you get a number of bags, each under a weight cap. On a weight
    system you get a total, and one bag may be heavier as long as the total holds. Mixing
    the two -- three bags on a weight route, say -- is what most excess charges come from.</p><h2>What
    shifts the allowance</h2><ul><li>Cabin: Highland Class carries more than economy on every
    route.</li><li>Tier: silver and above add a piece or a weight bracket.</li><li>Passenger
    type: infants have their own small allowance plus a pushchair.</li></ul><h2>This page
    does not give your number</h2><p>Allowances differ by route region, cabin and passenger
    type, so no figure printed here would be right for every reader. The allowance calculator
    asks for those three and returns the exact allowance for your journey.</p>'
  body_html_am: <h2>ዕቃ ወይም ክብደት</h2><p>ሁለት ሥርዓቶች በሥራ ላይ ናቸው፤ የትኛው እንደሚሠራም መስመሩ ይወስናል። በዕቃ
    ሥርዓት እያንዳንዳቸው ከክብደት ጣሪያ በታች የሆኑ የተወሰኑ ሻንጣዎች ያገኛሉ። በክብደት ሥርዓት ጠቅላላ መጠን ያገኛሉ፤ ጠቅላላው እስከጠበቀ
    ድረስ አንድ ሻንጣ ሊከብድ ይችላል። ሁለቱን መቀላቀል -- ለምሳሌ በክብደት መስመር ላይ ሦስት ሻንጣ -- አብዛኞቹ የትርፍ ክፍያዎች የሚመጡበት
    ነው።</p><h2>ፈቃዱን የሚያንቀሳቅሰው</h2><ul><li>የጉዞ ክፍል፦ ሃይላንድ ክላስ በእያንዳንዱ መስመር ከኢኮኖሚ የበለጠ ይይዛል።</li><li>ደረጃ፦
    ሲልቨርና ከዚያ በላይ አንድ ዕቃ ወይም የክብደት ደረጃ ይጨምራሉ።</li><li>የተሳፋሪ ዓይነት፦ ጨቅላዎች የራሳቸው አነስተኛ ፈቃድ እንዲሁም
    የሕፃን ጋሪ አላቸው።</li></ul><h2>ይህ ገጽ ቁጥርዎን አይሰጥም</h2><p>ፈቃዶች በመስመር ክልል፣ በጉዞ ክፍልና በተሳፋሪ ዓይነት
    ይለያያሉ፤ ስለዚህ እዚህ የታተመ ማንኛውም አኀዝ ለእያንዳንዱ አንባቢ ትክክል አይሆንም። የፈቃድ ማስያው እነዚያን ሦስቱን ጠይቆ ለጉዞዎ
    ትክክለኛውን ፈቃድ ይመልሳል።</p>
  id: 36
  title_bn: চেকড ব্যাগেজ, মূলনীতি
  title_hi: चेक्ड बैगेज, सिद्धांत रूप में
  title_ur: چیکڈ سامان، اصولی طور پر
  summary_bn: অ্যালাউন্স কীভাবে গঠিত। আপনার নিজের রুটের জন্য অ্যালাউন্স ক্যালকুলেটর ব্যবহার
    করুন।
  summary_hi: अलाउंस कैसे बनते हैं। अपने मार्ग के लिए अलाउंस कैलकुलेटर का उपयोग करें।
  summary_ur: الاؤنس کیسے ترتیب دیے جاتے ہیں۔ اپنے روٹ کے لیے الاؤنس کیلکولیٹر استعمال کریں۔
  body_html_bn: '<h2>পিস না ওজন</h2><p>দুটি ব্যবস্থা চালু আছে এবং রুট ঠিক করে কোনটি। পিস ব্যবস্থায়
    আপনি নির্দিষ্ট সংখ্যক ব্যাগ পান, প্রতিটি একটি ওজনসীমার নিচে। ওজন ব্যবস্থায় আপনি একটি
    মোট পান, এবং মোট ঠিক থাকলে একটি ব্যাগ ভারী হতে পারে। দুটি মেশানো -- যেমন ওজন রুটে তিনটি
    ব্যাগ -- বেশিরভাগ অতিরিক্ত চার্জের উৎস।</p><h2>যা অ্যালাউন্স বদলায়</h2><ul><li>কেবিন:
    হাইল্যান্ড ক্লাস প্রতিটি রুটে ইকোনমির চেয়ে বেশি বহন করে।</li><li>টিয়ার: সিলভার ও তার
    উপরে একটি পিস বা একটি ওজন ব্র্যাকেট যোগ হয়।</li><li>যাত্রীর ধরন: নবজাতকদের নিজস্ব ছোট
    অ্যালাউন্স ও একটি পুশচেয়ার থাকে।</li></ul><h2>এই পৃষ্ঠা আপনার সংখ্যা দেয় না</h2><p>অ্যালাউন্স
    রুট অঞ্চল, কেবিন ও যাত্রীর ধরন অনুযায়ী আলাদা, তাই এখানে ছাপা কোনো সংখ্যা সব পাঠকের জন্য
    সঠিক হবে না। অ্যালাউন্স ক্যালকুলেটর এই তিনটি জিজ্ঞাসা করে এবং আপনার যাত্রার সঠিক অ্যালাউন্স
    দেয়।</p>'
  body_html_hi: '<h2>पीस या वज़न</h2><p>दो प्रणालियाँ प्रचलन में हैं और मार्ग तय करता है कि
    कौन सी। पीस प्रणाली में आपको बैगों की संख्या मिलती है, हर एक वज़न सीमा के नीचे। वज़न प्रणाली
    में आपको एक कुल मिलता है, और जब तक कुल ठीक रहे एक बैग भारी हो सकता है। दोनों को मिलाना
    -- मान लें, वज़न वाले मार्ग पर तीन बैग -- अधिकांश अतिरिक्त शुल्क का कारण है।</p><h2>अलाउंस
    को क्या बदलता है</h2><ul><li>केबिन: हाइलैंड क्लास हर मार्ग पर इकोनॉमी से अधिक ले जाता
    है।</li><li>टियर: सिल्वर और उससे ऊपर एक पीस या एक वज़न ब्रैकेट जोड़ते हैं।</li><li>यात्री
    प्रकार: शिशुओं का अपना छोटा अलाउंस और एक पुशचेयर होती है।</li></ul><h2>यह पृष्ठ आपका आँकड़ा
    नहीं देता</h2><p>अलाउंस मार्ग क्षेत्र, केबिन और यात्री प्रकार के अनुसार भिन्न हैं, इसलिए
    यहाँ छपा कोई भी आँकड़ा हर पाठक के लिए सही नहीं होगा। अलाउंस कैलकुलेटर इन तीनों को पूछता
    है और आपकी यात्रा का सटीक अलाउंस देता है।</p>'
  body_html_ur: '<h2>پیس یا وزن</h2><p>دو نظام رائج ہیں اور روٹ طے کرتا ہے کہ کون سا۔ پیس
    نظام میں آپ کو بیگوں کی تعداد ملتی ہے، ہر ایک وزن کی حد سے کم۔ وزن کے نظام میں آپ کو ایک
    کل ملتا ہے، اور جب تک کل برقرار رہے ایک بیگ بھاری ہو سکتا ہے۔ دونوں کو ملانا -- مثلاً
    وزن والے روٹ پر تین بیگ -- زیادہ تر اضافی چارجز کی وجہ ہے۔</p><h2>الاؤنس کو کیا بدلتا
    ہے</h2><ul><li>کیبن: ہائی لینڈ کلاس ہر روٹ پر اکانومی سے زیادہ لے جاتا ہے۔</li><li>ٹیئر:
    سلور اور اس سے اوپر ایک پیس یا ایک وزن کا بریکٹ شامل کرتے ہیں۔</li><li>مسافر کی قسم: شیرخواروں
    کا اپنا چھوٹا الاؤنس اور ایک پش چیئر ہوتی ہے۔</li></ul><h2>یہ صفحہ آپ کا عدد نہیں دیتا</h2><p>الاؤنس
    روٹ کے علاقے، کیبن اور مسافر کی قسم کے مطابق مختلف ہیں، اس لیے یہاں چھپا کوئی عدد ہر قاری
    کے لیے درست نہیں ہوگا۔ الاؤنس کیلکولیٹر ان تینوں کے بارے میں پوچھتا ہے اور آپ کے سفر کا
    درست الاؤنس دیتا ہے۔</p>'
- slug: excess-baggage-charges
  category: baggage
  position: 11
  title_en: How excess is charged
  title_am: ትርፍ እንዴት እንደሚከፈል
  summary_en: The order the charges are applied in, and where each is cheaper.
  summary_am: ክፍያዎቹ የሚተገበሩበት ቅደም ተከተል፣ እና እያንዳንዱ የሚረክስበት ቦታ።
  body_html_en: <h2>Three separate charges</h2><ul><li>Extra weight, charged per kilogram
    over your allowance.</li><li>An extra piece, charged as a flat fee per bag beyond your
    piece count.</li><li>An outsize or special item, charged at its own fixed fee, which replaces
    the per-kilogram rate rather than adding to it.</li></ul><h2>Prepaying is cheaper</h2><p>Weight
    bought online before departure costs less per kilogram than weight paid at the bag drop,
    and a prepaid bundle costs less per kilogram than buying kilos one at a time. The airport
    rate is the highest of the three and is not negotiable.</p>
  body_html_am: <h2>ሦስት የተለያዩ ክፍያዎች</h2><ul><li>ተጨማሪ ክብደት፤ ከፈቃድዎ በላይ በኪሎግራም ይከፈላል።</li><li>ተጨማሪ
    ዕቃ፤ ከዕቃ ብዛትዎ በላይ በአንድ ሻንጣ ቋሚ ክፍያ ይከፈላል።</li><li>ከመጠን ያለፈ ወይም ልዩ ዕቃ፤ በራሱ ቋሚ ክፍያ ይከፈላል፤
    ይህም በኪሎግራም ተመኑ ላይ ከመጨመር ይልቅ ይተካዋል።</li></ul><h2>አስቀድሞ መክፈል ይረክሳል</h2><p>ከመነሻው በፊት በመስመር
    ላይ የተገዛ ክብደት በሻንጣ ማስረከቢያ ከሚከፈለው በኪሎግራም ያንሳል፤ አስቀድሞ የተከፈለ ጥቅልም ኪሎዎችን አንድ በአንድ ከመግዛት በኪሎግራም
    ያንሳል። የአየር ማረፊያው ተመን ከሦስቱ ከፍተኛው ነው፤ አይደራደርም።</p>
  id: 37
  title_bn: অতিরিক্ত ব্যাগেজ কীভাবে চার্জ হয়
  title_hi: अतिरिक्त बैगेज का शुल्क कैसे लगता है
  title_ur: اضافی سامان کا چارج کیسے لگتا ہے
  summary_bn: চার্জ প্রয়োগের ক্রম, এবং কোথায় কোনটি সস্তা।
  summary_hi: शुल्क लागू होने का क्रम, और कहाँ प्रत्येक सस्ता है।
  summary_ur: چارجز لاگو ہونے کی ترتیب، اور کہاں ہر ایک سستا ہے۔
  body_html_bn: <h2>তিনটি আলাদা চার্জ</h2><ul><li>অতিরিক্ত ওজন, আপনার অ্যালাউন্সের উপরে প্রতি
    কিলোগ্রামে চার্জ।</li><li>অতিরিক্ত পিস, আপনার পিস সংখ্যার বাইরে প্রতি ব্যাগে নির্দিষ্ট
    ফি।</li><li>বড় আকারের বা বিশেষ জিনিস, নিজস্ব নির্দিষ্ট ফি-তে, যা প্রতি-কিলোগ্রাম হারের
    সঙ্গে যোগ না হয়ে তার জায়গা নেয়।</li></ul><h2>আগাম পরিশোধ সস্তা</h2><p>প্রস্থানের আগে
    অনলাইনে কেনা ওজন ব্যাগ ড্রপে পরিশোধ করা ওজনের চেয়ে প্রতি কিলোগ্রামে কম খরচ হয়, এবং প্রিপেইড
    বান্ডেল এক এক করে কিলো কেনার চেয়ে প্রতি কিলোগ্রামে কম খরচ হয়। বিমানবন্দরের হার তিনটির
    মধ্যে সর্বোচ্চ এবং দরকষাকষিযোগ্য নয়।</p>
  body_html_hi: <h2>तीन अलग शुल्क</h2><ul><li>अतिरिक्त वज़न, आपके अलाउंस से ऊपर प्रति किलोग्राम
    शुल्क।</li><li>अतिरिक्त पीस, आपकी पीस संख्या से आगे प्रति बैग निश्चित शुल्क।</li><li>बड़े
    आकार की या विशेष वस्तु, अपने निश्चित शुल्क पर, जो प्रति-किलोग्राम दर में जुड़ने के बजाय
    उसकी जगह लेता है।</li></ul><h2>पहले से भुगतान सस्ता है</h2><p>प्रस्थान से पहले ऑनलाइन
    खरीदा गया वज़न बैग ड्रॉप पर चुकाए गए वज़न से प्रति किलोग्राम कम पड़ता है, और प्रीपेड बंडल
    एक-एक किलो खरीदने से प्रति किलोग्राम कम पड़ता है। हवाई अड्डे की दर तीनों में सबसे अधिक
    है और मोलभाव योग्य नहीं है।</p>
  body_html_ur: <h2>تین علیحدہ چارجز</h2><ul><li>اضافی وزن، آپ کے الاؤنس سے اوپر فی کلوگرام
    چارج۔</li><li>اضافی پیس، آپ کی پیس تعداد سے آگے فی بیگ مقررہ فیس۔</li><li>بڑے سائز کی
    یا خصوصی چیز، اپنی مقررہ فیس پر، جو فی کلوگرام شرح میں شامل ہونے کے بجائے اس کی جگہ لیتی
    ہے۔</li></ul><h2>پیشگی ادائیگی سستی ہے</h2><p>روانگی سے پہلے آن لائن خریدا گیا وزن بیگ
    ڈراپ پر ادا کیے گئے وزن سے فی کلوگرام کم پڑتا ہے، اور پری پیڈ بنڈل ایک ایک کلو خریدنے
    سے فی کلوگرام کم پڑتا ہے۔ ہوائی اڈے کی شرح تینوں میں سب سے زیادہ ہے اور قابلِ مول تول
    نہیں۔</p>
