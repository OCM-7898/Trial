  position: 10
  title_en: Changing a booking
  title_am: የቦታ ማስያዣን መቀየር
  summary_en: What can be changed, what it costs, and what cannot be changed at all.
  summary_am: ሊቀየር የሚችለው፣ የሚያስከፍለው፣ እንዲሁም በፍጹም ሊቀየር የማይችለው።
  body_html_en: '<h2>What a change covers</h2><p>A change moves you to a different date, a
    different flight on the same route, or a different route. It never changes who is travelling:
    a new passenger needs a new booking, whatever the fare.</p><h2>What it costs</h2><p>Two
    amounts are involved and they are separate. The change fee is set by your fare class and
    is waived on some fares. The fare difference is the gap between what you paid and the
    price of the new flight on the day you change it, and no fare waives it.</p><p>If the
    new flight is cheaper, the difference is not refunded. It stays as a credit against a
    further change on the same booking.</p><h2>What cannot be changed</h2><ul><li>A flight
    that has already departed. Once a segment is flown or missed, the rest of the booking
    follows the no-show rules instead.</li><li>An award ticket within 72 hours of departure.</li><li>A
    booking made through a travel agent, which the agent must change.</li></ul>'
  body_html_am: <h2>ለውጥ የሚሸፍነው</h2><p>ለውጥ ወደ ሌላ ቀን፣ በተመሳሳይ መስመር ወደ ሌላ በረራ፣ ወይም ወደ ሌላ መስመር
    ያዛውርዎታል። የሚጓዘውን ሰው ግን በጭራሽ አይለውጥም፤ አዲስ ተሳፋሪ ታሪፉ ምንም ይሁን ምን አዲስ የቦታ ማስያዣ ያስፈልገዋል።</p><h2>የሚያስከፍለው</h2><p>ሁለት
    መጠኖች ይሳተፋሉ፤ እነሱም የተለያዩ ናቸው። የለውጥ ክፍያ በጉዞ ክፍልዎ ይወሰናል፤ በአንዳንድ ታሪፎችም ይነሳል። የታሪፍ ልዩነት ግን በከፈሉትና
    በሚቀይሩበት ቀን ባለው የአዲሱ በረራ ዋጋ መካከል ያለው ልዩነት ነው፤ ማንኛውም ታሪፍ ይህን አያነሳም።</p><p>አዲሱ በረራ ርካሽ ከሆነ
    ልዩነቱ ተመላሽ አይደረግም። በተመሳሳይ የቦታ ማስያዣ ላይ ለሚደረግ ሌላ ለውጥ እንደ ክሬዲት ይቆያል።</p><h2>ሊቀየር የማይችለው</h2><ul><li>አስቀድሞ
    የተነሳ በረራ። አንድ ክፍል ከተበረረ ወይም ካመለጠ በኋላ የቀረው የቦታ ማስያዣ የአለመቅረብ ደንቦችን ይከተላል።</li><li>ከመነሻው
    በ72 ሰዓት ውስጥ ያለ የሽልማት ትኬት።</li><li>በጉዞ ወኪል የተያዘ የቦታ ማስያዣ፤ ወኪሉ መቀየር አለበት።</li></ul>
  id: 27
  title_bn: বুকিং পরিবর্তন
  title_hi: बुकिंग बदलना
  title_ur: بکنگ تبدیل کرنا
  summary_bn: কী পরিবর্তন করা যায়, কত খরচ, এবং কী একেবারেই পরিবর্তন করা যায় না।
  summary_hi: क्या बदला जा सकता है, इसकी लागत क्या है, और क्या बिल्कुल नहीं बदला जा सकता।
  summary_ur: کیا تبدیل ہو سکتا ہے، اس کی لاگت کیا ہے، اور کیا بالکل تبدیل نہیں ہو سکتا۔
  body_html_bn: '<h2>পরিবর্তন কী কভার করে</h2><p>পরিবর্তন আপনাকে ভিন্ন তারিখে, একই রুটের ভিন্ন
    ফ্লাইটে, বা ভিন্ন রুটে নিয়ে যায়। এটি কখনও ভ্রমণকারী কে তা বদলায় না: নতুন যাত্রীর জন্য
    নতুন বুকিং প্রয়োজন, ভাড়া যাই হোক।</p><h2>খরচ কত</h2><p>দুটি অঙ্ক জড়িত এবং সেগুলি আলাদা।
    পরিবর্তন ফি আপনার ফেয়ার ক্লাস দ্বারা নির্ধারিত এবং কিছু ভাড়ায় মওকুফ। ভাড়ার পার্থক্য
    হল আপনি যা দিয়েছেন এবং পরিবর্তনের দিনে নতুন ফ্লাইটের মূল্যের মধ্যের ব্যবধান, এবং কোনো
    ভাড়া এটি মওকুফ করে না।</p><p>নতুন ফ্লাইট সস্তা হলে পার্থক্য ফেরত দেওয়া হয় না। এটি একই
    বুকিংয়ে পরবর্তী পরিবর্তনের বিপরীতে ক্রেডিট হিসেবে থাকে।</p><h2>যা পরিবর্তন করা যায় না</h2><ul><li>ইতিমধ্যে
    ছেড়ে যাওয়া ফ্লাইট। কোনো সেগমেন্ট উড়ে গেলে বা মিস হলে বুকিংয়ের বাকি অংশ নো-শো নিয়ম
    অনুসরণ করে।</li><li>প্রস্থানের 72 ঘণ্টার মধ্যে থাকা অ্যাওয়ার্ড টিকিট।</li><li>ট্রাভেল
    এজেন্টের মাধ্যমে করা বুকিং, যা এজেন্টকে পরিবর্তন করতে হবে।</li></ul>'
  body_html_hi: '<h2>परिवर्तन में क्या शामिल है</h2><p>परिवर्तन आपको किसी अन्य तिथि, उसी मार्ग
    की किसी अन्य उड़ान, या किसी अन्य मार्ग पर ले जाता है। यह कभी नहीं बदलता कि कौन यात्रा
    कर रहा है: नए यात्री के लिए नई बुकिंग चाहिए, किराया चाहे जो हो।</p><h2>इसकी लागत क्या
    है</h2><p>दो राशियाँ शामिल हैं और वे अलग हैं। परिवर्तन शुल्क आपकी फ़ेयर क्लास द्वारा तय
    होता है और कुछ किरायों पर माफ़ है। किराया अंतर आपके द्वारा भुगतान की गई राशि और परिवर्तन
    के दिन नई उड़ान की कीमत के बीच का फ़ासला है, और कोई किराया इसे माफ़ नहीं करता।</p><p>यदि
    नई उड़ान सस्ती है, तो अंतर रिफ़ंड नहीं होता। यह उसी बुकिंग पर अगले परिवर्तन के लिए क्रेडिट
    के रूप में रहता है।</p><h2>क्या नहीं बदला जा सकता</h2><ul><li>पहले ही रवाना हो चुकी उड़ान।
    एक बार कोई खंड उड़ लिया या छूट गया, तो बाकी बुकिंग नो-शो नियमों का पालन करती है।</li><li>प्रस्थान
    के 72 घंटों के भीतर का अवार्ड टिकट।</li><li>ट्रैवल एजेंट के ज़रिए की गई बुकिंग, जिसे एजेंट
    को बदलना होगा।</li></ul>'
  body_html_ur: '<h2>تبدیلی میں کیا شامل ہے</h2><p>تبدیلی آپ کو کسی اور تاریخ، اسی روٹ کی
    کسی اور پرواز، یا کسی اور روٹ پر لے جاتی ہے۔ یہ کبھی نہیں بدلتی کہ کون سفر کر رہا ہے:
    نئے مسافر کے لیے نئی بکنگ درکار ہے، کرایہ چاہے جو ہو۔</p><h2>اس کی لاگت کیا ہے</h2><p>دو
    رقمیں شامل ہیں اور وہ الگ ہیں۔ تبدیلی فیس آپ کی فیئر کلاس سے طے ہوتی ہے اور کچھ کرایوں
    پر معاف ہے۔ کرائے کا فرق آپ کی ادا کردہ رقم اور تبدیلی کے دن نئی پرواز کی قیمت کے درمیان
    کا فاصلہ ہے، اور کوئی کرایہ اسے معاف نہیں کرتا۔</p><p>اگر نئی پرواز سستی ہے تو فرق ریفنڈ
    نہیں ہوتا۔ یہ اسی بکنگ پر اگلی تبدیلی کے لیے کریڈٹ کے طور پر رہتا ہے۔</p><h2>کیا تبدیل
    نہیں ہو سکتا</h2><ul><li>پہلے ہی روانہ ہو چکی پرواز۔ ایک بار کوئی حصہ طے یا چھوٹ جائے
    تو باقی بکنگ نو شو قواعد کی پیروی کرتی ہے۔</li><li>روانگی کے 72 گھنٹوں کے اندر کا ایوارڈ
    ٹکٹ۔</li><li>ٹریول ایجنٹ کے ذریعے کی گئی بکنگ، جسے ایجنٹ کو تبدیل کرنا ہوگا۔</li></ul>'
- slug: cancelling-and-refunds
  category: booking-help
  position: 11
  title_en: Cancelling, and what comes back
  title_am: መሰረዝና የሚመለሰው
  summary_en: Cancelling and refunding are two decisions, not one.
  summary_am: መሰረዝና ተመላሽ ማድረግ ሁለት ውሳኔዎች እንጂ አንድ አይደሉም።
  body_html_en: <h2>They are not the same thing</h2><p>Cancelling releases your seats. Refunding
    returns money. Cancelling does not trigger a refund, and on a non-refundable fare it returns
    nothing at all -- so cancel only after you have seen what the refund rules give you.</p><h2>What
    each fare returns</h2><ul><li>Flex fares refund in full, less a processing fee.</li><li>Standard
    fares refund a percentage, set by the fare rules on your booking.</li><li>Saver and promotional
    fares refund the government taxes only. The base fare is not returned.</li></ul><h2>How
    long it takes</h2><p>Approved refunds reach the original payment method in 7 to 21 working
    days. Bookings made through an agent are refunded to the agent, not to you.</p>
  body_html_am: <h2>አንድ ዓይነት አይደሉም</h2><p>መሰረዝ መቀመጫዎችዎን ይለቃል። ተመላሽ ማድረግ ገንዘብ ይመልሳል። መሰረዝ ተመላሽ
    ክፍያን አያስከትልም፤ ተመላሽ በማይደረግ ታሪፍ ላይም ምንም አይመልስም። ስለዚህ የተመላሽ ክፍያ ደንቦች የሚሰጡዎትን ካዩ በኋላ ብቻ ይሰርዙ።</p><h2>እያንዳንዱ
    ታሪፍ የሚመልሰው</h2><ul><li>የፍሌክስ ታሪፎች የማስኬጃ ክፍያ ተቀንሶ ሙሉ በሙሉ ተመላሽ ይደረጋሉ።</li><li>የስታንዳርድ ታሪፎች
    በቦታ ማስያዣዎ ላይ ባሉት የታሪፍ ደንቦች በተወሰነ መቶኛ ተመላሽ ይደረጋሉ።</li><li>የሴቨርና የቅናሽ ታሪፎች የመንግሥት ግብሮችን
    ብቻ ተመላሽ ያደርጋሉ። መሠረታዊው ታሪፍ አይመለስም።</li></ul><h2>የሚወስደው ጊዜ</h2><p>የተፈቀዱ ተመላሽ ክፍያዎች በ7 እስከ
    21 የሥራ ቀናት ውስጥ ወደ መጀመሪያው የክፍያ መንገድ ይደርሳሉ። በወኪል የተያዙ የቦታ ማስያዣዎች ተመላሽ የሚደረጉት ለወኪሉ እንጂ ለእርስዎ
    አይደለም።</p>
  id: 28
  title_bn: বাতিল, এবং কী ফেরত আসে
  title_hi: रद्द करना, और क्या वापस आता है
  title_ur: منسوخی، اور کیا واپس آتا ہے
  summary_bn: বাতিল ও রিফান্ড দুটি আলাদা সিদ্ধান্ত, একটি নয়।
  summary_hi: रद्द करना और रिफ़ंड करना दो निर्णय हैं, एक नहीं।
  summary_ur: منسوخ کرنا اور ریفنڈ کرنا دو فیصلے ہیں، ایک نہیں۔
  body_html_bn: <h2>এগুলি এক জিনিস নয়</h2><p>বাতিল আপনার আসন ছেড়ে দেয়। রিফান্ড টাকা ফেরত
    দেয়। বাতিল রিফান্ড শুরু করে না, এবং রিফান্ডযোগ্য নয় এমন ভাড়ায় কিছুই ফেরত দেয় না --
    তাই রিফান্ডের নিয়ম আপনাকে কী দেয় তা দেখার পরেই বাতিল করুন।</p><h2>প্রতিটি ভাড়া কী ফেরত
    দেয়</h2><ul><li>ফ্লেক্স ভাড়া প্রক্রিয়াকরণ ফি বাদে সম্পূর্ণ রিফান্ড করে।</li><li>স্ট্যান্ডার্ড
    ভাড়া আপনার বুকিংয়ের ভাড়ার নিয়মে নির্ধারিত একটি শতাংশ রিফান্ড করে।</li><li>সেভার ও
    প্রমোশনাল ভাড়া শুধু সরকারি কর রিফান্ড করে। মূল ভাড়া ফেরত দেওয়া হয় না।</li></ul><h2>কত
    সময় লাগে</h2><p>অনুমোদিত রিফান্ড 7 থেকে 21 কার্যদিবসে মূল পেমেন্ট পদ্ধতিতে পৌঁছায়। এজেন্টের
    মাধ্যমে করা বুকিং এজেন্টকে রিফান্ড করা হয়, আপনাকে নয়।</p>
  body_html_hi: <h2>ये एक ही चीज़ नहीं हैं</h2><p>रद्द करना आपकी सीटें छोड़ देता है। रिफ़ंड
    पैसा लौटाता है। रद्द करने से रिफ़ंड शुरू नहीं होता, और नॉन-रिफ़ंडेबल किराए पर यह कुछ भी
    नहीं लौटाता -- इसलिए यह देखने के बाद ही रद्द करें कि रिफ़ंड नियम आपको क्या देते हैं।</p><h2>हर
    किराया क्या लौटाता है</h2><ul><li>फ़्लेक्स किराए प्रोसेसिंग शुल्क घटाकर पूरा रिफ़ंड करते
    हैं।</li><li>स्टैंडर्ड किराए आपकी बुकिंग के किराया नियमों द्वारा तय प्रतिशत रिफ़ंड करते
    हैं।</li><li>सेवर और प्रमोशनल किराए केवल सरकारी कर रिफ़ंड करते हैं। मूल किराया नहीं लौटाया
    जाता।</li></ul><h2>इसमें कितना समय लगता है</h2><p>स्वीकृत रिफ़ंड 7 से 21 कार्य दिवसों
    में मूल भुगतान माध्यम तक पहुँचते हैं। एजेंट के ज़रिए की गई बुकिंग एजेंट को रिफ़ंड की जाती
    है, आपको नहीं।</p>
  body_html_ur: <h2>یہ ایک ہی چیز نہیں ہیں</h2><p>منسوخی آپ کی سیٹیں چھوڑ دیتی ہے۔ ریفنڈ رقم
    واپس کرتا ہے۔ منسوخی سے ریفنڈ شروع نہیں ہوتا، اور ناقابلِ ریفنڈ کرائے پر یہ کچھ بھی واپس
    نہیں کرتی -- اس لیے یہ دیکھنے کے بعد ہی منسوخ کریں کہ ریفنڈ قواعد آپ کو کیا دیتے ہیں۔</p><h2>ہر
    کرایہ کیا واپس کرتا ہے</h2><ul><li>فلیکس کرائے پروسیسنگ فیس منہا کر کے مکمل ریفنڈ کرتے
    ہیں۔</li><li>اسٹینڈرڈ کرائے آپ کی بکنگ کے کرایہ قواعد سے طے شدہ فیصد ریفنڈ کرتے ہیں۔</li><li>سیور
    اور پروموشنل کرائے صرف سرکاری ٹیکس ریفنڈ کرتے ہیں۔ بنیادی کرایہ واپس نہیں کیا جاتا۔</li></ul><h2>اس
    میں کتنا وقت لگتا ہے</h2><p>منظور شدہ ریفنڈ 7 سے 21 کاروباری دنوں میں اصل ادائیگی کے ذریعے
    تک پہنچتے ہیں۔ ایجنٹ کے ذریعے کی گئی بکنگز ایجنٹ کو ریفنڈ کی جاتی ہیں، آپ کو نہیں۔</p>
- slug: name-corrections
  category: booking-help
  position: 12
  title_en: Correcting a name
  title_am: ስምን ማረም
  summary_en: Which spelling mistakes we can fix, and which need a new ticket.
  summary_am: ልናስተካክላቸው የምንችላቸው የፊደል ስህተቶች፣ እና አዲስ ትኬት የሚያስፈልጋቸው።
  body_html_en: <h2>Corrections we make free of charge</h2><ul><li>Up to three letters in
    a first or last name, where the name is clearly the same person -- a transposed pair,
    a missing letter, an accented character dropped.</li><li>Reversed first and last name.</li><li>Adding
    or removing a middle name to match the passport.</li></ul><h2>What needs a new booking</h2><p>A
    different person, a legal name change, or a correction of more than three letters. A ticket
    is not transferable, so this is a cancellation under your fare rules followed by a fresh
    purchase.</p><p>Bring the correction to us before check-in opens. After a boarding pass
    is issued the name is fixed and the airport cannot change it.</p>
  body_html_am: <h2>ያለክፍያ የምናደርጋቸው እርማቶች</h2><ul><li>በስም ወይም በአያት ስም ውስጥ እስከ ሦስት ፊደላት፣ ስሙ
    በግልጽ የአንድ ሰው መሆኑ ሲታወቅ -- የተቀያየሩ ጥንድ፣ የጎደለ ፊደል፣ የወደቀ ምልክት ያለው ፊደል።</li><li>የተገላቢጦሽ የስምና
    የአያት ስም።</li><li>ከፓስፖርቱ ጋር ለማዛመድ የአባት ስም መጨመር ወይም ማንሳት።</li></ul><h2>አዲስ የቦታ ማስያዣ የሚያስፈልገው</h2><p>ሌላ
    ሰው፣ ሕጋዊ የስም ለውጥ፣ ወይም ከሦስት ፊደላት በላይ የሆነ እርማት። ትኬት ወደ ሌላ ሰው አይተላለፍም፤ ስለዚህ ይህ በታሪፍ ደንቦችዎ
    መሠረት መሰረዝ ከዚያም አዲስ ግዢ ነው።</p><p>እርማቱን ቼክ-ኢን ከመከፈቱ በፊት ያምጡልን። የመሳፈሪያ ፈቃድ ከወጣ በኋላ ስሙ ይቆለፋል፤
    አየር ማረፊያውም ሊለውጠው አይችልም።</p>
  id: 29
  title_bn: নাম সংশোধন
  title_hi: नाम सुधारना
  title_ur: نام کی تصحیح
  summary_bn: কোন বানান ভুল আমরা ঠিক করতে পারি, আর কোনটির জন্য নতুন টিকিট লাগে।
  summary_hi: कौन सी वर्तनी की गलतियाँ हम ठीक कर सकते हैं, और किनके लिए नया टिकट चाहिए।
  summary_ur: کون سی املا کی غلطیاں ہم ٹھیک کر سکتے ہیں، اور کن کے لیے نیا ٹکٹ درکار ہے۔
  body_html_bn: <h2>আমরা যে সংশোধন বিনামূল্যে করি</h2><ul><li>নাম বা পদবিতে তিন অক্ষর পর্যন্ত,
    যেখানে নামটি স্পষ্টতই একই ব্যক্তির -- অক্ষর জোড়ার স্থান বদল, একটি অক্ষর বাদ, একটি অ্যাকসেন্টযুক্ত
    অক্ষর বাদ পড়া।</li><li>নাম ও পদবি উল্টে যাওয়া।</li><li>পাসপোর্টের সঙ্গে মেলাতে মধ্যনাম
    যোগ বা বাদ।</li></ul><h2>যার জন্য নতুন বুকিং লাগে</h2><p>ভিন্ন ব্যক্তি, আইনগত নাম পরিবর্তন,
    বা তিন অক্ষরের বেশি সংশোধন। টিকিট হস্তান্তরযোগ্য নয়, তাই এটি আপনার ভাড়ার নিয়মে বাতিল
    এবং তারপর নতুন ক্রয়।</p><p>চেক-ইন খোলার আগে সংশোধনটি আমাদের কাছে আনুন। বোর্ডিং পাস ইস্যু
    হওয়ার পরে নাম স্থির হয়ে যায় এবং বিমানবন্দর তা বদলাতে পারে না।</p>
  body_html_hi: <h2>जो सुधार हम निःशुल्क करते हैं</h2><ul><li>पहले या अंतिम नाम में तीन अक्षरों
    तक, जहाँ नाम स्पष्ट रूप से उसी व्यक्ति का हो -- अक्षरों की अदला-बदली, एक अक्षर छूटना,
    एक उच्चारण चिह्न वाला अक्षर छूटना।</li><li>पहले और अंतिम नाम का उलट जाना।</li><li>पासपोर्ट
    से मिलाने के लिए मध्य नाम जोड़ना या हटाना।</li></ul><h2>किसके लिए नई बुकिंग चाहिए</h2><p>कोई
    अन्य व्यक्ति, क़ानूनी नाम परिवर्तन, या तीन से अधिक अक्षरों का सुधार। टिकट हस्तांतरणीय
    नहीं है, इसलिए यह आपके किराया नियमों के तहत रद्दीकरण और फिर नई खरीद है।</p><p>सुधार चेक-इन
    खुलने से पहले हमारे पास लाएँ। बोर्डिंग पास जारी होने के बाद नाम स्थिर हो जाता है और हवाई
    अड्डा उसे नहीं बदल सकता।</p>
  body_html_ur: <h2>وہ تصحیحات جو ہم مفت کرتے ہیں</h2><ul><li>پہلے یا آخری نام میں تین حروف
    تک، جہاں نام واضح طور پر اسی شخص کا ہو -- حروف کا جوڑا الٹ جانا، ایک حرف چھوٹ جانا، ایک
    لہجے والا حرف چھوٹ جانا۔</li><li>پہلے اور آخری نام کا الٹ جانا۔</li><li>پاسپورٹ سے ملانے
    کے لیے درمیانی نام شامل کرنا یا ہٹانا۔</li></ul><h2>کس کے لیے نئی بکنگ درکار ہے</h2><p>کوئی
    اور شخص، قانونی نام کی تبدیلی، یا تین سے زیادہ حروف کی تصحیح۔ ٹکٹ قابلِ منتقلی نہیں ہے،
    اس لیے یہ آپ کے کرایہ قواعد کے تحت منسوخی اور پھر نئی خریداری ہے۔</p><p>تصحیح چیک اِن
    کھلنے سے پہلے ہمارے پاس لائیں۔ بورڈنگ پاس جاری ہونے کے بعد نام مقرر ہو جاتا ہے اور ہوائی
    اڈا اسے تبدیل نہیں کر سکتا۔</p>
- slug: payment-methods
  category: booking-help
