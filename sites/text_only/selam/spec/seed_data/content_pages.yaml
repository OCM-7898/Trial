  title_en: If your bag does not arrive
  title_am: ሻንጣዎ ካልደረሰ
  summary_en: What to do at the airport, and what we pay while a bag is missing.
  summary_am: በአየር ማረፊያ ምን ማድረግ እንዳለብዎ፣ እና ሻንጣ በጠፋበት ጊዜ የምንከፍለው።
  body_html_en: <h2>Report it before you leave the airport</h2><p>Go to the baggage desk in
    the arrivals hall and open a report. You are given a reference in the form PIR-100001.
    Reports opened after you leave the airport are accepted for 7 days but are harder to trace,
    because the bag has left our custody chain.</p><h2>While it is missing</h2><p>Away from
    home we reimburse essentials -- toiletries and a change of clothes -- up to USD 100 for
    the first 48 hours, against receipts. Most bags are located within three days. After 21
    days a bag is declared lost and the claim moves to compensation.</p>
  body_html_am: <h2>አየር ማረፊያውን ከመልቀቅዎ በፊት ያሳውቁ</h2><p>በመድረሻ አዳራሽ ወዳለው የሻንጣ ጠረጴዛ ሄደው ሪፖርት ይክፈቱ።
    በPIR-100001 ቅርጽ ያለ ማጣቀሻ ይሰጥዎታል። አየር ማረፊያውን ከለቀቁ በኋላ የተከፈቱ ሪፖርቶች ለ7 ቀናት ተቀባይነት አላቸው፤ ነገር
    ግን ሻንጣው ከቁጥጥር ሰንሰለታችን ስለወጣ ለመከታተል ይከብዳሉ።</p><h2>በጠፋበት ጊዜ</h2><p>ከቤት ርቀው ሲሆኑ አስፈላጊ ነገሮችን
    -- የመታጠቢያ ቁሳቁስና የመቀየሪያ ልብስ -- ለመጀመሪያዎቹ 48 ሰዓታት እስከ USD 100 በደረሰኝ እንመልሳለን። አብዛኞቹ ሻንጣዎች
    በሦስት ቀናት ውስጥ ይገኛሉ። ከ21 ቀናት በኋላ ሻንጣ እንደጠፋ ተቆጥሮ ጥያቄው ወደ ካሳ ይሸጋገራል።</p>
  id: 39
  title_bn: আপনার ব্যাগ না পৌঁছালে
  title_hi: यदि आपका बैग न पहुँचे
  title_ur: اگر آپ کا بیگ نہ پہنچے
  summary_bn: বিমানবন্দরে কী করবেন, এবং ব্যাগ হারানো অবস্থায় আমরা কী দিই।
  summary_hi: हवाई अड्डे पर क्या करें, और बैग गुम रहने के दौरान हम क्या देते हैं।
  summary_ur: ہوائی اڈے پر کیا کریں، اور بیگ گمشدہ رہنے کے دوران ہم کیا ادا کرتے ہیں۔
  body_html_bn: <h2>বিমানবন্দর ছাড়ার আগে রিপোর্ট করুন</h2><p>আগমন হলের ব্যাগেজ ডেস্কে গিয়ে
    একটি রিপোর্ট খুলুন। আপনাকে PIR-100001 আকারের একটি রেফারেন্স দেওয়া হয়। বিমানবন্দর ছাড়ার
    পরে খোলা রিপোর্ট 7 দিন গ্রহণ করা হয় কিন্তু খুঁজে পাওয়া কঠিন, কারণ ব্যাগটি আমাদের হেফাজত
    শৃঙ্খল ছেড়ে গেছে।</p><h2>যতক্ষণ এটি হারানো</h2><p>বাড়ি থেকে দূরে থাকলে আমরা প্রথম 48
    ঘণ্টার জন্য USD 100 পর্যন্ত প্রয়োজনীয় জিনিস -- প্রসাধনী ও এক সেট পোশাক -- রসিদের বিপরীতে
    ফেরত দিই। বেশিরভাগ ব্যাগ তিন দিনের মধ্যে পাওয়া যায়। 21 দিন পরে ব্যাগ হারানো ঘোষিত হয়
    এবং দাবি ক্ষতিপূরণে যায়।</p>
  body_html_hi: <h2>हवाई अड्डा छोड़ने से पहले रिपोर्ट करें</h2><p>आगमन हॉल के बैगेज डेस्क
    पर जाएँ और रिपोर्ट खोलें। आपको PIR-100001 रूप का संदर्भ दिया जाता है। हवाई अड्डा छोड़ने
    के बाद खोली गई रिपोर्ट 7 दिनों तक स्वीकार की जाती हैं लेकिन उन्हें ट्रेस करना कठिन है,
    क्योंकि बैग हमारी हिरासत श्रृंखला छोड़ चुका है।</p><h2>जब तक वह गुम है</h2><p>घर से दूर
    होने पर हम पहले 48 घंटों के लिए USD 100 तक की आवश्यक वस्तुएँ -- प्रसाधन और कपड़ों का एक
    जोड़ा -- रसीदों के विरुद्ध प्रतिपूर्ति करते हैं। अधिकांश बैग तीन दिनों के भीतर मिल जाते
    हैं। 21 दिनों के बाद बैग खोया घोषित कर दिया जाता है और दावा मुआवज़े में चला जाता है।</p>
  body_html_ur: <h2>ہوائی اڈا چھوڑنے سے پہلے رپورٹ کریں</h2><p>آمد ہال کے بیگیج ڈیسک پر جائیں
    اور رپورٹ کھولیں۔ آپ کو PIR-100001 کی شکل کا حوالہ دیا جاتا ہے۔ ہوائی اڈا چھوڑنے کے بعد
    کھولی گئی رپورٹیں 7 دن تک قبول کی جاتی ہیں لیکن ان کا سراغ لگانا مشکل ہے، کیونکہ بیگ ہماری
    تحویل کی زنجیر چھوڑ چکا ہے۔</p><h2>جب تک یہ گمشدہ ہے</h2><p>گھر سے دور ہونے پر ہم پہلے
    48 گھنٹوں کے لیے USD 100 تک ضروری اشیا -- ٹوائلٹریز اور کپڑوں کا ایک جوڑا -- رسیدوں کے
    مقابل واپس ادا کرتے ہیں۔ زیادہ تر بیگ تین دنوں کے اندر مل جاتے ہیں۔ 21 دنوں کے بعد بیگ
    گمشدہ قرار دیا جاتا ہے اور کلیم معاوضے کی طرف بڑھتا ہے۔</p>
- slug: damaged-baggage
  category: baggage
  position: 14
  title_en: Damaged bags
  title_am: የተጎዱ ሻንጣዎች
  summary_en: The deadline, and the damage we do not cover.
  summary_am: የጊዜ ገደቡ፣ እና የማንሸፍነው ጉዳት።
  body_html_en: <h2>Seven days</h2><p>Report damage within 7 days of arrival, with the bag,
    the tag and the boarding pass. We repair where a repair is possible and pay the depreciated
    value where it is not. After 7 days we cannot accept the claim; this deadline is set by
    the carriage convention, not by us.</p><h2>Not covered</h2><p>Scuffs, scratches, dents
    and marks from ordinary handling; wheels, feet, handles and straps, which are wear items;
    overpacking that split a seam; and anything inside a bag that should not have been checked
    -- money, jewellery, electronics, documents, medication.</p>
  body_html_am: <h2>ሰባት ቀናት</h2><p>ጉዳቱን ከደረሱ በ7 ቀናት ውስጥ ከሻንጣው፣ ከመለያውና ከመሳፈሪያ ፈቃዱ ጋር ያሳውቁ።
    ጥገና በሚቻልበት እንጠግናለን፤ በማይቻልበትም የቀነሰውን ዋጋ እንከፍላለን። ከ7 ቀናት በኋላ ጥያቄውን ልንቀበል አንችልም፤ ይህ የጊዜ ገደብ
    በእኛ ሳይሆን በማጓጓዝ ስምምነቱ የተቀመጠ ነው።</p><h2>የማይሸፈን</h2><p>ከተለመደ አያያዝ የሚመጡ ጭረቶች፣ ስንጥቆች፣ ሽንቁሮችና
    ምልክቶች፤ የሚያልቁ ዕቃዎች የሆኑ ጎማዎች፣ እግሮች፣ እጀታዎችና ማሰሪያዎች፤ ስፌት ያሰነጠቀ ከመጠን በላይ ማሸግ፤ እንዲሁም መመዝገብ የሌለበት
    በሻንጣ ውስጥ ያለ ማንኛውም ነገር -- ገንዘብ፣ ጌጣጌጥ፣ ኤሌክትሮኒክስ፣ ሰነዶች፣ መድኃኒት።</p>
  id: 40
  title_bn: ক্ষতিগ্রস্ত ব্যাগ
  title_hi: क्षतिग्रस्त बैग
  title_ur: خراب شدہ بیگ
  summary_bn: সময়সীমা, এবং যে ক্ষতি আমরা কভার করি না।
  summary_hi: समय-सीमा, और वह क्षति जो हम कवर नहीं करते।
  summary_ur: آخری تاریخ، اور وہ نقصان جو ہم پورا نہیں کرتے۔
  body_html_bn: <h2>সাত দিন</h2><p>আগমনের 7 দিনের মধ্যে ব্যাগ, ট্যাগ ও বোর্ডিং পাসসহ ক্ষতি
    রিপোর্ট করুন। মেরামত সম্ভব হলে আমরা মেরামত করি এবং না হলে অবচয়িত মূল্য দিই। 7 দিন পরে
    আমরা দাবি গ্রহণ করতে পারি না; এই সময়সীমা বহন কনভেনশন নির্ধারণ করে, আমরা নই।</p><h2>যা
    কভার করা হয় না</h2><p>সাধারণ হ্যান্ডলিংয়ের ঘষা, আঁচড়, টোল ও দাগ; চাকা, পা, হাতল ও স্ট্র্যাপ,
    যেগুলি ক্ষয়যোগ্য অংশ; বেশি ভরার কারণে ফেটে যাওয়া সেলাই; এবং ব্যাগের ভিতরে যা চেক করা
    উচিত ছিল না -- টাকা, গয়না, ইলেকট্রনিকস, নথি, ওষুধ।</p>
  body_html_hi: <h2>सात दिन</h2><p>आगमन के 7 दिनों के भीतर बैग, टैग और बोर्डिंग पास के साथ
    क्षति की रिपोर्ट करें। जहाँ मरम्मत संभव हो हम मरम्मत करते हैं और जहाँ नहीं, वहाँ मूल्यह्रासित
    मूल्य देते हैं। 7 दिनों के बाद हम दावा स्वीकार नहीं कर सकते; यह समय-सीमा ढुलाई अभिसमय
    द्वारा तय है, हमारे द्वारा नहीं।</p><h2>कवर नहीं</h2><p>सामान्य हैंडलिंग से रगड़, खरोंच,
    गड्ढे और निशान; पहिये, पैर, हैंडल और पट्टियाँ, जो घिसने वाली वस्तुएँ हैं; ज़्यादा भरने
    से फटी सिलाई; और बैग के अंदर वह सब जो चेक नहीं किया जाना चाहिए था -- पैसा, गहने, इलेक्ट्रॉनिक्स,
    दस्तावेज़, दवा।</p>
  body_html_ur: <h2>سات دن</h2><p>آمد کے 7 دنوں کے اندر بیگ، ٹیگ اور بورڈنگ پاس کے ساتھ نقصان
    کی رپورٹ کریں۔ جہاں مرمت ممکن ہو ہم مرمت کرتے ہیں اور جہاں نہیں وہاں گھٹی ہوئی قیمت ادا
    کرتے ہیں۔ 7 دنوں کے بعد ہم کلیم قبول نہیں کر سکتے؛ یہ آخری تاریخ ترسیلی کنونشن سے طے ہے،
    ہم سے نہیں۔</p><h2>شامل نہیں</h2><p>عام ہینڈلنگ سے رگڑ، خراشیں، گڑھے اور نشانات؛ پہیے،
    پاؤں، ہینڈل اور پٹیاں، جو گھسنے والی اشیا ہیں؛ زیادہ بھرنے سے پھٹی سلائی؛ اور بیگ کے اندر
    وہ سب جو چیک نہیں کیا جانا چاہیے تھا -- رقم، زیورات، الیکٹرانکس، دستاویزات، دوا۔</p>
- slug: baggage-on-connections
  category: baggage
  position: 15
  title_en: Bags on a connection
  title_am: በመሸጋገሪያ ላይ ያሉ ሻንጣዎች
  summary_en: When a bag is through-checked, and when you must collect it.
  summary_am: ሻንጣ መቼ እስከመጨረሻው እንደሚመዘገብ፣ እና መቼ መውሰድ እንዳለብዎ።
  body_html_en: <h2>Through-checked</h2><p>On a single booking your bag is tagged to your
    final destination and you do not see it in between, whichever airlines operate the legs.</p><h2>When
    you must collect and recheck</h2><ul><li>Two separate bookings, even on the same airline
    and the same day.</li><li>A country that requires every arriving bag to clear customs,
    whatever your onward plan.</li><li>A change of terminal where the two are not connected
    airside.</li></ul><h2>Minimum connection time</h2><p>We do not sell a connection shorter
    than the minimum for that airport, so a legal connection is long enough for the bag as
    well. If the first flight is late and the bag misses the second, it follows on the next
    service and we deliver it.</p>
  body_html_am: <h2>እስከመጨረሻው የተመዘገበ</h2><p>በአንድ የቦታ ማስያዣ ላይ ሻንጣዎ እስከ መጨረሻ መድረሻዎ ይመዘገባል፤ ክፍሎቹን
    የትኛውም አየር መንገድ ቢያከናውን በመሃል አያዩትም።</p><h2>መውሰድና እንደገና መመዝገብ ያለብዎት ጊዜ</h2><ul><li>ሁለት የተለያዩ
    የቦታ ማስያዣዎች፤ በተመሳሳይ አየር መንገድና በተመሳሳይ ቀን ቢሆኑም እንኳ።</li><li>ቀጣይ ዕቅድዎ ምንም ይሁን ምን የሚደርስ እያንዳንዱ
    ሻንጣ ጉምሩክ እንዲያልፍ የምትጠይቅ አገር።</li><li>ሁለቱ ከደህንነት ፍተሻ በኋላ ባልተገናኙበት የተርሚናል ለውጥ።</li></ul><h2>አነስተኛ
    የመሸጋገሪያ ጊዜ</h2><p>ለዚያ አየር ማረፊያ ካለው አነስተኛ ጊዜ የሚያጥር መሸጋገሪያ አንሸጥም፤ ስለዚህ ሕጋዊ መሸጋገሪያ ለሻንጣውም
    በቂ ነው። የመጀመሪያው በረራ ከዘገየና ሻንጣው ሁለተኛውን ካመለጠ በሚቀጥለው በረራ ይከተላል፤ እኛም እናደርስልዎታለን።</p>
  id: 41
  title_bn: সংযোগ ফ্লাইটে ব্যাগ
  title_hi: कनेक्शन पर बैग
  title_ur: کنکشن پر بیگ
  summary_bn: কখন ব্যাগ থ্রু-চেক হয়, আর কখন আপনাকে তুলতে হয়।
  summary_hi: बैग कब थ्रू-चेक होता है, और कब आपको उसे लेना होता है।
  summary_ur: بیگ کب تھرو چیک ہوتا ہے، اور کب آپ کو اسے وصول کرنا ہوتا ہے۔
  body_html_bn: <h2>থ্রু-চেকড</h2><p>একটি বুকিংয়ে আপনার ব্যাগ চূড়ান্ত গন্তব্য পর্যন্ত ট্যাগ
    করা হয় এবং মাঝে আপনি এটি দেখেন না, যে এয়ারলাইনই অংশগুলি পরিচালনা করুক।</p><h2>কখন আপনাকে
    তুলে পুনরায় চেক করতে হবে</h2><ul><li>দুটি আলাদা বুকিং, এমনকি একই এয়ারলাইনে ও একই দিনে
    হলেও।</li><li>যে দেশে আগত প্রতিটি ব্যাগকে কাস্টমস পার হতে হয়, আপনার পরবর্তী পরিকল্পনা
    যাই হোক।</li><li>টার্মিনাল পরিবর্তন যেখানে দুটি এয়ারসাইডে সংযুক্ত নয়।</li></ul><h2>ন্যূনতম
    সংযোগ সময়</h2><p>আমরা সেই বিমানবন্দরের ন্যূনতমের চেয়ে ছোট সংযোগ বিক্রি করি না, তাই বৈধ
    সংযোগ ব্যাগের জন্যও যথেষ্ট দীর্ঘ। প্রথম ফ্লাইট দেরি করলে এবং ব্যাগ দ্বিতীয়টি মিস করলে,
    এটি পরবর্তী পরিষেবায় আসে এবং আমরা তা পৌঁছে দিই।</p>
  body_html_hi: <h2>थ्रू-चेक्ड</h2><p>एक ही बुकिंग पर आपका बैग आपके अंतिम गंतव्य तक टैग किया
    जाता है और बीच में आप उसे नहीं देखते, चाहे कोई भी एयरलाइन खंडों का संचालन करे।</p><h2>कब
    आपको लेकर फिर से चेक करना होगा</h2><ul><li>दो अलग बुकिंग, भले ही उसी एयरलाइन पर और उसी
    दिन हों।</li><li>ऐसा देश जिसमें हर आने वाले बैग को कस्टम से गुज़रना होता है, आपकी आगे
    की योजना चाहे जो हो।</li><li>टर्मिनल का ऐसा बदलाव जहाँ दोनों एयरसाइड से जुड़े न हों।</li></ul><h2>न्यूनतम
    कनेक्शन समय</h2><p>हम उस हवाई अड्डे के न्यूनतम से छोटा कनेक्शन नहीं बेचते, इसलिए वैध कनेक्शन
    बैग के लिए भी पर्याप्त लंबा है। यदि पहली उड़ान देर से हो और बैग दूसरी छूट जाए, तो वह अगली
    सेवा से आता है और हम उसे पहुँचाते हैं।</p>
  body_html_ur: <h2>تھرو چیکڈ</h2><p>ایک ہی بکنگ پر آپ کا بیگ آپ کی آخری منزل تک ٹیگ کیا جاتا
    ہے اور درمیان میں آپ اسے نہیں دیکھتے، چاہے کوئی بھی ایئرلائنیں حصوں کو چلائیں۔</p><h2>کب
    آپ کو وصول کر کے دوبارہ چیک کرنا ہوگا</h2><ul><li>دو علیحدہ بکنگز، چاہے اسی ایئرلائن پر
    اور اسی دن ہوں۔</li><li>ایسا ملک جہاں ہر آنے والے بیگ کو کسٹم سے گزرنا ہو، آپ کا آگے کا
    منصوبہ چاہے جو ہو۔</li><li>ٹرمینل کی ایسی تبدیلی جہاں دونوں ایئرسائیڈ سے جڑے نہ ہوں۔</li></ul><h2>کم
    از کم کنکشن وقت</h2><p>ہم اس ہوائی اڈے کے کم از کم سے مختصر کنکشن نہیں بیچتے، اس لیے جائز
    کنکشن بیگ کے لیے بھی کافی طویل ہے۔ اگر پہلی پرواز دیر سے ہو اور بیگ دوسری سے رہ جائے،
    تو وہ اگلی سروس سے آتا ہے اور ہم اسے پہنچاتے ہیں۔</p>
- slug: valuables-and-fragile
  category: baggage
  position: 16
  title_en: Valuables and fragile items
  title_am: ውድና ተሰባሪ ዕቃዎች
  summary_en: What must stay with you, and the limit of our liability.
  summary_am: ከእርስዎ ጋር መቆየት ያለበት፣ እና የኃላፊነታችን ገደብ።
  body_html_en: <h2>Carry these yourself</h2><p>Money, jewellery, precious metals, electronics,
    cameras, keys, passports and other documents, prescription medication, and anything irreplaceable.
    We accept no liability for these in checked baggage, whether the bag is lost, delayed
    or damaged.</p><h2>Fragile items in the hold</h2><p>A fragile item may be checked if it
    is packed for transport in a rigid case. It is tagged &#x27;limited release&#x27;, which
    means we carry it but do not cover damage to it. A fragile tag is not insurance.</p>
  body_html_am: <h2>እነዚህን እርስዎ ይያዙ</h2><p>ገንዘብ፣ ጌጣጌጥ፣ የከበሩ ማዕድናት፣ ኤሌክትሮኒክስ፣ ካሜራዎች፣ ቁልፎች፣ ፓስፖርቶችና
    ሌሎች ሰነዶች፣ በሐኪም የታዘዘ መድኃኒት፣ እንዲሁም የማይተካ ማንኛውም ነገር። እነዚህ በተመዘገበ ሻንጣ ውስጥ ሲሆኑ ሻንጣው ይጥፋ፣ ይዘግይ
    ወይም ይጎዳ ምንም ኃላፊነት አንወስድም።</p><h2>በጭነት ክፍል ውስጥ ያሉ ተሰባሪ ዕቃዎች</h2><p>ተሰባሪ ዕቃ በጠንካራ ሳጥን ውስጥ
    ለማጓጓዝ ታሽጎ ከሆነ ሊመዘገብ ይችላል። ‘ውስን ኃላፊነት’ ተብሎ ይመዘገባል፤ ትርጉሙም እናጓጉዘዋለን እንጂ ጉዳቱን አንሸፍንም ማለት ነው።
    የተሰባሪ መለያ ዋስትና አይደለም።</p>
  id: 42
  title_bn: মূল্যবান ও ভঙ্গুর জিনিস
  title_hi: क़ीमती और नाज़ुक वस्तुएँ
  title_ur: قیمتی اور نازک اشیا
  summary_bn: কী আপনার সঙ্গে থাকতে হবে, এবং আমাদের দায়ের সীমা।
  summary_hi: क्या आपके पास रहना चाहिए, और हमारी ज़िम्मेदारी की सीमा।
  summary_ur: کیا آپ کے پاس رہنا چاہیے، اور ہماری ذمہ داری کی حد۔
  body_html_bn: <h2>এগুলি নিজে বহন করুন</h2><p>টাকা, গয়না, মূল্যবান ধাতু, ইলেকট্রনিকস, ক্যামেরা,
    চাবি, পাসপোর্ট ও অন্যান্য নথি, প্রেসক্রিপশনের ওষুধ, এবং অপূরণীয় যেকোনো কিছু। চেকড ব্যাগেজে
    এগুলির জন্য আমরা কোনো দায় নিই না, ব্যাগ হারানো, বিলম্বিত বা ক্ষতিগ্রস্ত যাই হোক।</p><h2>হোল্ডে
    ভঙ্গুর জিনিস</h2><p>পরিবহনের জন্য শক্ত কেসে প্যাক করা থাকলে ভঙ্গুর জিনিস চেক করা যেতে
    পারে। এটি &#x27;লিমিটেড রিলিজ&#x27; ট্যাগ পায়, যার মানে আমরা এটি বহন করি কিন্তু এর ক্ষতি
    কভার করি না। ভঙ্গুর ট্যাগ বিমা নয়।</p>
  body_html_hi: <h2>इन्हें स्वयं ले जाएँ</h2><p>पैसा, गहने, क़ीमती धातुएँ, इलेक्ट्रॉनिक्स,
    कैमरे, चाबियाँ, पासपोर्ट और अन्य दस्तावेज़, निर्धारित दवा, और कुछ भी अपूरणीय। चेक्ड बैगेज
    में इनके लिए हम कोई ज़िम्मेदारी नहीं लेते, चाहे बैग खोया, विलंबित या क्षतिग्रस्त हो।</p><h2>होल्ड
    में नाज़ुक वस्तुएँ</h2><p>नाज़ुक वस्तु को चेक किया जा सकता है यदि वह कठोर केस में परिवहन
    के लिए पैक हो। उस पर &#x27;लिमिटेड रिलीज़&#x27; टैग लगाया जाता है, जिसका अर्थ है कि हम
    उसे ले जाते हैं लेकिन उसकी क्षति कवर नहीं करते। नाज़ुक टैग बीमा नहीं है।</p>
  body_html_ur: <h2>یہ خود لے جائیں</h2><p>رقم، زیورات، قیمتی دھاتیں، الیکٹرانکس، کیمرے، چابیاں،
    پاسپورٹ اور دیگر دستاویزات، تجویز کردہ دوا، اور کچھ بھی ناقابلِ تلافی۔ چیکڈ سامان میں
    ان کے لیے ہم کوئی ذمہ داری قبول نہیں کرتے، چاہے بیگ گم ہو، تاخیر کا شکار ہو یا خراب ہو۔</p><h2>ہولڈ
    میں نازک اشیا</h2><p>نازک چیز چیک کی جا سکتی ہے اگر وہ سخت کیس میں ترسیل کے لیے پیک ہو۔
    اس پر &#x27;لمیٹڈ ریلیز&#x27; ٹیگ لگایا جاتا ہے، جس کا مطلب ہے کہ ہم اسے لے جاتے ہیں لیکن
    اس کے نقصان کو پورا نہیں کرتے۔ نازک ٹیگ بیمہ نہیں ہے۔</p>
- slug: connecting-at-addis
  category: travel-info
  position: 10
  title_en: Connecting at Addis Ababa
  title_am: በአዲስ አበባ መሸጋገር
  summary_en: Minimum times, terminal moves, and what a long layover unlocks.
  summary_am: አነስተኛ ጊዜያት፣ የተርሚናል ዝውውሮች፣ እና ረጅም ማቆያ የሚከፍተው።
  body_html_en: '<h2>Minimum connection time</h2><p>60 minutes between two international flights,
    90 minutes when one leg is domestic, and 120 minutes when the terminal changes. We do
    not sell a shorter connection, so anything you can book is long enough.</p><h2>Long layovers</h2><p>Between
    8 and 72 hours on a single booking, a connection becomes a stopover: hotel, airport transfer,
    lounge and city tour options open up. Below 8 hours it is an ordinary connection and none
    of those apply.</p><h2>Staying airside</h2><p>If you do not leave the transit area you
    need no visa. The in-terminal hotel, the lounges and the prayer rooms are all airside.
    Leaving the airport means clearing immigration, and that needs a visa or an e-Visa.</p>'
  body_html_am: <h2>አነስተኛ የመሸጋገሪያ ጊዜ</h2><p>በሁለት ዓለም አቀፍ በረራዎች መካከል 60 ደቂቃ፣ አንዱ ክፍል የአገር ውስጥ
    ሲሆን 90 ደቂቃ፣ ተርሚናል ሲቀየር ደግሞ 120 ደቂቃ። ከዚያ የሚያጥር መሸጋገሪያ አንሸጥም፤ ስለዚህ ሊይዙት የሚችሉት ማንኛውም ነገር
    በቂ ነው።</p><h2>ረጅም ማቆያዎች</h2><p>በአንድ የቦታ ማስያዣ ላይ ከ8 እስከ 72 ሰዓት ሲሆን መሸጋገሪያ ወደ ማቆያ ይለወጣል፦
    የሆቴል፣ የአየር ማረፊያ ትራንስፖርት፣ የላውንጅና የከተማ ጉብኝት አማራጮች ይከፈታሉ። ከ8 ሰዓት በታች ተራ መሸጋገሪያ ነው፤ ከእነዚያም
    አንዱም አይሠራም።</p><h2>ከደህንነት ፍተሻ በኋላ መቆየት</h2><p>የመሸጋገሪያ ቀጠናውን ካልለቀቁ ቪዛ አያስፈልግዎትም። በተርሚናል
    ውስጥ ያለው ሆቴል፣ ላውንጆቹና የጸሎት ክፍሎቹ ሁሉም ከደህንነት ፍተሻ በኋላ ናቸው። አየር ማረፊያውን መልቀቅ ማለት ኢሚግሬሽን ማለፍ ማለት
    ነው፤ ያም ቪዛ ወይም ኢ-ቪዛ ይፈልጋል።</p>
  id: 43
  title_bn: আদ্দিস আবাবায় সংযোগ
  title_hi: अदीस अबाबा में कनेक्शन
  title_ur: ادیس ابابا میں کنکشن
  summary_bn: ন্যূনতম সময়, টার্মিনাল পরিবর্তন, এবং দীর্ঘ লেওভার কী উন্মুক্ত করে।
  summary_hi: न्यूनतम समय, टर्मिनल बदलाव, और लंबा लेओवर क्या खोलता है।
  summary_ur: کم از کم اوقات، ٹرمینل کی تبدیلی، اور طویل لے اوور کیا کھولتا ہے۔
  body_html_bn: '<h2>ন্যূনতম সংযোগ সময়</h2><p>দুটি আন্তর্জাতিক ফ্লাইটের মধ্যে 60 মিনিট, একটি
    অংশ অভ্যন্তরীণ হলে 90 মিনিট, এবং টার্মিনাল বদলালে 120 মিনিট। আমরা এর চেয়ে ছোট সংযোগ বিক্রি
    করি না, তাই আপনি যা বুক করতে পারেন তা যথেষ্ট দীর্ঘ।</p><h2>দীর্ঘ লেওভার</h2><p>একটি বুকিংয়ে
    8 থেকে 72 ঘণ্টার মধ্যে সংযোগ স্টপওভারে পরিণত হয়: হোটেল, বিমানবন্দর ট্রান্সফার, লাউঞ্জ
    ও সিটি ট্যুরের বিকল্প খোলে। 8 ঘণ্টার নিচে এটি সাধারণ সংযোগ এবং এগুলির কোনোটি প্রযোজ্য
    নয়।</p><h2>এয়ারসাইডে থাকা</h2><p>ট্রানজিট এলাকা না ছাড়লে আপনার ভিসা লাগে না। টার্মিনালের
    ভিতরের হোটেল, লাউঞ্জ ও প্রার্থনাকক্ষ সবই এয়ারসাইডে। বিমানবন্দর ছাড়া মানে ইমিগ্রেশন পার
    হওয়া, এবং তার জন্য ভিসা বা ই-ভিসা লাগে।</p>'
  body_html_hi: '<h2>न्यूनतम कनेक्शन समय</h2><p>दो अंतरराष्ट्रीय उड़ानों के बीच 60 मिनट, जब
    एक खंड घरेलू हो तो 90 मिनट, और टर्मिनल बदलने पर 120 मिनट। हम इससे छोटा कनेक्शन नहीं बेचते,
    इसलिए जो भी आप बुक कर सकते हैं वह पर्याप्त लंबा है।</p><h2>लंबे लेओवर</h2><p>एक ही बुकिंग
    पर 8 से 72 घंटों के बीच कनेक्शन स्टॉपओवर बन जाता है: होटल, हवाई अड्डा ट्रांसफ़र, लाउंज
    और सिटी टूर के विकल्प खुलते हैं। 8 घंटे से कम पर यह सामान्य कनेक्शन है और इनमें से कुछ
    लागू नहीं होता।</p><h2>एयरसाइड रहना</h2><p>यदि आप ट्रांज़िट क्षेत्र नहीं छोड़ते तो आपको
    वीज़ा नहीं चाहिए। टर्मिनल के भीतर का होटल, लाउंज और प्रार्थना कक्ष सभी एयरसाइड हैं। हवाई
    अड्डा छोड़ने का अर्थ है इमिग्रेशन पार करना, और उसके लिए वीज़ा या ई-वीज़ा चाहिए।</p>'
  body_html_ur: '<h2>کم از کم کنکشن وقت</h2><p>دو بین الاقوامی پروازوں کے درمیان 60 منٹ، جب
    ایک حصہ ملکی ہو تو 90 منٹ، اور ٹرمینل بدلنے پر 120 منٹ۔ ہم اس سے مختصر کنکشن نہیں بیچتے،
    اس لیے جو بھی آپ بک کر سکتے ہیں وہ کافی طویل ہے۔</p><h2>طویل لے اوور</h2><p>ایک ہی بکنگ
    پر 8 سے 72 گھنٹوں کے درمیان کنکشن اسٹاپ اوور بن جاتا ہے: ہوٹل، ایئرپورٹ ٹرانسفر، لاؤنج
    اور سٹی ٹور کے اختیارات کھلتے ہیں۔ 8 گھنٹے سے کم پر یہ عام کنکشن ہے اور ان میں سے کوئی
    لاگو نہیں ہوتا۔</p><h2>ایئرسائیڈ رہنا</h2><p>اگر آپ ٹرانزٹ ایریا نہیں چھوڑتے تو آپ کو
    ویزا درکار نہیں۔ ٹرمینل کے اندر کا ہوٹل، لاؤنجز اور نماز کے کمرے سب ایئرسائیڈ ہیں۔ ہوائی
    اڈا چھوڑنے کا مطلب ہے امیگریشن سے گزرنا، اور اس کے لیے ویزا یا ای ویزا درکار ہے۔</p>'
- slug: security-screening
  category: travel-info
  position: 11
  title_en: Security screening
  title_am: የደህንነት ፍተሻ
  summary_en: What comes out of the bag, and the liquid rule.
  summary_am: ከሻንጣው የሚወጣው፣ እና የፈሳሽ ደንቡ።
  body_html_en: '<h2>The liquid rule</h2><p>Containers of up to 100 ml, all together in one
    transparent resealable bag of up to one litre, one bag per passenger. A 200 ml bottle
    that is half empty is still refused: the rule is the container size, not the amount inside
    it.</p><h2>Exempt from the bag</h2><p>Baby food and milk for a travelling infant, and
    prescription medication, in the quantity needed for the journey. Declare both at the checkpoint.
    Screening staff may ask you to open them.</p><h2>Out of the bag</h2><p>Laptops and tablets,
    the liquids bag, and coats. Shoes and belts only if asked. Duty free bought before a connection
    stays sealed in its tamper-evident bag with the receipt visible, or it will be taken at
    the next checkpoint.</p>'
  body_html_am: <h2>የፈሳሽ ደንብ</h2><p>እስከ 100 ሚሊ ሊትር የሆኑ ዕቃዎች፣ ሁሉም በአንድነት እስከ አንድ ሊትር በሚይዝ አንድ
    ግልጽና እንደገና በሚዘጋ ከረጢት ውስጥ፣ በአንድ ተሳፋሪ አንድ ከረጢት። ግማሽ ባዶ የሆነ የ200 ሚሊ ሊትር ጠርሙስ አሁንም አይፈቀድም፦
    ደንቡ በውስጡ ያለው መጠን ሳይሆን የዕቃው መጠን ነው።</p><h2>ከከረጢቱ የተለዩ</h2><p>ለሚጓዝ ጨቅላ የሚሆን የሕፃን ምግብና ወተት፣
    እንዲሁም በሐኪም የታዘዘ መድኃኒት፣ ለጉዞው በሚያስፈልገው መጠን። ሁለቱንም በፍተሻ ቦታው ላይ ያሳውቁ። የፍተሻ ሠራተኞች እንዲከፍቷቸው
    ሊጠይቁዎት ይችላሉ።</p><h2>ከሻንጣው የሚወጣ</h2><p>ላፕቶፖችና ታብሌቶች፣ የፈሳሽ ከረጢቱ፣ እንዲሁም ኮቶች። ጫማና ቀበቶ የሚጠየቁት
    ሲጠየቁ ብቻ ነው። ከመሸጋገሪያ በፊት የተገዛ ከቀረጥ ነጻ ዕቃ ደረሰኙ እየታየ በማይከፈት ከረጢቱ ውስጥ ታሽጎ መቆየት አለበት፤ አለበለዚያ
    በሚቀጥለው የፍተሻ ቦታ ይወሰዳል።</p>
  id: 44
  title_bn: নিরাপত্তা তল্লাশি
  title_hi: सुरक्षा जाँच
  title_ur: سیکیورٹی اسکریننگ
  summary_bn: ব্যাগ থেকে কী বের করতে হয়, এবং তরলের নিয়ম।
  summary_hi: बैग से क्या बाहर निकलता है, और तरल नियम।
  summary_ur: بیگ سے کیا باہر نکلتا ہے، اور مائعات کا قاعدہ۔
  body_html_bn: '<h2>তরলের নিয়ম</h2><p>100 ml পর্যন্ত পাত্র, সব একসঙ্গে এক লিটার পর্যন্ত
    একটি স্বচ্ছ পুনরায় সিলযোগ্য ব্যাগে, যাত্রীপ্রতি একটি ব্যাগ। অর্ধেক খালি 200 ml বোতলও
    প্রত্যাখ্যাত হয়: নিয়মটি পাত্রের মাপের, ভিতরের পরিমাণের নয়।</p><h2>ব্যাগ থেকে ছাড়</h2><p>ভ্রমণকারী
    নবজাতকের শিশুখাদ্য ও দুধ, এবং প্রেসক্রিপশনের ওষুধ, যাত্রার প্রয়োজনীয় পরিমাণে। দুটিই
    চেকপয়েন্টে ঘোষণা করুন। তল্লাশি কর্মীরা সেগুলি খুলতে বলতে পারেন।</p><h2>ব্যাগ থেকে বের
    করুন</h2><p>ল্যাপটপ ও ট্যাবলেট, তরলের ব্যাগ, এবং কোট। জুতা ও বেল্ট শুধু বলা হলে। সংযোগের
    আগে কেনা ডিউটি ফ্রি রসিদ দৃশ্যমান রেখে তার টেম্পার-এভিডেন্ট ব্যাগে সিল করা থাকে, নইলে
    পরবর্তী চেকপয়েন্টে নিয়ে নেওয়া হবে।</p>'
  body_html_hi: '<h2>तरल नियम</h2><p>100 ml तक के कंटेनर, सब एक साथ एक लीटर तक के एक पारदर्शी
    पुनः सील होने वाले बैग में, प्रति यात्री एक बैग। आधी खाली 200 ml की बोतल भी अस्वीकार की
    जाती है: नियम कंटेनर के आकार का है, उसके अंदर की मात्रा का नहीं।</p><h2>बैग से छूट</h2><p>यात्रा
    कर रहे शिशु के लिए शिशु आहार और दूध, और निर्धारित दवा, यात्रा के लिए आवश्यक मात्रा में।
    दोनों को चेकपॉइंट पर घोषित करें। जाँच कर्मी आपसे उन्हें खोलने को कह सकते हैं।</p><h2>बैग
    से बाहर</h2><p>लैपटॉप और टैबलेट, तरल पदार्थों का बैग, और कोट। जूते और बेल्ट केवल कहने
    पर। कनेक्शन से पहले खरीदा गया ड्यूटी फ़्री रसीद दिखते हुए अपने टैम्पर-एविडेंट बैग में
    सीलबंद रहता है, अन्यथा अगले चेकपॉइंट पर उसे ले लिया जाएगा।</p>'
  body_html_ur: '<h2>مائعات کا قاعدہ</h2><p>100 ml تک کے کنٹینر، سب ایک ساتھ ایک لیٹر تک کے
    ایک شفاف دوبارہ سیل ہونے والے بیگ میں، فی مسافر ایک بیگ۔ آدھی خالی 200 ml کی بوتل بھی
    مسترد کی جاتی ہے: قاعدہ کنٹینر کے سائز کا ہے، اس کے اندر کی مقدار کا نہیں۔</p><h2>بیگ
    سے مستثنیٰ</h2><p>سفر کرنے والے شیرخوار کے لیے بچوں کی خوراک اور دودھ، اور تجویز کردہ
    دوا، سفر کے لیے درکار مقدار میں۔ دونوں کو چیک پوائنٹ پر ظاہر کریں۔ اسکریننگ عملہ آپ سے
    انہیں کھولنے کو کہہ سکتا ہے۔</p><h2>بیگ سے باہر</h2><p>لیپ ٹاپ اور ٹیبلٹ، مائعات کا بیگ،
    اور کوٹ۔ جوتے اور بیلٹ صرف کہنے پر۔ کنکشن سے پہلے خریدا گیا ڈیوٹی فری رسید نظر آنے کے
    ساتھ اپنے ٹیمپر ایویڈنٹ بیگ میں سیل بند رہتا ہے، ورنہ اگلے چیک پوائنٹ پر لے لیا جائے گا۔</p>'
- slug: customs-and-duty-free
  category: travel-info
  position: 12
  title_en: Customs and duty free
  title_am: ጉምሩክና ከቀረጥ ነጻ
  summary_en: Allowances on arrival, and what must be declared.
  summary_am: በመድረስ ጊዜ ያሉ ፈቃዶች፣ እና መገለጽ ያለበት።
  body_html_en: <h2>Declare on arrival</h2><p>Currency above the local threshold, goods for
    sale, plant and animal products, and anything you were asked to carry for another person.
    Declaring costs nothing; failing to declare is what carries a penalty.</p><h2>Duty free
    on a connection</h2><p>Liquids bought airside travel in a sealed tamper-evident bag with
    the receipt inside. The seal must be intact at the next screening point. If your onward
    journey passes through a country that re-screens, buy on the last leg instead.</p>
  body_html_am: <h2>በመድረስ ጊዜ ያሳውቁ</h2><p>ከአገር ውስጥ ገደብ በላይ ያለ ገንዘብ፣ ለሽያጭ የሚሆኑ ዕቃዎች፣ የእጽዋትና
    የእንስሳት ተዋጽኦዎች፣ እንዲሁም ለሌላ ሰው እንዲይዙ የተጠየቁት ማንኛውም ነገር። ማሳወቅ ምንም አያስከፍልም፤ ቅጣት የሚያስከትለው አለማሳወቅ
    ነው።</p><h2>በመሸጋገሪያ ላይ ከቀረጥ ነጻ</h2><p>ከደህንነት ፍተሻ በኋላ የተገዙ ፈሳሾች ደረሰኙ ውስጡ ሆኖ በማይከፈት ማሸጊያ
    ከረጢት ውስጥ ይጓዛሉ። ማኅተሙ በሚቀጥለው የፍተሻ ቦታ ሳይነካ መቆየት አለበት። ቀጣይ ጉዞዎ እንደገና በሚፈትሽ አገር የሚያልፍ ከሆነ በምትኩ
    በመጨረሻው ክፍል ላይ ይግዙ።</p>
  id: 45
  title_bn: কাস্টমস ও ডিউটি ফ্রি
  title_hi: कस्टम और ड्यूटी फ़्री
  title_ur: کسٹم اور ڈیوٹی فری
  summary_bn: আগমনে অ্যালাউন্স, এবং কী ঘোষণা করতে হবে।
  summary_hi: आगमन पर अलाउंस, और क्या घोषित करना होगा।
  summary_ur: آمد پر الاؤنس، اور کیا ظاہر کرنا ہوگا۔
  body_html_bn: <h2>আগমনে ঘোষণা করুন</h2><p>স্থানীয় সীমার উপরে মুদ্রা, বিক্রির পণ্য, উদ্ভিদ
    ও প্রাণিজ পণ্য, এবং অন্য কারও জন্য আপনাকে বহন করতে বলা যেকোনো কিছু। ঘোষণায় কোনো খরচ নেই;
    ঘোষণা না করাতেই জরিমানা।</p><h2>সংযোগে ডিউটি ফ্রি</h2><p>এয়ারসাইডে কেনা তরল ভিতরে রসিদসহ
    একটি সিল করা টেম্পার-এভিডেন্ট ব্যাগে যায়। পরবর্তী তল্লাশি পয়েন্টে সিল অক্ষত থাকতে হবে।
    আপনার পরবর্তী যাত্রা পুনরায় তল্লাশি করা দেশের মধ্য দিয়ে গেলে, বদলে শেষ অংশে কিনুন।</p>
  body_html_hi: <h2>आगमन पर घोषित करें</h2><p>स्थानीय सीमा से ऊपर की मुद्रा, बिक्री के लिए
    सामान, पौधे और पशु उत्पाद, और वह सब जो आपसे किसी और के लिए ले जाने को कहा गया हो। घोषित
    करने का कोई शुल्क नहीं; घोषित न करने पर ही जुर्माना है।</p><h2>कनेक्शन पर ड्यूटी फ़्री</h2><p>एयरसाइड
    खरीदे गए तरल पदार्थ अंदर रसीद सहित सीलबंद टैम्पर-एविडेंट बैग में जाते हैं। अगले जाँच बिंदु
    पर सील अक्षुण्ण होनी चाहिए। यदि आपकी आगे की यात्रा पुनः जाँच करने वाले देश से गुज़रती
    है, तो इसके बजाय अंतिम खंड पर खरीदें।</p>
  body_html_ur: <h2>آمد پر ظاہر کریں</h2><p>مقامی حد سے زیادہ کرنسی، فروخت کے لیے سامان، پودوں
    اور جانوروں کی مصنوعات، اور وہ سب جو آپ سے کسی اور کے لیے لے جانے کو کہا گیا ہو۔ ظاہر
    کرنے کا کوئی خرچ نہیں؛ ظاہر نہ کرنے پر ہی جرمانہ ہے۔</p><h2>کنکشن پر ڈیوٹی فری</h2><p>ایئرسائیڈ
    خریدے گئے مائعات اندر رسید سمیت سیل بند ٹیمپر ایویڈنٹ بیگ میں سفر کرتے ہیں۔ اگلے اسکریننگ
    پوائنٹ پر سیل سلامت ہونی چاہیے۔ اگر آپ کا آگے کا سفر دوبارہ اسکریننگ کرنے والے ملک سے
    گزرتا ہے، تو اس کے بجائے آخری حصے پر خریدیں۔</p>
- slug: weather-and-disruption
  category: travel-info
  position: 13
  title_en: Weather and disruption
  title_am: የአየር ሁኔታና መስተጓጎል
  summary_en: What we owe you when a flight is disrupted, and what we do not.
  summary_am: በረራ ሲስተጓጎል የምንዳዎት፣ እና የማንዳዎት።
  body_html_en: <h2>Within our control</h2><p>A technical fault, crew shortage or scheduling
    decision. We rebook you at no charge on the next available service, provide meals for
    a delay over 2 hours, and a hotel with transfers when an overnight stay is unavoidable.</p><h2>Outside
    our control</h2><p>Weather, volcanic ash, air traffic restrictions, airport closure, strike
    action by third parties, and security instructions from an authority. We still rebook
    you at no charge, and a refund remains available if you no longer wish to travel, but
    meals and accommodation are not provided.</p><h2>Either way</h2><p>Your checked bags travel
    on whichever flight you end up on, and a connection missed because of our delay is rebooked
    without a change fee.</p>
  body_html_am: <h2>በእኛ ቁጥጥር ውስጥ</h2><p>የቴክኒክ ብልሽት፣ የሠራተኛ እጥረት ወይም የመርሐ ግብር ውሳኔ። ያለክፍያ በሚቀጥለው
    በሚገኝ በረራ እንደግምዎታለን፤ ከ2 ሰዓት በላይ ለሚዘገይ ምግብ እናቀርባለን፤ ማደር የግድ ሲሆንም ከትራንስፖርት ጋር ሆቴል እናዘጋጃለን።</p><h2>ከእኛ
    ቁጥጥር ውጭ</h2><p>የአየር ሁኔታ፣ የእሳተ ገሞራ አመድ፣ የአየር ትራፊክ ገደቦች፣ የአየር ማረፊያ መዘጋት፣ በሦስተኛ ወገኖች የሚደረግ
    የሥራ ማቆም አድማ፣ እንዲሁም ከባለሥልጣን የሚሰጡ የደህንነት መመሪያዎች። አሁንም ያለክፍያ እንደግምዎታለን፤ መጓዝ ካልፈለጉም ተመላሽ ክፍያ
    ይገኛል፤ ነገር ግን ምግብና ማረፊያ አይቀርብም።</p><h2>በሁለቱም ሁኔታ</h2><p>የተመዘገቡ ሻንጣዎችዎ በመጨረሻ በሚሳፈሩበት በረራ
    ይጓዛሉ፤ በእኛ መዘግየት ምክንያት ያመለጠ መሸጋገሪያም ያለ የለውጥ ክፍያ ይደገማል።</p>
  id: 46
  title_bn: আবহাওয়া ও বিঘ্ন
  title_hi: मौसम और व्यवधान
  title_ur: موسم اور خلل
  summary_bn: ফ্লাইট বিঘ্নিত হলে আমরা আপনাকে কী দিই, আর কী দিই না।
  summary_hi: उड़ान बाधित होने पर हम आपको क्या देते हैं, और क्या नहीं।
  summary_ur: پرواز میں خلل پڑنے پر ہم آپ کو کیا دیتے ہیں، اور کیا نہیں۔
  body_html_bn: <h2>আমাদের নিয়ন্ত্রণের মধ্যে</h2><p>যান্ত্রিক ত্রুটি, ক্রুর ঘাটতি বা সময়সূচির
    সিদ্ধান্ত। আমরা আপনাকে বিনা খরচে পরবর্তী উপলব্ধ পরিষেবায় পুনঃবুক করি, 2 ঘণ্টার বেশি বিলম্বে
    খাবার দিই, এবং রাত্রিযাপন অনিবার্য হলে ট্রান্সফারসহ হোটেল দিই।</p><h2>আমাদের নিয়ন্ত্রণের
    বাইরে</h2><p>আবহাওয়া, আগ্নেয়গিরির ছাই, বিমান চলাচল নিষেধাজ্ঞা, বিমানবন্দর বন্ধ, তৃতীয়
    পক্ষের ধর্মঘট, এবং কর্তৃপক্ষের নিরাপত্তা নির্দেশ। আমরা তবুও আপনাকে বিনা খরচে পুনঃবুক করি,
    এবং আপনি আর ভ্রমণ করতে না চাইলে রিফান্ড পাওয়া যায়, তবে খাবার ও থাকার ব্যবস্থা দেওয়া
    হয় না।</p><h2>যেভাবেই হোক</h2><p>আপনার চেকড ব্যাগ আপনি শেষ পর্যন্ত যে ফ্লাইটে যান তাতেই
    যায়, এবং আমাদের বিলম্বে মিস হওয়া সংযোগ পরিবর্তন ফি ছাড়া পুনঃবুক করা হয়।</p>
  body_html_hi: <h2>हमारे नियंत्रण में</h2><p>तकनीकी खराबी, क्रू की कमी या शेड्यूलिंग निर्णय।
    हम आपको बिना शुल्क अगली उपलब्ध सेवा पर पुनः बुक करते हैं, 2 घंटे से अधिक की देरी पर भोजन
    देते हैं, और रात्रि प्रवास अपरिहार्य होने पर ट्रांसफ़र सहित होटल देते हैं।</p><h2>हमारे
    नियंत्रण से बाहर</h2><p>मौसम, ज्वालामुखीय राख, हवाई यातायात प्रतिबंध, हवाई अड्डा बंद होना,
    तीसरे पक्ष की हड़ताल, और किसी प्राधिकरण के सुरक्षा निर्देश। हम फिर भी आपको बिना शुल्क
    पुनः बुक करते हैं, और यदि आप अब यात्रा नहीं करना चाहते तो रिफ़ंड उपलब्ध रहता है, लेकिन
    भोजन और आवास नहीं दिए जाते।</p><h2>दोनों स्थितियों में</h2><p>आपके चेक्ड बैग उसी उड़ान
    से जाते हैं जिस पर आप अंततः जाते हैं, और हमारी देरी के कारण छूटा कनेक्शन बिना परिवर्तन
    शुल्क के पुनः बुक किया जाता है।</p>
  body_html_ur: <h2>ہمارے اختیار میں</h2><p>تکنیکی خرابی، عملے کی کمی یا شیڈولنگ کا فیصلہ۔
    ہم آپ کو بلا معاوضہ اگلی دستیاب سروس پر دوبارہ بک کرتے ہیں، 2 گھنٹے سے زیادہ کی تاخیر
    پر کھانا دیتے ہیں، اور رات کا قیام ناگزیر ہونے پر ٹرانسفر سمیت ہوٹل دیتے ہیں۔</p><h2>ہمارے
    اختیار سے باہر</h2><p>موسم، آتش فشانی راکھ، فضائی ٹریفک کی پابندیاں، ہوائی اڈے کی بندش،
    تیسرے فریق کی ہڑتال، اور کسی اتھارٹی کی سیکیورٹی ہدایات۔ ہم پھر بھی آپ کو بلا معاوضہ دوبارہ
    بک کرتے ہیں، اور اگر آپ اب سفر نہیں کرنا چاہتے تو ریفنڈ دستیاب رہتا ہے، لیکن کھانا اور
    رہائش فراہم نہیں کی جاتی۔</p><h2>دونوں صورتوں میں</h2><p>آپ کے چیکڈ بیگ اسی پرواز سے سفر
    کرتے ہیں جس پر آپ بالآخر جاتے ہیں، اور ہماری تاخیر کی وجہ سے چھوٹا کنکشن بغیر تبدیلی فیس
    کے دوبارہ بک کیا جاتا ہے۔</p>
- slug: airport-arrival-times
  category: travel-info
  position: 14
  title_en: When to arrive at the airport
  title_am: ወደ አየር ማረፊያ መቼ መድረስ እንዳለብዎ
  summary_en: Recommended times, and the three deadlines that actually bind.
  summary_am: የሚመከሩ ጊዜያት፣ እና በእውነት የሚያስገድዱት ሦስት የጊዜ ገደቦች።
  body_html_en: <h2>Recommended</h2><p>Two hours before a domestic departure and three hours
    before an international one. Add an hour if you are checking sports equipment, travelling
    with an unaccompanied minor, or need a document check.</p><h2>The deadlines</h2><ul><li>Check-in
    closes 2 hours before departure, online and at the desk alike.</li><li>Bag drop closes
    60 minutes before departure.</li><li>The gate closes 20 minutes before departure, and
    a boarding pass does not hold it open.</li></ul>
  body_html_am: <h2>የሚመከር</h2><p>ከአገር ውስጥ መነሻ ሁለት ሰዓት በፊት፤ ከዓለም አቀፍ ደግሞ ሦስት ሰዓት በፊት። የስፖርት
    መሣሪያ የሚመዘግቡ ከሆነ፣ ከያለአጃቢ ሕፃን ጋር የሚጓዙ ከሆነ፣ ወይም የሰነድ ፍተሻ የሚያስፈልግዎት ከሆነ አንድ ሰዓት ይጨምሩ።</p><h2>የጊዜ
    ገደቦቹ</h2><ul><li>ቼክ-ኢን ከመነሻው 2 ሰዓት በፊት ይዘጋል፤ በመስመር ላይም ሆነ በጠረጴዛው።</li><li>የሻንጣ ማስረከቢያ
    ከመነሻው 60 ደቂቃ በፊት ይዘጋል።</li><li>በሩ ከመነሻው 20 ደቂቃ በፊት ይዘጋል፤ የመሳፈሪያ ፈቃድም ክፍት አያደርገውም።</li></ul>
  id: 47
  title_bn: বিমানবন্দরে কখন পৌঁছাবেন
  title_hi: हवाई अड्डे पर कब पहुँचें
  title_ur: ہوائی اڈے پر کب پہنچیں
  summary_bn: সুপারিশকৃত সময়, এবং যে তিনটি সময়সীমা সত্যিই বাধ্যতামূলক।
  summary_hi: अनुशंसित समय, और तीन समय-सीमाएँ जो वास्तव में बाध्यकारी हैं।
  summary_ur: تجویز کردہ اوقات، اور تین آخری حدیں جو واقعی لازم ہیں۔
  body_html_bn: <h2>সুপারিশকৃত</h2><p>অভ্যন্তরীণ প্রস্থানের দুই ঘণ্টা আগে এবং আন্তর্জাতিকের
    তিন ঘণ্টা আগে। ক্রীড়া সরঞ্জাম চেক করলে, সঙ্গীহীন নাবালকসহ ভ্রমণ করলে, বা নথি যাচাই প্রয়োজন
    হলে এক ঘণ্টা যোগ করুন।</p><h2>সময়সীমা</h2><ul><li>চেক-ইন প্রস্থানের 2 ঘণ্টা আগে বন্ধ
    হয়, অনলাইনে ও ডেস্কে একইভাবে।</li><li>ব্যাগ ড্রপ প্রস্থানের 60 মিনিট আগে বন্ধ হয়।</li><li>গেট
    প্রস্থানের 20 মিনিট আগে বন্ধ হয়, এবং বোর্ডিং পাস এটি খোলা রাখে না।</li></ul>
  body_html_hi: <h2>अनुशंसित</h2><p>घरेलू प्रस्थान से दो घंटे पहले और अंतरराष्ट्रीय से तीन
    घंटे पहले। यदि आप खेल उपकरण चेक कर रहे हैं, अकेले यात्रा कर रहे नाबालिग के साथ हैं, या
    दस्तावेज़ जाँच चाहिए, तो एक घंटा जोड़ें।</p><h2>समय-सीमाएँ</h2><ul><li>चेक-इन प्रस्थान
    से 2 घंटे पहले बंद होता है, ऑनलाइन और डेस्क पर समान रूप से।</li><li>बैग ड्रॉप प्रस्थान
    से 60 मिनट पहले बंद होता है।</li><li>गेट प्रस्थान से 20 मिनट पहले बंद होता है, और बोर्डिंग
    पास उसे खुला नहीं रखता।</li></ul>
  body_html_ur: <h2>تجویز کردہ</h2><p>ملکی روانگی سے دو گھنٹے پہلے اور بین الاقوامی سے تین
    گھنٹے پہلے۔ اگر آپ کھیلوں کا سامان چیک کر رہے ہیں، تنہا سفر کرنے والے نابالغ کے ساتھ ہیں،
    یا دستاویزی جانچ درکار ہے تو ایک گھنٹہ شامل کریں۔</p><h2>آخری حدیں</h2><ul><li>چیک اِن
    روانگی سے 2 گھنٹے پہلے بند ہوتا ہے، آن لائن اور ڈیسک پر یکساں۔</li><li>بیگ ڈراپ روانگی
    سے 60 منٹ پہلے بند ہوتا ہے۔</li><li>گیٹ روانگی سے 20 منٹ پہلے بند ہوتا ہے، اور بورڈنگ
    پاس اسے کھلا نہیں رکھتا۔</li></ul>
- slug: vaccinations
  category: health
  position: 10
  title_en: Vaccinations and health certificates
  title_am: ክትባቶችና የጤና ምስክር ወረቀቶች
  summary_en: Which certificates are checked, and who decides.
  summary_am: የትኞቹ ምስክር ወረቀቶች እንደሚፈተሹ፣ እና ማን እንደሚወስን።
  body_html_en: <h2>Yellow fever</h2><p>A yellow fever certificate is required by many countries
    when you arrive from, or have transited, a country where the disease is present. It becomes
    valid 10 days after vaccination, so a certificate dated within 10 days of arrival is refused.</p><h2>Who
    decides</h2><p>The destination government, not us. We check that you hold what your destination
    requires, and we are obliged to refuse carriage if you do not -- but the requirement itself
    is theirs, and it changes. Confirm with the embassy before you travel.</p>
  body_html_am: <h2>ቢጫ ወባ</h2><p>በሽታው ካለበት አገር ሲመጡ ወይም በእሱ ሲሸጋገሩ ብዙ አገሮች የቢጫ ወባ ምስክር ወረቀት
    ይጠይቃሉ። ከክትባቱ 10 ቀናት በኋላ ሥራ ላይ ይውላል፤ ስለዚህ ከመድረሻ በ10 ቀናት ውስጥ የተጻፈ ምስክር ወረቀት አይቀበልም።</p><h2>ማን
    እንደሚወስን</h2><p>የመድረሻው መንግሥት እንጂ እኛ አይደለንም። መድረሻዎ የሚጠይቀውን መያዝዎን እናረጋግጣለን፤ ካልያዙም ማጓጓዝን የመከልከል
    ግዴታ አለብን። መስፈርቱ ራሱ ግን የእነሱ ነው፤ እንዲሁም ይለወጣል። ከመጓዝዎ በፊት ከኤምባሲው ያረጋግጡ።</p>
  id: 48
  title_bn: টিকা ও স্বাস্থ্য সনদ
  title_hi: टीकाकरण और स्वास्थ्य प्रमाणपत्र
  title_ur: ویکسینیشن اور صحت کے سرٹیفکیٹ
  summary_bn: কোন সনদ যাচাই করা হয়, এবং কে সিদ্ধান্ত নেয়।
  summary_hi: कौन से प्रमाणपत्र जाँचे जाते हैं, और कौन तय करता है।
  summary_ur: کون سے سرٹیفکیٹ جانچے جاتے ہیں، اور کون فیصلہ کرتا ہے۔
  body_html_bn: <h2>ইয়েলো ফিভার</h2><p>রোগটি আছে এমন দেশ থেকে এলে বা তার মধ্য দিয়ে ট্রানজিট
    করলে অনেক দেশে ইয়েলো ফিভার সনদ প্রয়োজন। এটি টিকার 10 দিন পরে বৈধ হয়, তাই আগমনের 10
    দিনের মধ্যে তারিখযুক্ত সনদ প্রত্যাখ্যাত হয়।</p><h2>কে সিদ্ধান্ত নেয়</h2><p>গন্তব্যের
    সরকার, আমরা নই। আপনার গন্তব্যের প্রয়োজনীয় জিনিস আপনার কাছে আছে কি না আমরা যাচাই করি,
    এবং না থাকলে বহন প্রত্যাখ্যান করতে বাধ্য -- কিন্তু শর্তটি তাদের, এবং তা বদলায়। ভ্রমণের
    আগে দূতাবাসে নিশ্চিত করুন।</p>
  body_html_hi: <h2>पीत ज्वर</h2><p>जब आप उस देश से आते हैं, या उससे होकर ट्रांज़िट करते हैं,
    जहाँ यह रोग मौजूद है, तो कई देशों में पीत ज्वर प्रमाणपत्र आवश्यक है। यह टीकाकरण के 10
    दिन बाद वैध होता है, इसलिए आगमन के 10 दिनों के भीतर की तिथि वाला प्रमाणपत्र अस्वीकार किया
    जाता है।</p><h2>कौन तय करता है</h2><p>गंतव्य की सरकार, हम नहीं। हम जाँचते हैं कि आपके
    पास वह है जो आपका गंतव्य माँगता है, और यदि नहीं है तो हमें यात्रा से इनकार करना अनिवार्य
    है -- लेकिन आवश्यकता उनकी है, और वह बदलती रहती है। यात्रा से पहले दूतावास से पुष्टि करें।</p>
  body_html_ur: <h2>زرد بخار</h2><p>جب آپ ایسے ملک سے آتے ہیں، یا اس سے ٹرانزٹ کرتے ہیں، جہاں
    یہ بیماری موجود ہے، تو کئی ممالک میں زرد بخار کا سرٹیفکیٹ درکار ہے۔ یہ ویکسینیشن کے 10
    دن بعد کارآمد ہوتا ہے، اس لیے آمد کے 10 دنوں کے اندر کی تاریخ والا سرٹیفکیٹ مسترد کیا
    جاتا ہے۔</p><h2>کون فیصلہ کرتا ہے</h2><p>منزل کی حکومت، ہم نہیں۔ ہم جانچتے ہیں کہ آپ کے
    پاس وہ ہے جو آپ کی منزل چاہتی ہے، اور اگر نہیں ہے تو ہمیں سفر سے انکار کرنا لازم ہے --
    لیکن تقاضا ان کا ہے، اور وہ بدلتا رہتا ہے۔ سفر سے پہلے سفارت خانے سے تصدیق کریں۔</p>
- slug: cabin-comfort-health
