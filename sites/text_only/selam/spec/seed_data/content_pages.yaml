  title_en: Ways to pay
  title_am: የመክፈያ መንገዶች
  summary_en: Cards, bank transfer, vouchers and miles, and when each is available.
  summary_am: ካርዶች፣ የባንክ ዝውውር፣ ቫውቸሮችና ማይሎች፣ እንዲሁም እያንዳንዱ የሚገኝበት ጊዜ።
  body_html_en: <h2>Accepted methods</h2><ul><li>Major credit and debit cards, in USD.</li><li>Bank
    transfer, for bookings made more than 14 days before departure. The booking is held for
    72 hours while the transfer clears.</li><li>Gift vouchers, in part or in full, against
    the base fare.</li><li>Selam Miles, for award tickets and for upgrades.</li></ul><h2>What
    we do not accept</h2><p>Cash at the airport for a web booking, cheques, and payment by
    a third party whose name is not on the booking. Taxes and carrier charges cannot be paid
    in vouchers.</p>
  body_html_am: <h2>ተቀባይነት ያላቸው መንገዶች</h2><ul><li>ዋና ዋና የክሬዲትና የዴቢት ካርዶች፣ በUSD።</li><li>የባንክ
    ዝውውር፣ ከመነሻው ከ14 ቀን በላይ አስቀድመው ለሚያዙ ቦታዎች። ዝውውሩ እስኪጠናቀቅ የቦታ ማስያዣው ለ72 ሰዓት ይያዛል።</li><li>የስጦታ
    ቫውቸሮች፣ በከፊል ወይም በሙሉ፣ በመሠረታዊ ታሪፉ ላይ።</li><li>ሰላም ማይልስ፣ ለሽልማት ትኬቶችና ለማሻሻያዎች።</li></ul><h2>የማንቀበለው</h2><p>በድረ
    ገጽ ለተያዘ ቦታ በአየር ማረፊያ ጥሬ ገንዘብ፣ ቼኮች፣ እንዲሁም ስሙ በቦታ ማስያዣው ላይ ባልሆነ ሦስተኛ ወገን ክፍያ። ግብሮችና የአጓጓዥ
    ክፍያዎች በቫውቸር ሊከፈሉ አይችሉም።</p>
  id: 30
  title_bn: পরিশোধের উপায়
  title_hi: भुगतान के तरीके
  title_ur: ادائیگی کے طریقے
  summary_bn: কার্ড, ব্যাংক ট্রান্সফার, ভাউচার ও মাইল, এবং কখন কোনটি পাওয়া যায়।
  summary_hi: कार्ड, बैंक ट्रांसफ़र, वाउचर और मील, और प्रत्येक कब उपलब्ध है।
  summary_ur: کارڈ، بینک ٹرانسفر، واؤچر اور میلز، اور ہر ایک کب دستیاب ہے۔
  body_html_bn: <h2>গৃহীত পদ্ধতি</h2><ul><li>প্রধান ক্রেডিট ও ডেবিট কার্ড, USD-তে।</li><li>ব্যাংক
    ট্রান্সফার, প্রস্থানের 14 দিনের বেশি আগে করা বুকিংয়ের জন্য। ট্রান্সফার ক্লিয়ার হওয়ার
    সময় বুকিং 72 ঘণ্টা ধরে রাখা হয়।</li><li>গিফট ভাউচার, আংশিক বা সম্পূর্ণ, মূল ভাড়ার বিপরীতে।</li><li>সেলাম
    মাইলস, অ্যাওয়ার্ড টিকিট ও আপগ্রেডের জন্য।</li></ul><h2>আমরা যা গ্রহণ করি না</h2><p>ওয়েব
    বুকিংয়ের জন্য বিমানবন্দরে নগদ, চেক, এবং বুকিংয়ে নাম নেই এমন তৃতীয় পক্ষের পরিশোধ। কর
    ও ক্যারিয়ার চার্জ ভাউচারে পরিশোধ করা যায় না।</p>
  body_html_hi: <h2>स्वीकृत तरीके</h2><ul><li>प्रमुख क्रेडिट और डेबिट कार्ड, USD में।</li><li>बैंक
    ट्रांसफ़र, प्रस्थान से 14 दिन से अधिक पहले की गई बुकिंग के लिए। ट्रांसफ़र क्लियर होने
    तक बुकिंग 72 घंटे रोकी रहती है।</li><li>गिफ़्ट वाउचर, आंशिक या पूर्ण, मूल किराए के विरुद्ध।</li><li>सेलाम
    माइल्स, अवार्ड टिकट और अपग्रेड के लिए।</li></ul><h2>जो हम स्वीकार नहीं करते</h2><p>वेब
    बुकिंग के लिए हवाई अड्डे पर नकद, चेक, और ऐसे तीसरे पक्ष द्वारा भुगतान जिसका नाम बुकिंग
    में नहीं है। कर और कैरियर शुल्क वाउचर से नहीं चुकाए जा सकते।</p>
  body_html_ur: <h2>قبول شدہ طریقے</h2><ul><li>بڑے کریڈٹ اور ڈیبٹ کارڈ، USD میں۔</li><li>بینک
    ٹرانسفر، روانگی سے 14 دن سے زیادہ پہلے کی گئی بکنگز کے لیے۔ ٹرانسفر کلیئر ہونے تک بکنگ
    72 گھنٹے روکی رہتی ہے۔</li><li>گفٹ واؤچر، جزوی یا مکمل، بنیادی کرائے کے مقابل۔</li><li>سلام
    مائلز، ایوارڈ ٹکٹوں اور اپ گریڈز کے لیے۔</li></ul><h2>جو ہم قبول نہیں کرتے</h2><p>ویب
    بکنگ کے لیے ہوائی اڈے پر نقد، چیک، اور ایسے تیسرے فریق کی ادائیگی جس کا نام بکنگ پر نہیں
    ہے۔ ٹیکس اور کیریئر چارجز واؤچر سے ادا نہیں کیے جا سکتے۔</p>
- slug: online-checkin-guide
  category: booking-help
  position: 14
  title_en: How online check-in works
  title_am: የመስመር ላይ ቼክ-ኢን እንዴት እንደሚሠራ
  summary_en: The window, what you need, and the eight reasons it can refuse you.
  summary_am: የሚከፈትበት ጊዜ፣ የሚያስፈልግዎት፣ እንዲሁም ሊከለክልዎት የሚችልባቸው ስምንት ምክንያቶች።
  body_html_en: '<h2>The window</h2><p>Check-in opens 48 hours before departure and closes
    2 hours before. Outside that window the page will tell you which of the two applies; it
    does not queue your request for later.</p><h2>When it will refuse</h2><p>Eight conditions
    stop online check-in, and each shows its own message rather than a generic failure: too
    early, closed, an infant on a lap, special assistance booked, an unaccompanied minor,
    a document check we must do in person, a flight operated by a partner airline, and a group
    booking.</p><p>In every one of those cases you check in at the airport instead, and the
    desk closes at the same time as online check-in.</p>'
  body_html_am: <h2>የሚከፈትበት ጊዜ</h2><p>ቼክ-ኢን ከመነሻው 48 ሰዓት በፊት ይከፈታል፤ 2 ሰዓት በፊትም ይዘጋል። ከዚያ ጊዜ
    ውጭ ገጹ ከሁለቱ የትኛው እንደሚሠራ ይነግርዎታል፤ ጥያቄዎን ለኋላ አያስቀምጥም።</p><h2>የሚከለክልበት ጊዜ</h2><p>ስምንት ሁኔታዎች
    የመስመር ላይ ቼክ-ኢንን ያስቆማሉ፤ እያንዳንዱም አጠቃላይ የስህተት መልእክት ሳይሆን የራሱን መልእክት ያሳያል፦ በጣም ገና፣ ተዘግቷል፣
    በጭን ላይ ያለ ጨቅላ፣ የተያዘ ልዩ እገዛ፣ ያለአጃቢ ሕፃን፣ በአካል ልናደርገው የሚገባ የሰነድ ፍተሻ፣ በአጋር አየር መንገድ የሚከናወን
    በረራ፣ እንዲሁም የቡድን ቦታ ማስያዣ።</p><p>በእያንዳንዱ በእነዚያ ሁኔታዎች በምትኩ በአየር ማረፊያ ቼክ-ኢን ያደርጋሉ፤ ጠረጴዛውም
    ከመስመር ላይ ቼክ-ኢን ጋር በተመሳሳይ ሰዓት ይዘጋል።</p>
  id: 31
  title_bn: অনলাইন চেক-ইন কীভাবে কাজ করে
  title_hi: ऑनलाइन चेक-इन कैसे काम करता है
  title_ur: آن لائن چیک اِن کیسے کام کرتا ہے
  summary_bn: সময়সীমা, আপনার কী প্রয়োজন, এবং যে আটটি কারণে এটি আপনাকে প্রত্যাখ্যান করতে
    পারে।
  summary_hi: समय-सीमा, आपको क्या चाहिए, और आठ कारण जिनसे यह आपको मना कर सकता है।
  summary_ur: وقت کی حد، آپ کو کیا درکار ہے، اور آٹھ وجوہات جن سے یہ آپ کو مسترد کر سکتا ہے۔
  body_html_bn: '<h2>সময়সীমা</h2><p>চেক-ইন প্রস্থানের 48 ঘণ্টা আগে খোলে এবং 2 ঘণ্টা আগে বন্ধ
    হয়। সেই সময়সীমার বাইরে পৃষ্ঠাটি জানাবে দুটির কোনটি প্রযোজ্য; এটি আপনার অনুরোধ পরে করার
    জন্য সারিতে রাখে না।</p><h2>কখন এটি প্রত্যাখ্যান করবে</h2><p>আটটি শর্ত অনলাইন চেক-ইন থামায়,
    এবং প্রতিটি সাধারণ ব্যর্থতার বদলে নিজস্ব বার্তা দেখায়: খুব আগে, বন্ধ, কোলে নবজাতক, বুক
    করা বিশেষ সহায়তা, সঙ্গীহীন নাবালক, আমাদের সরাসরি করতে হওয়া নথি যাচাই, পার্টনার এয়ারলাইন-পরিচালিত
    ফ্লাইট, এবং গ্রুপ বুকিং।</p><p>এই প্রতিটি ক্ষেত্রে আপনি বদলে বিমানবন্দরে চেক-ইন করেন,
    এবং ডেস্ক অনলাইন চেক-ইনের একই সময়ে বন্ধ হয়।</p>'
  body_html_hi: '<h2>समय-सीमा</h2><p>चेक-इन प्रस्थान से 48 घंटे पहले खुलता है और 2 घंटे पहले
    बंद होता है। उस समय-सीमा के बाहर पृष्ठ आपको बताएगा कि दोनों में से कौन सा लागू है; यह
    आपके अनुरोध को बाद के लिए कतार में नहीं रखता।</p><h2>यह कब मना करेगा</h2><p>आठ स्थितियाँ
    ऑनलाइन चेक-इन रोकती हैं, और प्रत्येक सामान्य विफलता के बजाय अपना संदेश दिखाती है: बहुत
    जल्दी, बंद, गोद में शिशु, बुक की गई विशेष सहायता, अकेले यात्रा कर रहा नाबालिग, दस्तावेज़
    जाँच जो हमें व्यक्तिगत रूप से करनी होगी, पार्टनर एयरलाइन द्वारा संचालित उड़ान, और समूह
    बुकिंग।</p><p>इन सभी मामलों में आप इसके बजाय हवाई अड्डे पर चेक-इन करते हैं, और डेस्क ऑनलाइन
    चेक-इन के समय ही बंद होता है।</p>'
  body_html_ur: '<h2>وقت کی حد</h2><p>چیک اِن روانگی سے 48 گھنٹے پہلے کھلتا ہے اور 2 گھنٹے
    پہلے بند ہوتا ہے۔ اس حد کے باہر صفحہ آپ کو بتائے گا کہ دونوں میں سے کون سا لاگو ہے؛ یہ
    آپ کی درخواست کو بعد کے لیے قطار میں نہیں رکھتا۔</p><h2>یہ کب انکار کرے گا</h2><p>آٹھ
    حالتیں آن لائن چیک اِن روکتی ہیں، اور ہر ایک عام ناکامی کے بجائے اپنا پیغام دکھاتی ہے:
    بہت جلد، بند، گود میں شیرخوار، بک شدہ خصوصی معاونت، تنہا سفر کرنے والا نابالغ، دستاویزی
    جانچ جو ہمیں بذاتِ خود کرنی ہوگی، پارٹنر ایئرلائن کی چلائی گئی پرواز، اور گروپ بکنگ۔</p><p>ان
    تمام صورتوں میں آپ اس کے بجائے ہوائی اڈے پر چیک اِن کرتے ہیں، اور ڈیسک آن لائن چیک اِن
    کے وقت ہی بند ہوتا ہے۔</p>'
- slug: seat-choice-explained
  category: booking-help
  position: 15
  title_en: What the seat markings mean
  title_am: የመቀመጫ ምልክቶች ትርጉም
  summary_en: Window, aisle, bulkhead, exit row and bassinet, and who may sit where.
  summary_am: መስኮት፣ መተላለፊያ፣ የፊት ግድግዳ፣ የመውጫ ረድፍና የሕፃን አልጋ፣ እንዲሁም ማን የት መቀመጥ እንደሚችል።
  body_html_en: '<h2>The markings</h2><ul><li>Window: against the cabin wall, with no direct
    access to the aisle.</li><li>Aisle: beside the aisle, the easiest seat to leave the row
    from.</li><li>Bulkhead: the first row of a cabin. More legroom, but nothing in front to
    store a bag under, so everything goes in the overhead locker for take-off.</li><li>Exit
    row: extra legroom, and a duty to help the crew in an evacuation.</li><li>Bassinet: a
    bassinet can be fitted, so these are held for passengers with an infant.</li></ul><h2>Who
    may not sit in an exit row</h2><p>Passengers under 15, passengers travelling with an infant,
    passengers who need an extension seatbelt, and anyone who would find it hard to operate
    a heavy door. Cabin crew reseat anyone who does not qualify, and the seat charge is refunded.</p>'
  body_html_am: <h2>ምልክቶቹ</h2><ul><li>መስኮት፦ ከካቢን ግድግዳ ጋር፣ ወደ መተላለፊያ ቀጥታ መድረሻ የለውም።</li><li>መተላለፊያ፦
    ከመተላለፊያው አጠገብ፤ ከረድፉ ለመውጣት ቀላሉ መቀመጫ።</li><li>የፊት ግድግዳ፦ የካቢን የመጀመሪያ ረድፍ። ተጨማሪ የእግር ቦታ አለው፤
    ግን ከፊት ሻንጣ ማስቀመጫ ስለሌለ ለመነሳት ሁሉም ነገር ወደ ላይኛው ማስቀመጫ ይሄዳል።</li><li>የመውጫ ረድፍ፦ ተጨማሪ የእግር ቦታ፤
    እንዲሁም በመልቀቅ ጊዜ ሠራተኞችን የመርዳት ግዴታ።</li><li>የሕፃን አልጋ፦ የሕፃን አልጋ ሊገጠም ስለሚችል እነዚህ ጨቅላ ላላቸው ተሳፋሪዎች
    ይያዛሉ።</li></ul><h2>በመውጫ ረድፍ መቀመጥ የማይችለው</h2><p>ከ15 ዓመት በታች ያሉ ተሳፋሪዎች፣ ከጨቅላ ጋር የሚጓዙ ተሳፋሪዎች፣
    ተጨማሪ የመቀመጫ ቀበቶ የሚያስፈልጋቸው ተሳፋሪዎች፣ እንዲሁም ከባድ በር ማንቀሳቀስ የሚከብደው ማንኛውም ሰው። የካቢን ሠራተኞች ብቁ ያልሆነውን
    ማንኛውንም ሰው ያዛውራሉ፤ የመቀመጫው ክፍያም ተመላሽ ይደረጋል።</p>
  id: 32
  title_bn: আসনের চিহ্নের অর্থ
  title_hi: सीट के चिह्नों का अर्थ
  title_ur: سیٹ کے نشانات کا مطلب
  summary_bn: জানালা, আইল, বাল্কহেড, এক্সিট রো ও ব্যাসিনেট, এবং কে কোথায় বসতে পারে।
  summary_hi: खिड़की, आइल, बल्कहेड, एग्ज़िट रो और बैसिनेट, और कौन कहाँ बैठ सकता है।
  summary_ur: کھڑکی، آئل، بلک ہیڈ، ایگزٹ رو اور بیسینیٹ، اور کون کہاں بیٹھ سکتا ہے۔
  body_html_bn: '<h2>চিহ্নগুলি</h2><ul><li>জানালা: কেবিনের দেয়ালের পাশে, আইলে সরাসরি প্রবেশ
    নেই।</li><li>আইল: আইলের পাশে, সারি থেকে বেরোনোর সবচেয়ে সহজ আসন।</li><li>বাল্কহেড: কেবিনের
    প্রথম সারি। পায়ের বেশি জায়গা, কিন্তু সামনে ব্যাগ রাখার কিছু নেই, তাই উড্ডয়নের জন্য
    সবকিছু ওভারহেড লকারে যায়।</li><li>এক্সিট রো: পায়ের অতিরিক্ত জায়গা, এবং জরুরি নির্গমনে
    ক্রুকে সাহায্য করার দায়িত্ব।</li><li>ব্যাসিনেট: একটি ব্যাসিনেট লাগানো যায়, তাই এগুলি
    নবজাতকসহ যাত্রীদের জন্য রাখা হয়।</li></ul><h2>কে এক্সিট রো-তে বসতে পারে না</h2><p>15
    বছরের কম বয়সী যাত্রী, নবজাতকসহ ভ্রমণকারী যাত্রী, এক্সটেনশন সিটবেল্ট প্রয়োজন এমন যাত্রী,
    এবং ভারী দরজা চালাতে যাঁর অসুবিধা হবে এমন যে কেউ। যোগ্য নন এমন যে কাউকে কেবিন ক্রু অন্য
    আসনে বসান, এবং আসনের চার্জ ফেরত দেওয়া হয়।</p>'
  body_html_hi: '<h2>चिह्न</h2><ul><li>खिड़की: केबिन की दीवार से सटी, आइल तक सीधी पहुँच नहीं।</li><li>आइल:
    आइल के बगल में, पंक्ति से निकलने के लिए सबसे आसान सीट।</li><li>बल्कहेड: केबिन की पहली
    पंक्ति। ज़्यादा लेगरूम, लेकिन सामने बैग रखने की जगह नहीं, इसलिए टेक-ऑफ़ के लिए सब कुछ
    ओवरहेड लॉकर में जाता है।</li><li>एग्ज़िट रो: अतिरिक्त लेगरूम, और निकासी में क्रू की मदद
    करने का दायित्व।</li><li>बैसिनेट: बैसिनेट लगाया जा सकता है, इसलिए ये शिशु वाले यात्रियों
    के लिए रखी जाती हैं।</li></ul><h2>एग्ज़िट रो में कौन नहीं बैठ सकता</h2><p>15 वर्ष से कम
    आयु के यात्री, शिशु के साथ यात्रा कर रहे यात्री, जिन्हें एक्सटेंशन सीटबेल्ट चाहिए, और
    कोई भी जिसे भारी दरवाज़ा चलाना कठिन लगे। केबिन क्रू अयोग्य व्यक्ति को दूसरी सीट पर बैठाते
    हैं, और सीट शुल्क रिफ़ंड किया जाता है।</p>'
  body_html_ur: '<h2>نشانات</h2><ul><li>کھڑکی: کیبن کی دیوار سے ملحق، آئل تک براہِ راست رسائی
    نہیں۔</li><li>آئل: آئل کے ساتھ، قطار سے نکلنے کے لیے سب سے آسان سیٹ۔</li><li>بلک ہیڈ:
    کیبن کی پہلی قطار۔ زیادہ لیگ روم، لیکن سامنے بیگ رکھنے کی جگہ نہیں، اس لیے ٹیک آف کے لیے
    سب کچھ اوور ہیڈ لاکر میں جاتا ہے۔</li><li>ایگزٹ رو: اضافی لیگ روم، اور انخلا میں عملے
    کی مدد کرنے کا فرض۔</li><li>بیسینیٹ: بیسینیٹ لگایا جا سکتا ہے، اس لیے یہ شیرخوار والے
    مسافروں کے لیے رکھی جاتی ہیں۔</li></ul><h2>ایگزٹ رو میں کون نہیں بیٹھ سکتا</h2><p>15 سال
    سے کم عمر مسافر، شیرخوار کے ساتھ سفر کرنے والے مسافر، جنہیں ایکسٹینشن سیٹ بیلٹ درکار ہو،
    اور کوئی بھی جسے بھاری دروازہ چلانا مشکل لگے۔ کیبن عملہ نااہل شخص کو دوسری سیٹ پر بٹھاتا
    ہے، اور سیٹ چارج ریفنڈ کیا جاتا ہے۔</p>'
- slug: waitlist-and-standby
  category: booking-help
  position: 16
  title_en: Waitlists and standby
  title_am: የመጠባበቂያ ዝርዝርና ተጠባባቂ
  summary_en: How a waitlist clears, and how standby differs from it.
  summary_am: የመጠባበቂያ ዝርዝር እንዴት እንደሚጸዳ፣ እንዲሁም ተጠባባቂ ከእሱ በምን እንደሚለይ።
  body_html_en: '<h2>Waitlist</h2><p>A waitlist holds you for a fare class that is sold out
    on a flight you have already booked. It clears in the order requests were received, and
    it clears automatically -- you are emailed and the booking updates itself. Waitlists close
    24 hours before departure.</p><h2>Standby</h2><p>Standby moves you to an earlier or later
    flight on the same day, at the airport, if a seat is free at the gate. It is not a waitlist
    and it is not free: same-day standby carries a flat charge, and it opens 24 hours before
    departure.</p>'
  body_html_am: <h2>የመጠባበቂያ ዝርዝር</h2><p>የመጠባበቂያ ዝርዝር አስቀድመው በያዙት በረራ ላይ ለተሸጠ የታሪፍ ክፍል ይይዝዎታል።
    ጥያቄዎች በደረሱበት ቅደም ተከተል ይጸዳል፤ በራሱም ይጸዳል -- በኢሜይል ይነገርዎታል፤ የቦታ ማስያዣውም ራሱን ያዘምናል። የመጠባበቂያ
    ዝርዝሮች ከመነሻው 24 ሰዓት በፊት ይዘጋሉ።</p><h2>ተጠባባቂ</h2><p>ተጠባባቂ በበሩ ላይ መቀመጫ ካለ በአየር ማረፊያ በተመሳሳይ
    ቀን ወደ ቀደመ ወይም ወደ ዘገየ በረራ ያዛውርዎታል። የመጠባበቂያ ዝርዝር አይደለም፤ ነጻም አይደለም፦ የዕለቱ ተጠባባቂ ቋሚ ክፍያ አለው፤
    ከመነሻውም 24 ሰዓት በፊት ይከፈታል።</p>
  id: 33
  title_bn: ওয়েটলিস্ট ও স্ট্যান্ডবাই
  title_hi: वेटलिस्ट और स्टैंडबाय
  title_ur: ویٹ لسٹ اور اسٹینڈ بائی
  summary_bn: ওয়েটলিস্ট কীভাবে ক্লিয়ার হয়, এবং স্ট্যান্ডবাই এর থেকে কীভাবে আলাদা।
  summary_hi: वेटलिस्ट कैसे क्लियर होती है, और स्टैंडबाय उससे कैसे अलग है।
  summary_ur: ویٹ لسٹ کیسے کلیئر ہوتی ہے، اور اسٹینڈ بائی اس سے کیسے مختلف ہے۔
  body_html_bn: '<h2>ওয়েটলিস্ট</h2><p>ওয়েটলিস্ট আপনার ইতিমধ্যে বুক করা ফ্লাইটে বিক্রি হয়ে
    যাওয়া একটি ফেয়ার ক্লাসের জন্য আপনাকে ধরে রাখে। এটি অনুরোধ পাওয়ার ক্রমে ক্লিয়ার হয়,
    এবং স্বয়ংক্রিয়ভাবে ক্লিয়ার হয় -- আপনাকে ইমেইল করা হয় এবং বুকিং নিজেই হালনাগাদ হয়।
    ওয়েটলিস্ট প্রস্থানের 24 ঘণ্টা আগে বন্ধ হয়।</p><h2>স্ট্যান্ডবাই</h2><p>স্ট্যান্ডবাই আপনাকে
    একই দিনের আগের বা পরের ফ্লাইটে নিয়ে যায়, বিমানবন্দরে, গেটে আসন খালি থাকলে। এটি ওয়েটলিস্ট
    নয় এবং বিনামূল্যে নয়: একই দিনের স্ট্যান্ডবাইয়ে একটি নির্দিষ্ট চার্জ আছে, এবং এটি প্রস্থানের
    24 ঘণ্টা আগে খোলে।</p>'
  body_html_hi: '<h2>वेटलिस्ट</h2><p>वेटलिस्ट आपको उस उड़ान पर बिक चुकी फ़ेयर क्लास के लिए
    रोके रखती है जो आपने पहले ही बुक की है। यह अनुरोध प्राप्त होने के क्रम में क्लियर होती
    है, और स्वतः क्लियर होती है -- आपको ईमेल किया जाता है और बुकिंग स्वयं अपडेट हो जाती है।
    वेटलिस्ट प्रस्थान से 24 घंटे पहले बंद होती हैं।</p><h2>स्टैंडबाय</h2><p>स्टैंडबाय आपको
    उसी दिन की पहले या बाद की उड़ान पर ले जाता है, हवाई अड्डे पर, यदि गेट पर सीट खाली हो।
    यह वेटलिस्ट नहीं है और निःशुल्क नहीं है: उसी दिन के स्टैंडबाय पर एक निश्चित शुल्क है,
    और यह प्रस्थान से 24 घंटे पहले खुलता है।</p>'
  body_html_ur: '<h2>ویٹ لسٹ</h2><p>ویٹ لسٹ آپ کو اس پرواز پر بک چکی فیئر کلاس کے لیے روکے
    رکھتی ہے جو آپ نے پہلے ہی بک کی ہے۔ یہ درخواستیں موصول ہونے کی ترتیب سے کلیئر ہوتی ہے،
    اور خود بخود کلیئر ہوتی ہے -- آپ کو ای میل کی جاتی ہے اور بکنگ خود اپ ڈیٹ ہو جاتی ہے۔
    ویٹ لسٹیں روانگی سے 24 گھنٹے پہلے بند ہو جاتی ہیں۔</p><h2>اسٹینڈ بائی</h2><p>اسٹینڈ بائی
    آپ کو اسی دن کی پہلے یا بعد کی پرواز پر لے جاتا ہے، ہوائی اڈے پر، اگر گیٹ پر سیٹ خالی
    ہو۔ یہ ویٹ لسٹ نہیں ہے اور مفت نہیں ہے: اسی دن کے اسٹینڈ بائی پر ایک مقررہ چارج ہے، اور
    یہ روانگی سے 24 گھنٹے پہلے کھلتا ہے۔</p>'
