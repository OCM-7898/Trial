  title_en: Transit and visas
  title_am: መሸጋገሪያና ቪዛዎች
  summary_en: When a transit passenger needs a visa, and when they do not.
  summary_am: የመሸጋገሪያ ተሳፋሪ ቪዛ የሚያስፈልገው መቼ እንደሆነ፣ እና የማያስፈልገው መቼ እንደሆነ።
  body_html_en: <h2>Airside transit</h2><p>A passenger connecting within the same terminal
    on a single booking generally does not need a transit visa. A visa is needed where the
    connection requires leaving the transit area, where baggage must be reclaimed and re-checked,
    or where the layover is long enough that you intend to leave the airport.</p>
  body_html_am: <h2>በአየር ማረፊያ ውስጥ መሸጋገር</h2><p>በአንድ የቦታ ማስያዣ በተመሳሳይ ተርሚናል ውስጥ የሚሸጋገር ተሳፋሪ
    በአጠቃላይ የመሸጋገሪያ ቪዛ አያስፈልገውም። ቪዛ የሚያስፈልገው መሸጋገሪያው የመሸጋገሪያ ቀጠናውን መልቀቅ ሲጠይቅ፣ ሻንጣ ተመልሶ ተወስዶ
    እንደገና መመዝገብ ሲኖርበት፣ ወይም የማቆያ ጊዜው አየር ማረፊያውን ለመልቀቅ የሚያስብ ያህል ረጅም ሲሆን ነው።</p>
  id: 20
  title_bn: ট্রানজিট ও ভিসা
