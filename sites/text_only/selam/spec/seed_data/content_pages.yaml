  title_en: Booking for someone else
  title_am: ለሌላ ሰው ቦታ መያዝ
  summary_en: Whose details go where, and who can then manage the booking.
  summary_am: የማን መረጃ የት እንደሚገባ፣ እና ከዚያ በኋላ የቦታ ማስያዣውን ማን ማስተዳደር እንደሚችል።
  body_html_en: <h2>Passenger details and contact details are different</h2><p>Passenger names
    must match each traveller&#x27;s passport exactly. The contact email and telephone can
    be yours, and that is where every notice about the flight is sent.</p><h2>Who can manage
    it afterwards</h2><p>Anyone holding the booking reference and the lead passenger&#x27;s
    surname. There is no password on a booking, so treat the reference as you would a ticket.</p>
  body_html_am: <h2>የተሳፋሪ መረጃና የመገናኛ መረጃ የተለያዩ ናቸው</h2><p>የተሳፋሪ ስሞች ከእያንዳንዱ ተጓዥ ፓስፖርት ጋር በትክክል
    መዛመድ አለባቸው። የመገናኛ ኢሜይልና ስልክ ግን የእርስዎ ሊሆኑ ይችላሉ፤ ስለ በረራው የሚሰጠው እያንዳንዱ ማሳወቂያም ወደዚያ ይላካል።</p><h2>ከዚያ
    በኋላ ማን ማስተዳደር እንደሚችል</h2><p>የቦታ ማስያዣ ማጣቀሻውንና የዋናውን ተሳፋሪ የአያት ስም የያዘ ማንኛውም ሰው። በቦታ ማስያዣ
    ላይ የይለፍ ቃል የለም፤ ስለዚህ ማጣቀሻውን እንደ ትኬት ይያዙት።</p>
  id: 34
  title_bn: অন্যের জন্য বুকিং
  title_hi: किसी और के लिए बुकिंग
  title_ur: کسی اور کے لیے بکنگ
  summary_bn: কার তথ্য কোথায় যায়, এবং পরে কে বুকিং পরিচালনা করতে পারে।
  summary_hi: किसका विवरण कहाँ जाता है, और बाद में बुकिंग कौन प्रबंधित कर सकता है।
  summary_ur: کس کی تفصیلات کہاں جاتی ہیں، اور بعد میں بکنگ کون سنبھال سکتا ہے۔
  body_html_bn: <h2>যাত্রীর তথ্য ও যোগাযোগের তথ্য আলাদা</h2><p>যাত্রীর নাম প্রতিটি ভ্রমণকারীর
    পাসপোর্টের সঙ্গে হুবহু মিলতে হবে। যোগাযোগের ইমেইল ও টেলিফোন আপনার হতে পারে, এবং ফ্লাইট
    সম্পর্কিত প্রতিটি নোটিশ সেখানেই পাঠানো হয়।</p><h2>পরে কে এটি পরিচালনা করতে পারে</h2><p>বুকিং
    রেফারেন্স ও প্রধান যাত্রীর পদবি যাঁর কাছে আছে এমন যে কেউ। বুকিংয়ে কোনো পাসওয়ার্ড নেই,
    তাই রেফারেন্সটিকে টিকিটের মতোই সামলান।</p>
  body_html_hi: <h2>यात्री विवरण और संपर्क विवरण अलग हैं</h2><p>यात्री के नाम हर यात्री के
    पासपोर्ट से ठीक-ठीक मेल खाने चाहिए। संपर्क ईमेल और टेलीफ़ोन आपके हो सकते हैं, और उड़ान
    से जुड़ी हर सूचना वहीं भेजी जाती है।</p><h2>बाद में इसे कौन प्रबंधित कर सकता है</h2><p>बुकिंग
    संदर्भ और मुख्य यात्री का उपनाम रखने वाला कोई भी। बुकिंग पर कोई पासवर्ड नहीं है, इसलिए
    संदर्भ को टिकट की तरह संभालें।</p>
  body_html_ur: <h2>مسافر کی تفصیلات اور رابطہ تفصیلات الگ ہیں</h2><p>مسافروں کے نام ہر مسافر
    کے پاسپورٹ سے بالکل مطابقت رکھنے چاہئیں۔ رابطہ ای میل اور ٹیلی فون آپ کے ہو سکتے ہیں،
    اور پرواز سے متعلق ہر اطلاع وہیں بھیجی جاتی ہے۔</p><h2>بعد میں اسے کون سنبھال سکتا ہے</h2><p>بکنگ
    حوالہ اور مرکزی مسافر کا آخری نام رکھنے والا کوئی بھی۔ بکنگ پر کوئی پاس ورڈ نہیں، اس لیے
    حوالے کو ٹکٹ کی طرح سنبھالیں۔</p>
- slug: codeshare-explained
  category: booking-help
