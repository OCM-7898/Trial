  title_en: Children travelling alone
  title_am: ብቻቸውን የሚጓዙ ሕፃናት
  summary_en: Age bands, the escort service, and what must be arranged before travel.
  summary_am: የዕድሜ ክፍሎች፣ የአጃቢ አገልግሎት፣ እና ከጉዞ በፊት መዘጋጀት ያለበት።
  body_html_en: <h2>Age bands</h2><p>Under 5 may not travel alone. From 5 to 11 the escort
    service is compulsory and costs USD 60 each way. From 12 to 15 it is optional at the same
    price. From 16 the passenger travels as an adult.</p><h2>Before travel</h2><p>Book at
    least 48 hours ahead and name the adult handing over and the adult collecting, with a
    telephone number for each. Both must bring photographic identification. A booking with
    an unaccompanied minor cannot be checked in online.</p>
  body_html_am: <h2>የዕድሜ ክፍሎች</h2><p>ከ5 ዓመት በታች ብቻቸውን መጓዝ አይችሉም። ከ5 እስከ 11 የአጃቢ አገልግሎት የግዴታ
    ሲሆን በአንድ አቅጣጫ USD 60 ያስከፍላል። ከ12 እስከ 15 በተመሳሳይ ዋጋ በምርጫ ነው። ከ16 ጀምሮ ተሳፋሪው እንደ አዋቂ ይጓዛል።</p><h2>ከጉዞ
    በፊት</h2><p>ቢያንስ ከ48 ሰዓት በፊት ይያዙ፤ የሚያስረክበውንና የሚቀበለውን አዋቂ ከየስልክ ቁጥራቸው ጋር ይሰይሙ። ሁለቱም ፎቶ ያለው
    መታወቂያ ማምጣት አለባቸው። ያለአጃቢ ሕፃን ያለበት የቦታ ማስያዣ በመስመር ላይ ቼክ-ኢን ሊደረግ አይችልም።</p>
  id: 24
  title_bn: একা ভ্রমণকারী শিশু
  title_hi: अकेले यात्रा करने वाले बच्चे
  title_ur: تنہا سفر کرنے والے بچے
  summary_bn: বয়সসীমা, এসকর্ট পরিষেবা, এবং ভ্রমণের আগে কী ব্যবস্থা করতে হবে।
  summary_hi: आयु वर्ग, एस्कॉर्ट सेवा, और यात्रा से पहले क्या व्यवस्था करनी होगी।
  summary_ur: عمر کے گروپ، ایسکورٹ سروس، اور سفر سے پہلے کیا انتظام کرنا ہوگا۔
  body_html_bn: <h2>বয়সসীমা</h2><p>5 বছরের কম বয়সীরা একা ভ্রমণ করতে পারে না। 5 থেকে 11 বছরে
    এসকর্ট পরিষেবা বাধ্যতামূলক এবং প্রতি দিকে USD 60 খরচ হয়। 12 থেকে 15 বছরে এটি একই মূল্যে
    ঐচ্ছিক। 16 বছর থেকে যাত্রী প্রাপ্তবয়স্ক হিসেবে ভ্রমণ করে।</p><h2>ভ্রমণের আগে</h2><p>অন্তত
    48 ঘণ্টা আগে বুক করুন এবং হস্তান্তরকারী প্রাপ্তবয়স্ক ও গ্রহণকারী প্রাপ্তবয়স্কের নাম
    দিন, প্রত্যেকের জন্য একটি টেলিফোন নম্বরসহ। দুজনকেই ছবিযুক্ত পরিচয়পত্র আনতে হবে। সঙ্গীহীন
    নাবালকসহ বুকিংয়ে অনলাইনে চেক-ইন করা যায় না।</p>
  body_html_hi: <h2>आयु वर्ग</h2><p>5 वर्ष से कम आयु के बच्चे अकेले यात्रा नहीं कर सकते। 5
    से 11 वर्ष में एस्कॉर्ट सेवा अनिवार्य है और प्रत्येक दिशा में USD 60 लगती है। 12 से 15
    वर्ष में यह उसी मूल्य पर वैकल्पिक है। 16 वर्ष से यात्री वयस्क के रूप में यात्रा करता है।</p><h2>यात्रा
    से पहले</h2><p>कम से कम 48 घंटे पहले बुक करें और सौंपने वाले वयस्क और लेने वाले वयस्क
    का नाम दें, प्रत्येक के लिए टेलीफ़ोन नंबर के साथ। दोनों को फ़ोटो पहचान पत्र लाना होगा।
    अकेले यात्रा कर रहे नाबालिग वाली बुकिंग में ऑनलाइन चेक-इन नहीं किया जा सकता।</p>
  body_html_ur: <h2>عمر کے گروپ</h2><p>5 سال سے کم عمر بچے تنہا سفر نہیں کر سکتے۔ 5 سے 11
    سال میں ایسکورٹ سروس لازمی ہے اور ہر سمت USD 60 لگتی ہے۔ 12 سے 15 سال میں یہ اسی قیمت
    پر اختیاری ہے۔ 16 سال سے مسافر بالغ کے طور پر سفر کرتا ہے۔</p><h2>سفر سے پہلے</h2><p>کم
    از کم 48 گھنٹے پہلے بک کریں اور حوالے کرنے والے بالغ اور وصول کرنے والے بالغ کا نام دیں،
    ہر ایک کے لیے ٹیلی فون نمبر کے ساتھ۔ دونوں کو تصویری شناختی دستاویز لانی ہوگی۔ تنہا سفر
    کرنے والے نابالغ والی بکنگ میں آن لائن چیک اِن نہیں ہو سکتا۔</p>
- slug: travelling-with-pets
  category: travel-info
