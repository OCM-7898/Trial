  title_en: Allergies on board
  title_am: በበረራ ላይ አለርጂዎች
  summary_en: What we can and cannot do for passengers with food allergies.
  summary_am: የምግብ አለርጂ ላላቸው ተሳፋሪዎች ምን ማድረግ እንደምንችልና እንደማንችል።
  body_html_en: <h2>We cannot guarantee an allergen-free cabin</h2><p>Our aircraft are not
    free of nuts, dairy, gluten, sesame or shellfish. Other passengers may bring food on board,
    and cabins are not deep-cleaned between every sector. We therefore cannot describe any
    flight as allergen-free.</p><h2>Before you travel</h2><ul><li>Tell us at least 48 hours
    before departure by adding a note to your booking or calling the contact office for your
    country.</li><li>Order a special meal that excludes your allergen. Special meals close
    24 hours before departure and cannot be arranged at the airport.</li><li>Carry your own
    antihistamines and adrenaline auto-injector in your cabin baggage, not in the hold. Cabin
    crew carry a medical kit but it is not a substitute for your own medication.</li><li>Bring
    a doctor&#x27;s letter if you carry injectable medication, so it is not questioned at
    security.</li></ul><h2>On board</h2><p>Tell the cabin crew when you board. They can make
    an announcement asking other passengers not to open nut products, and they will note your
    seat. The announcement is a request, not an enforceable rule.</p><p>You may bring your
    own sealed food on board for your own consumption.</p><h2>Buffer zones</h2><p>On request
    we will seat you away from the galley and note a buffer of one row in front and behind.
    Buffer zones cannot be guaranteed on a full flight.</p>
  body_html_am: <h2>አለርጂ-ነጻ ካቢን ዋስትና መስጠት አንችልም</h2><p>አውሮፕላኖቻችን ከለውዝ፣ ከወተት ተዋጽኦ፣ ከግሉተን፣ ከሰሊጥ
    ወይም ከሼልፊሽ ነጻ አይደሉም። ሌሎች ተሳፋሪዎች ምግብ ይዘው ሊገቡ ይችላሉ፤ ካቢኖችም በእያንዳንዱ ክፍል መካከል በጥልቀት አይጸዱም። ስለዚህ
    ማንኛውንም በረራ አለርጂ-ነጻ ብለን መግለጽ አንችልም።</p><h2>ከመጓዝዎ በፊት</h2><ul><li>ከመነሻው ቢያንስ 48 ሰዓት በፊት
    በቦታ ማስያዣዎ ላይ ማስታወሻ በመጨመር ወይም የአገርዎን የመገናኛ ቢሮ በመደወል ያሳውቁን።</li><li>አለርጂዎን የማያካትት ልዩ ምግብ
    ያዙ። ልዩ ምግቦች ከመነሻው 24 ሰዓት በፊት ይዘጋሉ፤ በአየር ማረፊያም ሊዘጋጁ አይችሉም።</li><li>የራስዎን ፀረ-ሂስታሚንና የአድሬናሊን
    መርፌ በእጅ ሻንጣዎ ውስጥ ይያዙ፤ በጭነት ክፍል ውስጥ አይደለም። የካቢን ሠራተኞች የሕክምና ቁሳቁስ ይይዛሉ፤ ነገር ግን ለራስዎ መድኃኒት
    ምትክ አይደለም።</li><li>የመርፌ መድኃኒት የሚይዙ ከሆነ በደህንነት ፍተሻ ጥያቄ እንዳይነሳ የሐኪም ደብዳቤ ይዘው ይምጡ።</li></ul><h2>በበረራ
    ላይ</h2><p>በሚሳፈሩበት ጊዜ ለካቢን ሠራተኞች ይንገሩ። ሌሎች ተሳፋሪዎች የለውዝ ምርቶችን እንዳይከፍቱ ማስታወቂያ ማድረግ ይችላሉ፤
    መቀመጫዎንም ይመዘግባሉ። ማስታወቂያው ጥያቄ እንጂ የሚያስገድድ ደንብ አይደለም።</p><p>ለራስዎ ፍጆታ የታሸገ የራስዎን ምግብ ይዘው መሳፈር
    ይችላሉ።</p><h2>የመከላከያ ቀጠናዎች</h2><p>በጥያቄዎ መሠረት ከጋሊው ራቅ ብለን እናስቀምጥዎታለን፤ ከፊትና ከኋላ የአንድ ረድፍ
    መከላከያም እንመዘግባለን። በሙሉ በረራ ላይ የመከላከያ ቀጠናዎች ዋስትና ሊሰጣቸው አይችልም።</p>
  id: 1
  title_bn: উড়োজাহাজে অ্যালার্জি
  title_hi: विमान में एलर्जी
  title_ur: طیارے میں الرجی
  summary_bn: খাদ্য অ্যালার্জিযুক্ত যাত্রীদের জন্য আমরা কী করতে পারি আর কী পারি না।
  summary_hi: खाद्य एलर्जी वाले यात्रियों के लिए हम क्या कर सकते हैं और क्या नहीं।
  summary_ur: خوراک کی الرجی والے مسافروں کے لیے ہم کیا کر سکتے ہیں اور کیا نہیں۔
  body_html_bn: <h2>আমরা অ্যালার্জেনমুক্ত কেবিনের নিশ্চয়তা দিতে পারি না</h2><p>আমাদের উড়োজাহাজ
    বাদাম, দুগ্ধজাত, গ্লুটেন, তিল বা শেলফিশমুক্ত নয়। অন্য যাত্রীরা খাবার নিয়ে উঠতে পারেন,
    এবং প্রতিটি সেক্টরের মাঝে কেবিন গভীরভাবে পরিষ্কার করা হয় না। তাই আমরা কোনো ফ্লাইটকে অ্যালার্জেনমুক্ত
    বলতে পারি না।</p><h2>ভ্রমণের আগে</h2><ul><li>প্রস্থানের অন্তত 48 ঘণ্টা আগে আপনার বুকিংয়ে
    একটি নোট যোগ করে বা আপনার দেশের যোগাযোগ অফিসে ফোন করে আমাদের জানান।</li><li>আপনার অ্যালার্জেন
    বাদ দেওয়া একটি বিশেষ খাবার অর্ডার করুন। বিশেষ খাবার প্রস্থানের 24 ঘণ্টা আগে বন্ধ হয়
    এবং বিমানবন্দরে ব্যবস্থা করা যায় না।</li><li>আপনার নিজের অ্যান্টিহিস্টামিন ও অ্যাড্রেনালিন
    অটো-ইনজেক্টর কেবিন ব্যাগেজে রাখুন, হোল্ডে নয়। কেবিন ক্রুর কাছে একটি মেডিকেল কিট থাকে,
    তবে তা আপনার নিজের ওষুধের বিকল্প নয়।</li><li>ইনজেকশনযোগ্য ওষুধ বহন করলে একটি চিকিৎসকের
    চিঠি আনুন, যাতে নিরাপত্তা তল্লাশিতে প্রশ্ন না ওঠে।</li></ul><h2>উড়োজাহাজে</h2><p>ওঠার
    সময় কেবিন ক্রুকে জানান। তাঁরা অন্য যাত্রীদের বাদামজাত পণ্য না খোলার অনুরোধ জানিয়ে ঘোষণা
    দিতে পারেন, এবং আপনার আসন নোট করে রাখবেন। ঘোষণাটি একটি অনুরোধ, বাধ্যতামূলক নিয়ম নয়।</p><p>আপনি
    নিজের খাওয়ার জন্য সিল করা খাবার উড়োজাহাজে আনতে পারেন।</p><h2>বাফার জোন</h2><p>অনুরোধে
    আমরা আপনাকে গ্যালি থেকে দূরে বসাব এবং সামনে ও পিছনে এক সারির বাফার নোট করব। পূর্ণ ফ্লাইটে
    বাফার জোনের নিশ্চয়তা দেওয়া যায় না।</p>
  body_html_hi: <h2>हम एलर्जेन-मुक्त केबिन की गारंटी नहीं दे सकते</h2><p>हमारे विमान मेवे,
    डेयरी, ग्लूटेन, तिल या शेलफ़िश से मुक्त नहीं हैं। अन्य यात्री विमान में खाना ला सकते हैं,
    और हर सेक्टर के बीच केबिन की गहरी सफ़ाई नहीं होती। इसलिए हम किसी भी उड़ान को एलर्जेन-मुक्त
    नहीं कह सकते।</p><h2>यात्रा से पहले</h2><ul><li>प्रस्थान से कम से कम 48 घंटे पहले अपनी
    बुकिंग में नोट जोड़कर या अपने देश के संपर्क कार्यालय को फ़ोन करके हमें बताएँ।</li><li>अपने
    एलर्जेन को छोड़ने वाला विशेष भोजन ऑर्डर करें। विशेष भोजन प्रस्थान से 24 घंटे पहले बंद
    हो जाते हैं और हवाई अड्डे पर व्यवस्थित नहीं किए जा सकते।</li><li>अपनी एंटीहिस्टामिन और
    एड्रेनालिन ऑटो-इंजेक्टर अपने केबिन बैगेज में रखें, होल्ड में नहीं। केबिन क्रू के पास मेडिकल
    किट होती है, लेकिन वह आपकी अपनी दवा का विकल्प नहीं है।</li><li>यदि आप इंजेक्शन वाली दवा
    ले जाते हैं तो डॉक्टर का पत्र लाएँ, ताकि सुरक्षा जाँच में सवाल न उठे।</li></ul><h2>विमान
    में</h2><p>चढ़ते समय केबिन क्रू को बताएँ। वे अन्य यात्रियों से मेवे वाले उत्पाद न खोलने
    का अनुरोध करते हुए घोषणा कर सकते हैं, और वे आपकी सीट नोट कर लेंगे। घोषणा एक अनुरोध है,
    लागू करने योग्य नियम नहीं।</p><p>आप अपने उपभोग के लिए अपना सीलबंद भोजन विमान में ला सकते
    हैं।</p><h2>बफ़र ज़ोन</h2><p>अनुरोध पर हम आपको गैली से दूर बैठाएँगे और आगे तथा पीछे एक
    पंक्ति का बफ़र नोट करेंगे। पूरी भरी उड़ान में बफ़र ज़ोन की गारंटी नहीं दी जा सकती।</p>
  body_html_ur: <h2>ہم الرجن سے پاک کیبن کی ضمانت نہیں دے سکتے</h2><p>ہمارے طیارے میوہ جات،
    ڈیری، گلوٹن، تل یا شیل فش سے پاک نہیں ہیں۔ دوسرے مسافر طیارے میں کھانا لا سکتے ہیں، اور
    ہر سیکٹر کے درمیان کیبن کی گہری صفائی نہیں ہوتی۔ اس لیے ہم کسی بھی پرواز کو الرجن سے پاک
    نہیں کہہ سکتے۔</p><h2>سفر سے پہلے</h2><ul><li>روانگی سے کم از کم 48 گھنٹے پہلے اپنی بکنگ
    میں نوٹ شامل کر کے یا اپنے ملک کے رابطہ دفتر کو فون کر کے ہمیں بتائیں۔</li><li>اپنے الرجن
    کے بغیر خصوصی کھانا آرڈر کریں۔ خصوصی کھانے روانگی سے 24 گھنٹے پہلے بند ہو جاتے ہیں اور
    ہوائی اڈے پر ان کا انتظام نہیں ہو سکتا۔</li><li>اپنی اینٹی ہسٹامین اور ایڈرینالین آٹو
    انجیکٹر اپنے کیبن سامان میں رکھیں، ہولڈ میں نہیں۔ کیبن عملے کے پاس طبی کٹ ہوتی ہے لیکن
    وہ آپ کی اپنی دوا کا متبادل نہیں ہے۔</li><li>اگر آپ انجیکشن والی دوا لے جاتے ہیں تو ڈاکٹر
    کا خط لائیں، تاکہ سیکیورٹی پر سوال نہ اٹھے۔</li></ul><h2>طیارے میں</h2><p>سوار ہوتے وقت
    کیبن عملے کو بتائیں۔ وہ دوسرے مسافروں سے میوہ جات والی اشیا نہ کھولنے کی درخواست کا اعلان
    کر سکتے ہیں، اور وہ آپ کی سیٹ نوٹ کر لیں گے۔ اعلان ایک درخواست ہے، قابلِ نفاذ قاعدہ نہیں۔</p><p>آپ
    اپنے استعمال کے لیے اپنا سیل بند کھانا طیارے میں لا سکتے ہیں۔</p><h2>بفر زون</h2><p>درخواست
    پر ہم آپ کو گیلی سے دور بٹھائیں گے اور آگے اور پیچھے ایک قطار کا بفر نوٹ کریں گے۔ بھری
    ہوئی پرواز میں بفر زون کی ضمانت نہیں دی جا سکتی۔</p>
- slug: special-baggage
  category: baggage
  position: 1
  title_en: Special and sports baggage
  title_am: ልዩና የስፖርት ሻንጣ
  summary_en: Rules, weight limits and charges for sports equipment and outsize items.
  summary_am: ለስፖርት መሣሪያዎችና ለትልልቅ ዕቃዎች ደንቦች፣ የክብደት ገደቦችና ክፍያዎች።
  body_html_en: <h2>How special baggage is charged</h2><p>Sports equipment counts as one checked
    bag if it is within your free allowance and under the weight limit for the item. Anything
    above that is charged at the fixed item fee below, which replaces the normal excess-weight
    rate.</p><p>Items marked as requiring advance notice must be declared at least 48 hours
    before departure. We cannot accept them at the airport without a booking.</p><h2>Packing
    requirements</h2><ul><li>Bicycles must have the handlebars turned, pedals removed and
    tyres deflated, in a bicycle bag or box.</li><li>Firearms for sport require a permit and
    must be declared; ammunition is limited to 5 kg per passenger and must travel separately
    from the firearm.</li><li>Surfboards and windsurf equipment must be in a padded board
    bag.</li><li>Diving cylinders must be empty, with the valve removed or open for inspection.</li></ul><h2>Items
    we cannot carry</h2><p>Loose lithium batteries above 160 Wh, powered ride-on suitcases
    with non-removable batteries, and hoverboards are not accepted in either cabin or hold
    baggage on any route.</p>
  body_html_am: <h2>ልዩ ሻንጣ እንዴት እንደሚከፈል</h2><p>የስፖርት መሣሪያ በነጻ ፈቃድዎ ውስጥ ከሆነና ከዕቃው የክብደት ገደብ
    በታች ከሆነ እንደ አንድ የተመዘገበ ሻንጣ ይቆጠራል። ከዚያ በላይ የሆነው ከታች ባለው ቋሚ የዕቃ ክፍያ ይከፈላል፤ ይህም መደበኛውን የትርፍ
    ክብደት ተመን ይተካል።</p><p>ቅድሚያ ማሳወቅ የሚያስፈልጋቸው ተብለው የተመዘገቡ ዕቃዎች ከመነሻው ቢያንስ 48 ሰዓት በፊት መገለጽ አለባቸው።
    ያለ ቅድመ ማስያዣ በአየር ማረፊያ ልንቀበላቸው አንችልም።</p><h2>የማሸግ መስፈርቶች</h2><ul><li>ብስክሌቶች መሪያቸው ተዙሮ፣
    ፔዳሎቻቸው ተነስተውና ጎማዎቻቸው አየር ወጥቶላቸው በብስክሌት ከረጢት ወይም ሳጥን መሆን አለባቸው።</li><li>ለስፖርት የሚውሉ የጦር
    መሣሪያዎች ፈቃድ ያስፈልጋቸዋል፤ መገለጽም አለባቸው። ጥይት በአንድ ተሳፋሪ እስከ 5 ኪግ የተወሰነ ሲሆን ከመሣሪያው ተለይቶ መጓዝ አለበት።</li><li>የሰርፍ
    ሰሌዳዎችና የንፋስ ሰርፍ መሣሪያዎች በተለጠፈ የሰሌዳ ከረጢት ውስጥ መሆን አለባቸው።</li><li>የመጥለቂያ ሲሊንደሮች ባዶ መሆን አለባቸው፤
    ቫልቫቸውም ተነስቶ ወይም ለፍተሻ ክፍት መሆን አለበት።</li></ul><h2>ልንወስዳቸው የማንችላቸው ዕቃዎች</h2><p>ከ160 ዋት-ሰዓት
    በላይ የሆኑ ነጠላ የሊቲየም ባትሪዎች፣ የማይነሱ ባትሪ ያላቸው በኤሌክትሪክ የሚነዱ ሻንጣዎችና ሆቨርቦርዶች በማንኛውም መስመር በእጅም ሆነ
    በተመዘገበ ሻንጣ አይፈቀዱም።</p>
  id: 2
  title_bn: বিশেষ ও ক্রীড়া ব্যাগেজ
  title_hi: विशेष और खेल बैगेज
  title_ur: خصوصی اور کھیلوں کا سامان
  summary_bn: ক্রীড়া সরঞ্জাম ও বড় আকারের জিনিসের নিয়ম, ওজনসীমা ও চার্জ।
  summary_hi: खेल उपकरण और बड़े आकार की वस्तुओं के नियम, वज़न सीमाएँ और शुल्क।
  summary_ur: کھیلوں کے سامان اور بڑے سائز کی اشیا کے قواعد، وزن کی حدیں اور چارجز۔
  body_html_bn: <h2>বিশেষ ব্যাগেজের চার্জ কীভাবে হয়</h2><p>ক্রীড়া সরঞ্জাম আপনার বিনামূল্যের
    অ্যালাউন্সের মধ্যে এবং সেই জিনিসের ওজনসীমার নিচে থাকলে একটি চেকড ব্যাগ হিসেবে গণ্য হয়।
    তার উপরে যা কিছু তা নিচের নির্দিষ্ট আইটেম ফি-তে চার্জ করা হয়, যা স্বাভাবিক অতিরিক্ত-ওজন
    হারের জায়গা নেয়।</p><p>আগাম নোটিশ প্রয়োজন বলে চিহ্নিত জিনিস প্রস্থানের অন্তত 48 ঘণ্টা
    আগে ঘোষণা করতে হবে। বুকিং ছাড়া বিমানবন্দরে আমরা সেগুলি গ্রহণ করতে পারি না।</p><h2>প্যাকিংয়ের
    শর্ত</h2><ul><li>সাইকেলের হ্যান্ডেলবার ঘোরানো, প্যাডেল খোলা ও টায়ারের হাওয়া ছাড়া থাকতে
    হবে, সাইকেলের ব্যাগ বা বাক্সে।</li><li>ক্রীড়ার আগ্নেয়াস্ত্রের জন্য পারমিট প্রয়োজন এবং
    ঘোষণা করতে হবে; গোলাবারুদ যাত্রীপ্রতি 5 kg-এ সীমিত এবং আগ্নেয়াস্ত্র থেকে আলাদাভাবে যেতে
    হবে।</li><li>সার্ফবোর্ড ও উইন্ডসার্ফ সরঞ্জাম প্যাডেড বোর্ড ব্যাগে থাকতে হবে।</li><li>ডাইভিং
    সিলিন্ডার খালি থাকতে হবে, ভাল্ভ খোলা বা পরিদর্শনের জন্য উন্মুক্ত অবস্থায়।</li></ul><h2>যে
    জিনিস আমরা বহন করতে পারি না</h2><p>160 Wh-এর বেশি আলগা লিথিয়াম ব্যাটারি, অপসারণযোগ্য
    নয় এমন ব্যাটারিসহ মোটরচালিত রাইড-অন সুটকেস এবং হোভারবোর্ড কোনো রুটে কেবিন বা হোল্ড ব্যাগেজ
    হিসেবে গ্রহণ করা হয় না।</p>
  body_html_hi: <h2>विशेष बैगेज का शुल्क कैसे लगता है</h2><p>खेल उपकरण एक चेक्ड बैग के रूप
    में गिना जाता है यदि वह आपके निःशुल्क अलाउंस के भीतर और उस वस्तु की वज़न सीमा से नीचे
    है। उससे ऊपर की हर चीज़ पर नीचे दिया गया निश्चित वस्तु शुल्क लगता है, जो सामान्य अतिरिक्त-वज़न
    दर की जगह लेता है।</p><p>अग्रिम सूचना आवश्यक के रूप में चिह्नित वस्तुओं की घोषणा प्रस्थान
    से कम से कम 48 घंटे पहले करनी होगी। बिना बुकिंग के हम उन्हें हवाई अड्डे पर स्वीकार नहीं
    कर सकते।</p><h2>पैकिंग आवश्यकताएँ</h2><ul><li>साइकिल के हैंडलबार घुमे हुए, पैडल हटे हुए
    और टायरों की हवा निकली हुई होनी चाहिए, साइकिल बैग या बॉक्स में।</li><li>खेल की बंदूकों
    के लिए परमिट आवश्यक है और उन्हें घोषित करना होगा; गोला-बारूद प्रति यात्री 5 kg तक सीमित
    है और बंदूक से अलग जाना चाहिए।</li><li>सर्फ़बोर्ड और विंडसर्फ़ उपकरण पैडेड बोर्ड बैग में
    होने चाहिए।</li><li>डाइविंग सिलेंडर खाली होने चाहिए, वाल्व हटा हुआ या निरीक्षण के लिए
    खुला।</li></ul><h2>जो वस्तुएँ हम नहीं ले जा सकते</h2><p>160 Wh से अधिक की खुली लिथियम
    बैटरियाँ, न निकाली जा सकने वाली बैटरी वाले मोटर चालित राइड-ऑन सूटकेस, और होवरबोर्ड किसी
    भी मार्ग पर केबिन या होल्ड बैगेज में स्वीकार नहीं किए जाते।</p>
  body_html_ur: <h2>خصوصی سامان کا چارج کیسے لگتا ہے</h2><p>کھیلوں کا سامان ایک چیکڈ بیگ شمار
    ہوتا ہے اگر وہ آپ کے مفت الاؤنس کے اندر اور اس آئٹم کی وزن کی حد سے کم ہو۔ اس سے اوپر
    ہر چیز پر نیچے دی گئی مقررہ آئٹم فیس لگتی ہے، جو عام اضافی وزن کی شرح کی جگہ لیتی ہے۔</p><p>پیشگی
    اطلاع درکار کے طور پر نشان زد اشیا کا اعلان روانگی سے کم از کم 48 گھنٹے پہلے کرنا ہوگا۔
    بکنگ کے بغیر ہم انہیں ہوائی اڈے پر قبول نہیں کر سکتے۔</p><h2>پیکنگ کے تقاضے</h2><ul><li>سائیکلوں
    کے ہینڈل بار گھمائے ہوئے، پیڈل اتارے ہوئے اور ٹائروں کی ہوا نکالی ہوئی ہونی چاہیے، سائیکل
    بیگ یا ڈبے میں۔</li><li>کھیل کے آتشیں اسلحے کے لیے پرمٹ درکار ہے اور اسے ظاہر کرنا ہوگا؛
    گولہ بارود فی مسافر 5 kg تک محدود ہے اور آتشیں اسلحے سے علیحدہ سفر کرنا چاہیے۔</li><li>سرف
    بورڈ اور ونڈ سرف سامان پیڈڈ بورڈ بیگ میں ہونا چاہیے۔</li><li>ڈائیونگ سلنڈر خالی ہونے چاہئیں،
    والو اتارا ہوا یا معائنے کے لیے کھلا۔</li></ul><h2>وہ اشیا جو ہم نہیں لے جا سکتے</h2><p>160
    Wh سے زیادہ کی کھلی لیتھیم بیٹریاں، نہ نکلنے والی بیٹریوں والے بجلی سے چلنے والے رائیڈ
    آن سوٹ کیس، اور ہوور بورڈ کسی بھی روٹ پر کیبن یا ہولڈ سامان میں قبول نہیں کیے جاتے۔</p>
