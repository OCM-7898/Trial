  title_en: Travelling with a medical condition
  title_am: ከሕመም ጋር መጓዝ
  summary_en: When we need medical clearance, and what to bring.
  summary_am: የሕክምና ፈቃድ የሚያስፈልገን መቼ እንደሆነ፣ እና ምን ይዘው መምጣት እንዳለብዎት።
  body_html_en: <h2>Clearance</h2><p>Medical clearance is required within 7 days of surgery,
    for conditions needing supplementary oxygen, for a pregnancy beyond 36 weeks, and where
    a stretcher or medical escort is needed. Apply at least 72 hours before departure.</p><p>Carry
    prescribed medication in your cabin baggage in its original labelled packaging, with a
    doctor&#x27;s letter for anything injectable.</p>
  body_html_am: <h2>ፈቃድ</h2><p>የሕክምና ፈቃድ የሚያስፈልገው በቀዶ ጥገና በ7 ቀናት ውስጥ፣ ተጨማሪ ኦክስጅን ለሚያስፈልጋቸው
    ሁኔታዎች፣ ከ36 ሳምንት በላይ ለሆነ እርግዝና፣ እና ቃሬዛ ወይም የሕክምና አጃቢ ሲያስፈልግ ነው። ከመነሻው ቢያንስ 72 ሰዓት በፊት ያመልክቱ።</p><p>የታዘዘ
    መድኃኒትዎን በዋናው በተለጠፈ ማሸጊያው ውስጥ በእጅ ሻንጣዎ ይያዙ፤ ለሚወጋ ማንኛውም ነገር የሐኪም ደብዳቤ ይዘው።</p>
  id: 12
  title_bn: শারীরিক অসুস্থতা নিয়ে ভ্রমণ
  title_hi: चिकित्सीय स्थिति के साथ यात्रा
  title_ur: طبی حالت کے ساتھ سفر
  summary_bn: কখন আমাদের মেডিকেল ছাড়পত্র প্রয়োজন, এবং কী আনতে হবে।
  summary_hi: कब हमें चिकित्सा मंज़ूरी चाहिए, और क्या लाना है।
  summary_ur: کب ہمیں طبی اجازت درکار ہے، اور کیا لانا ہے۔
  body_html_bn: <h2>ছাড়পত্র</h2><p>অস্ত্রোপচারের 7 দিনের মধ্যে, পরিপূরক অক্সিজেন প্রয়োজন
    এমন অবস্থায়, 36 সপ্তাহের বেশি গর্ভাবস্থায়, এবং স্ট্রেচার বা মেডিকেল এসকর্ট প্রয়োজন
    হলে মেডিকেল ছাড়পত্র প্রয়োজন। প্রস্থানের অন্তত 72 ঘণ্টা আগে আবেদন করুন।</p><p>প্রেসক্রাইব
    করা ওষুধ আসল লেবেলযুক্ত প্যাকেজিংয়ে আপনার কেবিন ব্যাগেজে বহন করুন, ইনজেকশনযোগ্য যেকোনো
    কিছুর জন্য চিকিৎসকের চিঠিসহ।</p>
  body_html_hi: <h2>मंज़ूरी</h2><p>सर्जरी के 7 दिनों के भीतर, पूरक ऑक्सीजन की आवश्यकता वाली
    स्थितियों के लिए, 36 सप्ताह से अधिक की गर्भावस्था के लिए, और जहाँ स्ट्रेचर या मेडिकल एस्कॉर्ट
    की आवश्यकता हो, चिकित्सा मंज़ूरी आवश्यक है। प्रस्थान से कम से कम 72 घंटे पहले आवेदन करें।</p><p>निर्धारित
    दवा अपने केबिन बैगेज में उसकी मूल लेबल वाली पैकेजिंग में रखें, किसी भी इंजेक्शन वाली चीज़
    के लिए डॉक्टर के पत्र के साथ।</p>
  body_html_ur: <h2>اجازت</h2><p>سرجری کے 7 دنوں کے اندر، اضافی آکسیجن درکار حالتوں کے لیے،
    36 ہفتوں سے زیادہ کے حمل کے لیے، اور جہاں اسٹریچر یا طبی ہمراہی درکار ہو، طبی اجازت درکار
    ہے۔ روانگی سے کم از کم 72 گھنٹے پہلے درخواست دیں۔</p><p>تجویز کردہ دوا اپنے کیبن سامان
    میں اس کی اصل لیبل شدہ پیکنگ میں رکھیں، کسی بھی انجیکشن والی چیز کے لیے ڈاکٹر کے خط کے
    ساتھ۔</p>
- slug: assistance-mobility
  category: health
  position: 3
  title_en: Mobility assistance
  title_am: የእንቅስቃሴ ድጋፍ
  summary_en: Wheelchair codes, and how a request changes your check-in.
  summary_am: የተሽከርካሪ ወንበር ኮዶች፣ እና ጥያቄ ቼክ-ኢንዎን እንዴት እንደሚቀይር።
  body_html_en: <h2>Codes</h2><p>WCHR means assistance to the aircraft door with the passenger
    able to climb steps; WCHS means unable to climb steps; WCHC means immobile throughout
    and requiring assistance to the seat. Request at least 48 hours ahead.</p><p>A booking
    with assistance recorded cannot be checked in online; a desk agent must confirm the arrangements
    in person.</p>
  body_html_am: <h2>ኮዶች</h2><p>WCHR ማለት ተሳፋሪው ደረጃ መውጣት ሲችል እስከ አውሮፕላኑ በር ድረስ ድጋፍ ማለት ነው፤ WCHS
    ደረጃ መውጣት አለመቻል ማለት ነው፤ WCHC ደግሞ በሙሉ መንቀሳቀስ አለመቻልና እስከ መቀመጫው ድረስ ድጋፍ ማስፈለግ ማለት ነው። ቢያንስ
    ከ48 ሰዓት በፊት ይጠይቁ።</p><p>ድጋፍ የተመዘገበበት የቦታ ማስያዣ በመስመር ላይ ቼክ-ኢን ሊደረግ አይችልም፤ የጠረጴዛ ወኪል ዝግጅቱን
    በአካል ማረጋገጥ አለበት።</p>
  id: 13
  title_bn: চলাফেরার সহায়তা
  title_hi: गतिशीलता सहायता
  title_ur: نقل و حرکت میں معاونت
  summary_bn: হুইলচেয়ার কোড, এবং একটি অনুরোধ আপনার চেক-ইন কীভাবে বদলায়।
  summary_hi: व्हीलचेयर कोड, और अनुरोध आपके चेक-इन को कैसे बदलता है।
  summary_ur: وہیل چیئر کوڈ، اور درخواست آپ کے چیک اِن کو کیسے بدلتی ہے۔
  body_html_bn: <h2>কোড</h2><p>WCHR মানে উড়োজাহাজের দরজা পর্যন্ত সহায়তা, যাত্রী সিঁড়ি চড়তে
    সক্ষম; WCHS মানে সিঁড়ি চড়তে অক্ষম; WCHC মানে পুরোপুরি অচল এবং আসন পর্যন্ত সহায়তা প্রয়োজন।
    অন্তত 48 ঘণ্টা আগে অনুরোধ করুন।</p><p>সহায়তা রেকর্ড করা বুকিংয়ে অনলাইনে চেক-ইন করা যায়
    না; একজন ডেস্ক এজেন্টকে সরাসরি ব্যবস্থাগুলি নিশ্চিত করতে হয়।</p>
  body_html_hi: <h2>कोड</h2><p>WCHR का अर्थ है विमान के दरवाज़े तक सहायता, यात्री सीढ़ियाँ
    चढ़ सकता है; WCHS का अर्थ है सीढ़ियाँ नहीं चढ़ सकता; WCHC का अर्थ है पूरी तरह अचल और सीट
    तक सहायता आवश्यक। कम से कम 48 घंटे पहले अनुरोध करें।</p><p>सहायता दर्ज वाली बुकिंग में
    ऑनलाइन चेक-इन नहीं किया जा सकता; डेस्क एजेंट को व्यक्तिगत रूप से व्यवस्थाओं की पुष्टि
    करनी होती है।</p>
  body_html_ur: <h2>کوڈ</h2><p>WCHR کا مطلب ہے طیارے کے دروازے تک معاونت، مسافر سیڑھیاں چڑھ
    سکتا ہے؛ WCHS کا مطلب ہے سیڑھیاں نہیں چڑھ سکتا؛ WCHC کا مطلب ہے مکمل طور پر غیر متحرک
    اور سیٹ تک معاونت درکار۔ کم از کم 48 گھنٹے پہلے درخواست کریں۔</p><p>معاونت درج والی بکنگ
    میں آن لائن چیک اِن نہیں ہو سکتا؛ ڈیسک ایجنٹ کو بذاتِ خود انتظامات کی تصدیق کرنی ہوتی
    ہے۔</p>
- slug: miles-earning
  category: loyalty
  position: 1
  title_en: How miles are earned
  title_am: ማይሎች እንዴት እንደሚገኙ
  summary_en: Earning rates by fare family, and what does not earn.
  summary_am: በታሪፍ ቤተሰብ የማግኛ ተመኖች፣ እና የማያስገኘው።
  body_html_en: '<h2>Rates</h2><p>Miles are earned as a percentage of distance flown, set
    by fare family: Promo earns nothing, Lite 25%, Basic 50%, Group 75%, Standard 100%, Flex
    125%. Highland Class earns 150% to 250% depending on family.</p><p>Award tickets, staff
    tickets and the taxes portion of any fare do not earn miles. Miles credit within 72 hours
    of travel; after that, claim them.</p>'
  body_html_am: <h2>ተመኖች</h2><p>ማይሎች በበረረው ርቀት መቶኛ ይገኛሉ፤ በታሪፍ ቤተሰብም ይወሰናሉ፦ ፕሮሞ ምንም አያስገኝም፣
    ላይት 25%፣ ቤዚክ 50%፣ ግሩፕ 75%፣ ስታንዳርድ 100%፣ ፍሌክስ 125%። ሃይላንድ ክላስ እንደ ቤተሰቡ ከ150% እስከ 250% ያስገኛል።</p><p>የሽልማት
    ትኬቶች፣ የሠራተኛ ትኬቶችና የማንኛውም ታሪፍ የግብር ክፍል ማይል አያስገኙም። ማይሎች በጉዞ በ72 ሰዓት ውስጥ ይመዘገባሉ፤ ከዚያ በኋላ
    ይጠይቋቸው።</p>
  id: 14
  title_bn: মাইল কীভাবে অর্জিত হয়
  title_hi: मील कैसे अर्जित होते हैं
  title_ur: میلز کیسے حاصل ہوتے ہیں
  summary_bn: ফেয়ার ফ্যামিলি অনুযায়ী অর্জনের হার, এবং কী অর্জন করে না।
  summary_hi: फ़ेयर फ़ैमिली के अनुसार अर्जन दरें, और क्या अर्जित नहीं करता।
  summary_ur: فیئر فیملی کے مطابق حصول کی شرحیں، اور کیا حاصل نہیں کرتا۔
  body_html_bn: '<h2>হার</h2><p>মাইল উড্ডয়ন দূরত্বের শতাংশ হিসেবে অর্জিত হয়, ফেয়ার ফ্যামিলি
    অনুযায়ী নির্ধারিত: প্রোমো কিছুই অর্জন করে না, লাইট 25%, বেসিক 50%, গ্রুপ 75%, স্ট্যান্ডার্ড
    100%, ফ্লেক্স 125%। হাইল্যান্ড ক্লাস ফ্যামিলি অনুযায়ী 150% থেকে 250% অর্জন করে।</p><p>অ্যাওয়ার্ড
    টিকিট, স্টাফ টিকিট এবং যেকোনো ভাড়ার করের অংশ মাইল অর্জন করে না। ভ্রমণের 72 ঘণ্টার মধ্যে
    মাইল জমা হয়; তারপর দাবি করুন।</p>'
  body_html_hi: '<h2>दरें</h2><p>मील उड़ी गई दूरी के प्रतिशत के रूप में अर्जित होते हैं, फ़ेयर
    फ़ैमिली द्वारा निर्धारित: प्रोमो कुछ नहीं अर्जित करता, लाइट 25%, बेसिक 50%, ग्रुप 75%,
    स्टैंडर्ड 100%, फ़्लेक्स 125%। हाइलैंड क्लास फ़ैमिली के अनुसार 150% से 250% अर्जित करता
    है।</p><p>अवार्ड टिकट, स्टाफ़ टिकट और किसी भी किराए का कर वाला हिस्सा मील अर्जित नहीं
    करते। मील यात्रा के 72 घंटों के भीतर जमा होते हैं; उसके बाद, उनका दावा करें।</p>'
  body_html_ur: '<h2>شرحیں</h2><p>میلز طے شدہ فاصلے کے فیصد کے طور پر حاصل ہوتے ہیں، فیئر
    فیملی کے مطابق مقرر: پرومو کچھ حاصل نہیں کرتا، لائٹ 25%، بیسک 50%، گروپ 75%، اسٹینڈرڈ
    100%، فلیکس 125%۔ ہائی لینڈ کلاس فیملی کے مطابق 150% سے 250% حاصل کرتا ہے۔</p><p>ایوارڈ
    ٹکٹ، اسٹاف ٹکٹ اور کسی بھی کرائے کا ٹیکس والا حصہ میلز حاصل نہیں کرتے۔ میلز سفر کے 72
    گھنٹوں کے اندر جمع ہوتے ہیں؛ اس کے بعد ان کا کلیم کریں۔</p>'
- slug: miles-tiers
  category: loyalty
  position: 2
  title_en: Membership tiers
  title_am: የአባልነት ደረጃዎች
  summary_en: Thresholds, benefits and how status is retained.
  summary_am: ደፍዎች፣ ጥቅሞችና ደረጃ እንዴት እንደሚቆይ።
  body_html_en: <h2>Thresholds</h2><p>Blue is the entry tier. Silver requires 25,000 qualifying
    miles in a membership year, Gold 50,000, and Platinum 100,000. Qualifying miles are distance-based
    and differ from the redeemable miles shown as your balance.</p><p>Gold and Platinum members
    and Highland Class passengers have lounge access; Silver does not.</p>
  body_html_am: <h2>ደፍዎች</h2><p>ብሉ የመግቢያ ደረጃ ነው። ሲልቨር በአባልነት ዓመት ውስጥ 25,000 ብቁ ማይሎችን ይጠይቃል፣
    ጎልድ 50,000፣ ፕላቲነም ደግሞ 100,000። ብቁ ማይሎች በርቀት ላይ የተመሠረቱ ሲሆኑ እንደ ቀሪ ሒሳብዎ ከሚታዩት ሊቤዡ ከሚችሉ ማይሎች
    ይለያሉ።</p><p>የጎልድና የፕላቲነም አባላት እንዲሁም የሃይላንድ ክላስ ተሳፋሪዎች የላውንጅ መግቢያ አላቸው፤ ሲልቨር የለውም።</p>
  id: 15
  title_bn: সদস্যপদের টিয়ার
  title_hi: सदस्यता टियर
  title_ur: رکنیت کے ٹیئرز
  summary_bn: সীমা, সুবিধা এবং স্ট্যাটাস কীভাবে ধরে রাখা হয়।
  summary_hi: सीमाएँ, लाभ और स्थिति कैसे बनी रहती है।
  summary_ur: حدیں، فوائد اور اسٹیٹس کیسے برقرار رہتا ہے۔
  body_html_bn: <h2>সীমা</h2><p>ব্লু হল প্রবেশ টিয়ার। সিলভারের জন্য এক সদস্যপদ বছরে 25,000
    কোয়ালিফাইং মাইল প্রয়োজন, গোল্ডের জন্য 50,000, এবং প্ল্যাটিনামের জন্য 100,000। কোয়ালিফাইং
    মাইল দূরত্বভিত্তিক এবং আপনার ব্যালেন্স হিসেবে দেখানো রিডিমযোগ্য মাইল থেকে আলাদা।</p><p>গোল্ড
    ও প্ল্যাটিনাম সদস্য এবং হাইল্যান্ড ক্লাসের যাত্রীদের লাউঞ্জ প্রবেশাধিকার আছে; সিলভারের
    নেই।</p>
  body_html_hi: <h2>सीमाएँ</h2><p>ब्लू प्रवेश टियर है। सिल्वर के लिए एक सदस्यता वर्ष में 25,000
    क्वालिफ़ाइंग मील चाहिए, गोल्ड के लिए 50,000, और प्लैटिनम के लिए 100,000। क्वालिफ़ाइंग
    मील दूरी-आधारित हैं और आपके शेष के रूप में दिखाए गए रिडीम योग्य मील से अलग हैं।</p><p>गोल्ड
    और प्लैटिनम सदस्यों और हाइलैंड क्लास यात्रियों को लाउंज प्रवेश है; सिल्वर को नहीं।</p>
  body_html_ur: <h2>حدیں</h2><p>بلیو ابتدائی ٹیئر ہے۔ سلور کے لیے ایک رکنیتی سال میں 25,000
    کوالیفائنگ میلز درکار ہیں، گولڈ کے لیے 50,000، اور پلاٹینم کے لیے 100,000۔ کوالیفائنگ
    میلز فاصلے پر مبنی ہیں اور آپ کے بیلنس کے طور پر دکھائے گئے قابلِ ریڈیم میلز سے مختلف
    ہیں۔</p><p>گولڈ اور پلاٹینم ارکان اور ہائی لینڈ کلاس مسافروں کو لاؤنج رسائی حاصل ہے؛ سلور
    کو نہیں۔</p>
- slug: miles-expiry
  category: loyalty
  position: 3
  title_en: Mile validity and expiry
  title_am: የማይል ጊዜ ገደብና ማብቂያ
  summary_en: How long miles last and what keeps an account active.
  summary_am: ማይሎች ምን ያህል እንደሚቆዩና ሒሳብን ንቁ የሚያደርገው።
  body_html_en: <h2>Validity</h2><p>Redeemable miles are valid for 36 months from the month
    they are credited. Any earning or redemption activity extends the whole balance by a further
    36 months. An account with no activity for 24 months is made dormant and must be reactivated
    before miles can be used.</p>
  body_html_am: <h2>የጊዜ ገደብ</h2><p>ሊቤዡ የሚችሉ ማይሎች ከተመዘገቡበት ወር ጀምሮ ለ36 ወራት ይሠራሉ። ማንኛውም የማግኘት
    ወይም የመቤዠት እንቅስቃሴ ጠቅላላውን ቀሪ ሒሳብ በተጨማሪ 36 ወራት ያራዝማል። ለ24 ወራት እንቅስቃሴ የሌለው ሒሳብ ተኝቶ ይቀመጣል፤
    ማይሎች ከመዋላቸው በፊትም እንደገና መንቃት አለበት።</p>
  id: 16
  title_bn: মাইলের বৈধতা ও মেয়াদ
  title_hi: मील की वैधता और समाप्ति
  title_ur: میلز کی میعاد اور ختم ہونا
  summary_bn: মাইল কতদিন থাকে এবং কী অ্যাকাউন্ট সক্রিয় রাখে।
  summary_hi: मील कितने समय तक रहते हैं और क्या खाते को सक्रिय रखता है।
  summary_ur: میلز کتنے عرصے رہتے ہیں اور کیا اکاؤنٹ کو فعال رکھتا ہے۔
  body_html_bn: <h2>বৈধতা</h2><p>রিডিমযোগ্য মাইল জমা হওয়ার মাস থেকে 36 মাস বৈধ থাকে। যেকোনো
    অর্জন বা রিডেমশন কার্যকলাপ পুরো ব্যালেন্সকে আরও 36 মাস বাড়ায়। 24 মাস কোনো কার্যকলাপ
    না থাকা অ্যাকাউন্ট নিষ্ক্রিয় করা হয় এবং মাইল ব্যবহারের আগে পুনরায় সক্রিয় করতে হয়।</p>
  body_html_hi: <h2>वैधता</h2><p>रिडीम योग्य मील जमा होने के महीने से 36 महीने तक वैध हैं।
    कोई भी अर्जन या रिडेम्प्शन गतिविधि पूरे शेष को और 36 महीने बढ़ा देती है। 24 महीने तक बिना
    गतिविधि वाला खाता निष्क्रिय कर दिया जाता है और मील उपयोग करने से पहले उसे पुनः सक्रिय
    करना होता है।</p>
  body_html_ur: <h2>میعاد</h2><p>قابلِ ریڈیم میلز جمع ہونے کے مہینے سے 36 ماہ تک کارآمد ہیں۔
    کوئی بھی حصول یا ریڈیمپشن سرگرمی پورے بیلنس کو مزید 36 ماہ بڑھا دیتی ہے۔ 24 ماہ تک بغیر
    سرگرمی والا اکاؤنٹ غیر فعال کر دیا جاتا ہے اور میلز استعمال کرنے سے پہلے اسے دوبارہ فعال
    کرنا ہوتا ہے۔</p>
- slug: wifi-and-power
  category: onboard
  position: 2
  title_en: Power and connectivity on board
  title_am: በበረራ ላይ ኃይልና ግንኙነት
  summary_en: Which aircraft have sockets, and how connectivity differs by type.
  summary_am: የትኞቹ አውሮፕላኖች ሶኬት እንዳላቸው፣ እና ግንኙነት በዓይነት እንዴት እንደሚለያይ።
  body_html_en: <h2>Power</h2><p>Boeing 787-8 and Airbus A350-900 aircraft have a universal
    socket at every seat and USB at every seat. Boeing 737-800 and A320neo have USB only.
    Dash 8-400 and Embraer 175 have neither.</p><p>Connectivity is available only on Wi-Fi-equipped
    aircraft. Whether your own flight is equipped is shown on the flight status page for that
    flight.</p>
  body_html_am: <h2>ኃይል</h2><p>የቦይንግ 787-8 እና የኤርባስ A350-900 አውሮፕላኖች በእያንዳንዱ መቀመጫ ሁለንተናዊ ሶኬትና
    USB አላቸው። ቦይንግ 737-800 እና A320neo USB ብቻ አላቸው። ዳሽ 8-400 እና ኤምብራየር 175 ሁለቱም የላቸውም።</p><p>ግንኙነት
    የሚገኘው ዋይ-ፋይ ባላቸው አውሮፕላኖች ላይ ብቻ ነው። የራስዎ በረራ የተገጠመለት መሆኑ ለዚያ በረራ በበረራ ሁኔታ ገጽ ላይ ይታያል።</p>
  id: 17
  title_bn: উড়োজাহাজে বিদ্যুৎ ও সংযোগ
  title_hi: विमान में बिजली और कनेक्टिविटी
  title_ur: طیارے میں بجلی اور کنیکٹیویٹی
  summary_bn: কোন উড়োজাহাজে সকেট আছে, এবং ধরন অনুযায়ী সংযোগ কীভাবে আলাদা।
  summary_hi: किन विमानों में सॉकेट हैं, और प्रकार के अनुसार कनेक्टिविटी कैसे भिन्न है।
  summary_ur: کن طیاروں میں ساکٹ ہیں، اور قسم کے مطابق کنیکٹیویٹی کیسے مختلف ہے۔
  body_html_bn: <h2>বিদ্যুৎ</h2><p>Boeing 787-8 ও Airbus A350-900 উড়োজাহাজে প্রতিটি আসনে
    একটি ইউনিভার্সাল সকেট এবং প্রতিটি আসনে USB আছে। Boeing 737-800 ও A320neo-তে শুধু USB আছে।
    Dash 8-400 ও Embraer 175-এ কোনোটিই নেই।</p><p>সংযোগ শুধু ওয়াই-ফাই-সজ্জিত উড়োজাহাজে পাওয়া
    যায়। আপনার নিজের ফ্লাইট সজ্জিত কি না তা সেই ফ্লাইটের ফ্লাইট স্ট্যাটাস পৃষ্ঠায় দেখানো
    হয়।</p>
  body_html_hi: <h2>बिजली</h2><p>Boeing 787-8 और Airbus A350-900 विमानों में हर सीट पर एक
    यूनिवर्सल सॉकेट और हर सीट पर USB है। Boeing 737-800 और A320neo में केवल USB है। Dash 8-400
    और Embraer 175 में दोनों में से कुछ नहीं है।</p><p>कनेक्टिविटी केवल वाई-फ़ाई से सुसज्जित
    विमानों पर उपलब्ध है। आपकी उड़ान सुसज्जित है या नहीं, यह उस उड़ान के फ़्लाइट स्टेटस पृष्ठ
    पर दिखाया जाता है।</p>
  body_html_ur: <h2>بجلی</h2><p>Boeing 787-8 اور Airbus A350-900 طیاروں میں ہر سیٹ پر ایک
    یونیورسل ساکٹ اور ہر سیٹ پر USB ہے۔ Boeing 737-800 اور A320neo میں صرف USB ہے۔ Dash 8-400
    اور Embraer 175 میں دونوں میں سے کچھ نہیں۔</p><p>کنیکٹیویٹی صرف وائی فائی سے لیس طیاروں
    پر دستیاب ہے۔ آپ کی اپنی پرواز لیس ہے یا نہیں، یہ اس پرواز کے فلائٹ اسٹیٹس صفحے پر دکھایا
    جاتا ہے۔</p>
- slug: entertainment
  category: onboard
  position: 3
  title_en: In-flight entertainment
  title_am: በበረራ ላይ መዝናኛ
  summary_en: What is available, and on which aircraft.
  summary_am: የሚገኘው ምንድን ነው፣ እና በየትኞቹ አውሮፕላኖች።
  body_html_en: <h2>Seat-back and streaming</h2><p>Wide-body aircraft have seat-back screens
    with roughly 200 films, 60 series and a music library. Narrow-body aircraft stream the
    same library to your own device over the on-board network, which does not require a Wi-Fi
    package.</p>
  body_html_am: <h2>የመቀመጫ ጀርባና ስርጭት</h2><p>ሰፊ አካል ያላቸው አውሮፕላኖች በግምት 200 ፊልሞች፣ 60 ተከታታዮችና የሙዚቃ
    ቤተ መጻሕፍት ያሉት የመቀመጫ ጀርባ ስክሪን አላቸው። ጠባብ አካል ያላቸው አውሮፕላኖች ተመሳሳዩን ቤተ መጻሕፍት በበረራ ላይ አውታረ መረብ
    ወደ የራስዎ መሣሪያ ያሰራጫሉ፤ ይህም የዋይ-ፋይ ፓኬጅ አይፈልግም።</p>
  id: 18
  title_bn: ইন-ফ্লাইট বিনোদন
  title_hi: इन-फ़्लाइट मनोरंजन
  title_ur: دورانِ پرواز تفریح
  summary_bn: কী পাওয়া যায়, এবং কোন উড়োজাহাজে।
  summary_hi: क्या उपलब्ध है, और किन विमानों पर।
  summary_ur: کیا دستیاب ہے، اور کن طیاروں پر۔
  body_html_bn: <h2>সিট-ব্যাক ও স্ট্রিমিং</h2><p>ওয়াইড-বডি উড়োজাহাজে প্রায় 200টি চলচ্চিত্র,
    60টি সিরিজ ও একটি সংগীত লাইব্রেরিসহ সিট-ব্যাক স্ক্রিন আছে। ন্যারো-বডি উড়োজাহাজ একই লাইব্রেরি
    অনবোর্ড নেটওয়ার্কের মাধ্যমে আপনার নিজের ডিভাইসে স্ট্রিম করে, যার জন্য ওয়াই-ফাই প্যাকেজ
    লাগে না।</p>
  body_html_hi: <h2>सीट-बैक और स्ट्रीमिंग</h2><p>वाइड-बॉडी विमानों में लगभग 200 फ़िल्मों,
    60 सीरीज़ और एक संगीत लाइब्रेरी वाली सीट-बैक स्क्रीन हैं। नैरो-बॉडी विमान वही लाइब्रेरी
    ऑन-बोर्ड नेटवर्क के ज़रिए आपके अपने डिवाइस पर स्ट्रीम करते हैं, जिसके लिए वाई-फ़ाई पैकेज
    की ज़रूरत नहीं होती।</p>
  body_html_ur: <h2>سیٹ بیک اور اسٹریمنگ</h2><p>وائیڈ باڈی طیاروں میں تقریباً 200 فلموں، 60
    سیریز اور ایک میوزک لائبریری والی سیٹ بیک اسکرینیں ہیں۔ نیرو باڈی طیارے وہی لائبریری آن
    بورڈ نیٹ ورک کے ذریعے آپ کے اپنے ڈیوائس پر اسٹریم کرتے ہیں، جس کے لیے وائی فائی پیکیج
    درکار نہیں۔</p>
