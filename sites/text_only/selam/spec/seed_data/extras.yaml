  terms_bn: শুধু মূল ভাড়ায় প্রযোজ্য, করে নয়। বুকিংপ্রতি একটি প্রমোশন। অ্যাওয়ার্ড টিকিট
    বা কর্পোরেট ছাড়ের সঙ্গে মেলানো যায় না। আসন সীমিত।
  terms_hi: केवल मूल किराए पर लागू, करों पर नहीं। प्रति बुकिंग एक प्रमोशन। अवार्ड टिकट या
    कॉर्पोरेट छूट के साथ नहीं जोड़ा जा सकता। सीटें सीमित हैं।
  terms_ur: صرف بنیادی کرائے پر لاگو، ٹیکسوں پر نہیں۔ فی بکنگ ایک پروموشن۔ ایوارڈ ٹکٹوں یا
    کارپوریٹ رعایت کے ساتھ ملایا نہیں جا سکتا۔ نشستیں محدود ہیں۔
