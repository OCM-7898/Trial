<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <!-- Selam Airways roundel. Original work: circle plus three rotated rounded
       bars. Simple geometric primitives only, drawn from scratch (CLAUDE.md 3).
       The airline NAME is deliberately not in this file - it is rendered as live
       HTML text through t() beside the mark. That keeps one asset for both
       builds, avoids embedding a font inside an <img>-loaded SVG (where page
       @font-face does not apply), and lets the Amharic build show Ge'ez without
       a second file. -->
  <circle cx="32" cy="32" r="31" fill="#0B5D51"/>
  <g transform="rotate(-45 32 32)" fill="#E8A33D">
    <rect x="13" y="21" width="38" height="6" rx="3"/>
    <rect x="17" y="30" width="30" height="6" rx="3"/>
    <rect x="21" y="39" width="22" height="6" rx="3"/>
  </g>
</svg>
